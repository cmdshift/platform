apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-s3-credentials
  namespace: objects
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: main
    kind: ClusterSecretStore
  dataFrom:
    - extract:
        key: objects/thanos-s3-credentials
  # Merge, not Owner: the S3Credentials controller owns these Secrets
  # (it created them first-mover and mints/rotates keys) — ESO only
  # converges the seeded values (cmdshift/platform#125)
  target:
    creationPolicy: Merge
