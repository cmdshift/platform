# NSA hardening: every workload in objects runs on the default SA (the Seaweed CRD has
# no serviceAccountName/automount knobs) and none call the API. Pods that need a token
# can opt in at pod level. Keep this namespace tokenless-by-default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: objects
automountServiceAccountToken: false
