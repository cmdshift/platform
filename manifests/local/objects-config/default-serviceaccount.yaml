# C-0034 (kubescape NSA): every workload in objects (the seaweed cluster
# pods and the admin deployment) runs on the default SA — the Seaweed CRD has
# no serviceAccountName/automount knobs — and none of them call the API. Pods
# that ever need a token can still opt in at pod level
# (automountServiceAccountToken: true wins over the SA setting).
# Scope note: keep this namespace tokenless-by-default; only storage workloads
# live here. The operator itself runs in seaweedfs-operator and is unaffected.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: objects
automountServiceAccountToken: false
