apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: main
  namespace: objects
spec:
  # runAsUser must be set on first deploy: seaweedfs creates its PV data dirs
  # as this user. Retrofitting an existing root-owned deployment requires a
  # one-time chown of the volumes.
  image: index.docker.io/chrislusf/seaweedfs:4.44
  volumeServerDiskCount: 1
  master:
    replicas: 1
    volumeSizeLimitMB: 1024
    requests:
      cpu: 10m
      memory: 108Mi
    limits:
      cpu: 100m
      memory: 160Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      # no readOnlyRootFilesystem here: master has no persistence knob in this
      # CR and writes its wal/segment files to /data on the container's root fs
  volume:
    replicas: 1
    storageClassName: local-path
    requests:
      storage: 10Gi
      cpu: 10m
      memory: 88Mi
    limits:
      cpu: 200m
      memory: 132Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      # C-0017 (kubescape NSA): volume server writes only to its -dir (/data0)
      readOnlyRootFilesystem: true
  filer:
    replicas: 1
    requests:
      cpu: 10m
      memory: 168Mi
    limits:
      cpu: 200m
      memory: 252Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      # C-0017 (kubescape NSA): filer writes its metadata to the /data PVC,
      # but the unix socket it gRPC-serves lives in /tmp — that stays a
      # writable emptyDir
      readOnlyRootFilesystem: true
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    persistence:
      enabled: true
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi
  s3:
    replicas: 1
    requests:
      cpu: 10m
      memory: 112Mi
    limits:
      cpu: 200m
      memory: 168Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      # C-0017 (kubescape NSA): the s3 gateway is stateless — multipart parts
      # stage on the filer (/.uploads), not on local disk — but it also drops
      # sockets/temp files in /tmp, so keep that writable
      readOnlyRootFilesystem: true
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    configSecret:
      name: seaweedfs-s3-config
      key: s3.json
