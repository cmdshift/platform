apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: main
  namespace: objects
spec:
  # runAsUser must be set on first deploy: seaweedfs creates its PV data dirs
  # as this user. Retrofitting an existing root-owned deployment requires a
  # one-time chown of the volumes.
  image: index.docker.io/chrislusf/seaweedfs:4.44
  volumeServerDiskCount: 1
  master:
    replicas: 1
    volumeSizeLimitMB: 1024
    requests:
      cpu: 10m
      memory: 108Mi
    limits:
      cpu: 100m
      memory: 160Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  volume:
    replicas: 1
    storageClassName: local-path
    requests:
      storage: 10Gi
      cpu: 10m
      memory: 88Mi
    limits:
      cpu: 200m
      memory: 132Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  filer:
    replicas: 1
    requests:
      cpu: 10m
      memory: 168Mi
    limits:
      cpu: 200m
      memory: 252Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    persistence:
      enabled: true
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi
  s3:
    replicas: 1
    requests:
      cpu: 10m
      memory: 112Mi
    limits:
      cpu: 200m
      memory: 168Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    configSecret:
      name: seaweedfs-s3-config
      key: s3.json
