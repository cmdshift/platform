apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: objects
spec:
  hard:
    # sized to the seaweed cluster + operator + admin (cmdshift/platform#93); 2x
    # request-sum headroom absorbs the VPA gap on main-volume/main-s3
    requests.cpu: 250m
    requests.memory: 2500Mi
    limits.cpu: 6
    limits.memory: 3500Mi
    pods: "15"
