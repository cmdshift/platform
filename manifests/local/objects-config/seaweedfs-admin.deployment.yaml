apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-admin
  namespace: objects
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs-admin
  template:
    metadata:
      labels:
        app: seaweedfs-admin
    spec:
      # NSA hardening: the admin server proxies to the master over
      # HTTP and never calls the API
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          image: chrislusf/seaweedfs:4.44
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # NSA hardening: explicit non-root uid/gid — the image
            # defaults to root; pod-level runAsUser 65534 left gid implicit 0
            runAsUser: 65534
            runAsGroup: 65534
            # NSA hardening: admin is stateless (no local writes)
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              # request audit 2026-09-06: steady 62Mi against the old 96Mi
              # request (65%); 104Mi = observed peak x 1.2
              memory: 104Mi
            limits:
              cpu: 100m
              memory: 144Mi
          args:
            - admin
            - --master=main-master.objects.svc:9333
            - --port=23646
          ports:
            - containerPort: 23646
