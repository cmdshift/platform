skipCRDs: true
image:
  tag: "2.3.2"
# audit: 7d peak 1.1m/31Mi — peak x 1.2 (chart default was ~90x idle CPU)
resources:
  requests:
    cpu: 10m
    memory: 40Mi
  limits:
    cpu: 200m
    memory: 60Mi
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - "ALL"
  seccompProfile:
    type: RuntimeDefault
