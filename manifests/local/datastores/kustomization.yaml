apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# every resource in this dir targets the datastores namespace — the
# HelmReleases' explicit namespaces match, so nothing is clobbered
namespace: datastores
resources:
  - cloudnative-pg.helm-release.yaml
  - valkey-operator.helm-release.yaml
  - nats.helm-release.yaml
  - nack.helm-release.yaml
configMapGenerator:
  - name: cloudnative-pg-values
    namespace: datastores
    files:
      - values.yaml=cloudnative-pg-values.yaml
    options:
      disableNameSuffixHash: true
  - name: valkey-operator-values
    namespace: datastores
    files:
      - values.yaml=valkey-operator-values.yaml
    options:
      disableNameSuffixHash: true
  - name: nats-values
    namespace: datastores
    files:
      - values.yaml=nats-values.yaml
    options:
      disableNameSuffixHash: true
  - name: nack-values
    namespace: datastores
    files:
      - values.yaml=nack-values.yaml
    options:
      disableNameSuffixHash: true
