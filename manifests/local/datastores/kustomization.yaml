apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# every resource in this dir targets the datastores namespace — the sole
# deviation from the no-namespace-transformer convention (manifests/local/README.md);
# the HelmReleases' explicit namespaces match, so nothing is clobbered
namespace: datastores
resources:
  - cloudnative-pg.helm-release.yaml
  - valkey-operator.helm-release.yaml
  - emqx-operator.helm-release.yaml
configMapGenerator:
  - name: cloudnative-pg-values
    namespace: datastores
    files:
      - values.yaml=cloudnative-pg-values.yaml
    options:
      disableNameSuffixHash: true
  - name: valkey-operator-values
    namespace: datastores
    files:
      - values.yaml=valkey-operator-values.yaml
    options:
      disableNameSuffixHash: true
  - name: emqx-operator-values
    namespace: datastores
    files:
      - values.yaml=emqx-operator-values.yaml
    options:
      disableNameSuffixHash: true
