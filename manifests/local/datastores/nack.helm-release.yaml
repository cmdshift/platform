apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nack
  namespace: datastores
spec:
  interval: 1h
  dependsOn:
    - name: nats
  chart:
    spec:
      chart: nack
      version: 0.35.0
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: nack-values
      valuesKey: values.yaml
