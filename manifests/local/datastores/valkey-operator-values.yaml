# chart default is already admission-clean (pod-level runAsNonRoot +
# RuntimeDefault seccomp, container-level APE/caps/roFS) and house-convention
# CPU (10m req / 500m lim) — only the scrape wiring and memory sizing need
# values
resources:
  requests:
    cpu: 10m
    # chart default 64Mi; 7d max 30Mi, VPA rec 47Mi — 40Mi = peak x 1.2,
    # limit 1.5x (cmdshift/platform#66)
    memory: 40Mi
  limits:
    cpu: 500m
    memory: 60Mi
metrics:
  enabled: true
  # the SM key nests under metrics. — a top-level serviceMonitor: is silently
  # ignored (schema-less chart, caught by the missing SM on-cluster)
  serviceMonitor:
    enabled: true
