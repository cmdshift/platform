apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: emqx-operator
  namespace: datastores
spec:
  interval: 1h
  chart:
    spec:
      chart: emqx-operator
      version: 2.3.2
      sourceRef:
        kind: HelmRepository
        name: emqx
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  postRenderers:
    - kustomize:
        patches:
          # the pre-upgrade hook Job renders no resources — admission would
          # deny its pod and wedge the install; security contexts flow in via
          # the chart's own values, resources have no values knob
          - target:
              kind: Job
              name: emqx-operator-pre-upgrade
            patch: |
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: emqx-operator-pre-upgrade
              spec:
                template:
                  spec:
                    containers:
                      - name: cleanup
                        resources:
                          requests:
                            cpu: 50m
                            memory: 64Mi
                          limits:
                            cpu: 200m
                            memory: 256Mi
  valuesFrom:
    - kind: ConfigMap
      name: emqx-operator-values
      valuesKey: values.yaml
