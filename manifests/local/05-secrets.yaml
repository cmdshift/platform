apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10s
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: network-policies
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/05-secrets
  prune: true
  wait: true
  timeout: 5m
