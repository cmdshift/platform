apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: monitoring
spec:
  interval: 12h
  releaseName: prometheus-operator-crds
  chart:
    spec:
      chart: prometheus-operator-crds
      version: "31.0.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    crds:
      servicemonitors:
        enabled: true
      podmonitors:
        enabled: true
      prometheusrules:
        enabled: true
