apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: perses
  namespace: monitoring
spec:
  interval: 12h
  releaseName: perses
  chart:
    spec:
      chart: perses
      version: "0.23.2"
      sourceRef:
        kind: HelmRepository
        name: perses
        namespace: flux-system
  values:
    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    extraObjects:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: perses-datasources
          namespace: monitoring
          labels:
            perses.dev/provision: "true"
        data:
          prometheus.yaml: |
            kind: PrometheusDatasource
            metadata:
              name: prometheus
              project: default
            spec:
              default: true
              direct_url: "http://prometheus-server.monitoring.svc.cluster.local:8080"
