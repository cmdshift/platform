apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 12h
  releaseName: prometheus
  chart:
    spec:
      chart: prometheus
      version: "29.24.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    server:
      retention: 7d
      retentionSize: 5GB
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClass: local-path
    alertmanager:
      enabled: false
    kube-state-metrics:
      enabled: true
    prometheus-node-exporter:
      enabled: false
    prometheus-pushgateway:
      enabled: false
