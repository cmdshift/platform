apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: networking
    - name: metrics
    - name: objects-config
    - name: secrets-config
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/monitoring
  prune: true
  wait: true
  timeout: 10m
