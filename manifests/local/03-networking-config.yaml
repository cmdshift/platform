apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: networking-config
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 5s
  dependsOn:
    - name: networking
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/03-networking-config
  prune: true
  wait: true
