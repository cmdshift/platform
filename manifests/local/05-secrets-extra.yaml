apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-extra
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 5s
  dependsOn:
    - name: secrets
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/05-secrets-extra
  prune: true
  wait: true
  timeout: 5m
