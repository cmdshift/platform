apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux
  namespace: flux-system
spec:
  interval: 12h
  releaseName: flux
  chart:
    spec:
      chart: flux2
      version: "2.19.0"
      sourceRef:
        kind: HelmRepository
        name: fluxcd-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    imageAutomationController:
      create: false
    imageReflectionController:
      create: false
    helmController:
      # NSA hardening: pod-level non-root — the chart already sets it
      # at container level; this pins it at pod level too
      podSecurityContext:
        runAsNonRoot: true
      # NSA hardening: explicit non-root gid. NOTE: this chart's
      # securityContext template replaces (not merges) its defaults when any
      # value is set, so the full container context must be spelled out —
      # providing only runAsGroup silently dropped APE/caps/roFS (hit live)
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      resources:
        # 2026-09-06 overnight: sawtooth 69-248Mi against the old 200Mi request
        # (124% at peak) — request = P99 x 1.2; 512Mi limit holds (peak 48%)
        requests:
          cpu: 50m
          memory: 288Mi
        limits:
          cpu: 1000m
          memory: 512Mi
    kustomizeController:
      container:
        additionalArgs:
          - --requeue-dependency=5s
      # steady 127-164Mi against the old 128Mi request (99-128% — first in line
      # for eviction under node pressure); 2026-09-06 overnight request =
      # P99 x 1.2. 512Mi limit holds (peak 32%); delivery components wedge the
      # whole pipeline when starved (see AGENTS.md sizing section)
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          cpu: 1000m
          memory: 512Mi
      securityContext:
        # see the helmController note: values replace the chart's sc defaults
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      podSecurityContext:
        runAsNonRoot: true
    notificationController:
      resources:
        requests:
          cpu: 10m
          memory: 80Mi
        limits:
          cpu: 200m
          memory: 120Mi
      securityContext:
        # see the helmController note: values replace the chart's sc defaults
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      podSecurityContext:
        runAsNonRoot: true
    sourceController:
      resources:
        requests:
          cpu: 50m
          # request audit 2026-09-06: steady 102Mi against the old 160Mi
          # request (64%); 224Mi = observed x 1.2 — then the full overnight
          # window peaked 220Mi = 98% of 224Mi, so 256Mi (peak x 1.2)
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      securityContext:
        # see the helmController note: values replace the chart's sc defaults
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      podSecurityContext:
        runAsNonRoot: true
