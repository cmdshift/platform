apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux
  namespace: flux-system
spec:
  interval: 12h
  releaseName: flux
  chart:
    spec:
      chart: flux2
      version: "2.19.0"
      sourceRef:
        kind: HelmRepository
        name: fluxcd-community
        namespace: flux-system
  values:
    imageAutomationController:
      create: false
    imageReflectionController:
      create: false
    kustomizeController:
      container:
        additionalArgs:
          - --requeue-dependency=5s
        # resources:
        #   requests:
        #     cpu: ""
        #     memory: ""
        #   limits:
        #     cpu: ""
        #     memory: ""
