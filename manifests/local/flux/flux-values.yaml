imageAutomationController:
  create: false
imageReflectionController:
  create: false
helmController:
  # NSA hardening: pod-level non-root — the chart already sets it
  # at container level; this pins it at pod level too
  podSecurityContext:
    runAsNonRoot: true
  # NSA hardening: explicit non-root gid. NOTE: this chart's
  # securityContext template replaces (not merges) its defaults when any
  # value is set, so the full container context must be spelled out —
  # providing only runAsGroup silently dropped APE/caps/roFS (hit live)
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  resources:
    # overnight: sawtooth 69-248Mi — request = P99 x 1.2; 512Mi limit holds (peak 48%)
    requests:
      cpu: 50m
      memory: 288Mi
    limits:
      cpu: 1000m
      memory: 512Mi
kustomizeController:
  container:
    additionalArgs:
      - --requeue-dependency=5s
  # audit: steady 178Mi (first in line for eviction under node pressure) —
  # 224Mi = P99 x 1.2; 512Mi limit holds. Delivery components wedge the
  # whole pipeline when starved (see flux/README.md sizing section)
  resources:
    requests:
      cpu: 50m
      memory: 224Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  securityContext:
    # see the helmController note: values replace the chart's sc defaults
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  podSecurityContext:
    runAsNonRoot: true
notificationController:
  resources:
    requests:
      cpu: 10m
      memory: 80Mi
    limits:
      cpu: 200m
      memory: 120Mi
  securityContext:
    # see the helmController note: values replace the chart's sc defaults
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  podSecurityContext:
    runAsNonRoot: true
sourceController:
  resources:
    requests:
      cpu: 50m
      # audit: steady 260Mi — 320Mi = P99 x 1.2
      memory: 320Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  securityContext:
    # see the helmController note: values replace the chart's sc defaults
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  podSecurityContext:
    runAsNonRoot: true
