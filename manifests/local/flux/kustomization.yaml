apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# every yaml in the dir must be registered here — unregistered files get pruned by flux
resources:
  - flux.helm-release.yaml
configMapGenerator:
  - name: flux-values
    namespace: flux-system
    files:
      - values.yaml=flux-values.yaml
    options:
      disableNameSuffixHash: true
