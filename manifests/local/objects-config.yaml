apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: objects-config
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 5s
  dependsOn:
    - name: secrets-config
    - name: objects
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/objects-config
  prune: true
  wait: true
  timeout: 5m
