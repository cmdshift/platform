# The ROOT kustomization — applies every child under manifests/local/. Duplicated in
# cluster/local/bootstrap extraObjects for fresh installs; flux-config force-adopts and
# converges it on first reconcile. The live object's helm.sh/hook annotation is inert.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local
  prune: true
  timeout: 5m
  # deviation from the bootstrap twin: MirrorPrune would GC the whole tree if this CR
  # were deleted; Orphan turns that accident into an orphaned-but-running cluster
  deletionPolicy: Orphan
