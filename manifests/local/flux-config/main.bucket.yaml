# The pipeline's source. Duplicated in cluster/local/bootstrap extraObjects
# (helm post-install hooks) for fresh installs — close enough, not identical
# (the twin omits provider/timeout; the CRD defaults fill them); flux-config
# force-adopts this object and converges it on first reconcile.
apiVersion: source.toolkit.fluxcd.io/v1
kind: Bucket
metadata:
  name: main
  namespace: flux-system
spec:
  # 5m, not 1m: a poll mid-edit publishes a half-mirrored artifact and the
  # whole chain starts applying it (the sync container's inotify lag is the
  # documented hazard). The manual flow (sync_wait + flux_wait --with-source)
  # forces an immediate pull, so interactive latency is unaffected; the
  # bootstrap twin's tighter interval keeps the one-shot rebuild fast.
  interval: 5m
  endpoint: s3.cloud.test
  bucketName: flux
  secretRef:
    name: bucket-credentials
  insecure: true
  provider: generic
  timeout: 60s
