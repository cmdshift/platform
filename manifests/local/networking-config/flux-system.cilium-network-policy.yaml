apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-system
  namespace: flux-system
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
  egress:
    # K8s API server
    - toEntities:
        - kube-apiserver
    # Intra-namespace (inter-controller traffic)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: flux-system
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    # All HTTPS egress (registries, S3, GitHub, Helm repos, etc.)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
