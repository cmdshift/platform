apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: velero
  namespace: velero
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
    # S3 (RustFS via haproxy)
    - toFQDNs:
        - matchName: s3.cloud.test
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Node agent reads PVCs on the node (hostPath)
    - toEntities:
        - host
