apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sources
  namespace: flux-system
spec:
  # drift-heal only: propagation is event-driven; manual flow = sync_wait + flux_wait
  interval: 1h
  retryInterval: 5s
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/sources
  prune: true
  wait: true
  timeout: 5m
