apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cni
  namespace: flux-system
spec:
  interval: 10s
  retryInterval: 5s
  dependsOn:
    - name: crds
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/03-cni
  prune: true
  wait: true
  timeout: 10m
