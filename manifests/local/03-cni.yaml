apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cni
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 5s
  dependsOn:
    - name: crds
    - name: sources
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/03-cni
  prune: true
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: cilium
      namespace: kube-system
