apiVersion: monitoring.thanos.io/v1alpha1
kind: ThanosCompact
metadata:
  name: main
  namespace: monitoring
spec:
  # JSON logging: see main.thanos-query.yaml
  additionalArgs:
    - --log.format=json
  objectStorageConfig:
    name: thanos-objstore
    key: objstore.yaml
  securityContext:
    # NSA hardening: thanos image runs as nobody; pod-level is the
    # only non-root knob the CRD exposes (no per-container securityContext)
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  retentionConfig:
    raw: 7d
    fiveMinutes: 30d
    oneHour: 180d
  # compaction is inherently bursty: OOMKilled twice at 60Mi and
  # CPU pegged 200m at 92% throttle during compaction runs — generous burst
  # room on both axes (see AGENTS.md sizing conventions). overnight
  # re-audit: sawtooth peaks ~230Mi — request = P99 x 1.2,
  # limit = 1.5x request
  resourceRequirements:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 384Mi
  storage:
    size: 10Gi
  logFormat: json
