apiVersion: monitoring.thanos.io/v1alpha1
kind: ThanosStore
metadata:
  name: main
  namespace: monitoring
spec:
  # JSON logging: see main.thanos-query.yaml
  additionalArgs:
    - --log.format=json
  objectStorageConfig:
    name: thanos-objstore
    key: objstore.yaml
  securityContext:
    # NSA hardening: thanos image runs as nobody; pod-level is the
    # only non-root knob the CRD exposes (no per-container securityContext)
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  shardingStrategy:
    type: block
    shards: 1
  resourceRequirements:
    requests:
      cpu: 10m
      # 7d mem max 26Mi, VPA rec 35Mi — 40Mi = peak x 1.2, limit 1.5x
      # (cmdshift/platform#66)
      memory: 40Mi
    limits:
      cpu: 200m
      memory: 60Mi
  storage:
    size: 5Gi
  logFormat: json
