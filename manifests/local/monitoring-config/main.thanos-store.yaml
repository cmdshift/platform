apiVersion: monitoring.thanos.io/v1alpha1
kind: ThanosStore
metadata:
  name: main
  namespace: monitoring
spec:
  objectStorageConfig:
    name: thanos-objstore
    key: objstore.yaml
  securityContext:
    # NSA hardening: thanos image runs as nobody; pod-level is the
    # only non-root knob the CRD exposes (no per-container securityContext)
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  shardingStrategy:
    type: block
    shards: 1
  resourceRequirements:
    requests:
      cpu: 10m
      memory: 56Mi
    limits:
      cpu: 200m
      memory: 84Mi
  storage:
    size: 5Gi
  logFormat: json
