groups:
  - name: pod-alerts
    rules:
      - alert: PodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total[5m]) > 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping ({{ $value }} restarts in 15m)"
  - name: memory-alerts
    rules:
      - alert: ContainerOOMKilled
        expr: |
          increase(kube_pod_container_status_restarts_total[10m]) > 0
            and on(namespace, pod, container)
          kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOM-killed — limit too low or a leak"
  - name: node-alerts
    rules:
      - alert: NodeHighDiskUsage
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs"} / node_filesystem_size_bytes{fstype!~"tmpfs"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 85% on {{ $labels.instance }}"
  - name: backup-alerts
    rules:
      - alert: VeleroBackupStale
        expr: |
          time() - velero_backup_last_successful_timestamp{schedule="pvcs"} > 93600
        labels:
          severity: warning
        annotations:
          summary: "No successful velero backup in 26h (schedule pvcs) — nightly 03:00 run missed or failing"
      - alert: VeleroBackupFailed
        expr: |
          increase(velero_backup_failure_total[24h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A velero backup failed in the last 24h (schedule {{ $labels.schedule }})"
  - name: tetragon-alerts
    rules:
      - alert: TetragonTracingPolicyLoadFailed
        expr: |
          tetragon_tracingpolicy_loaded{state=~"error|load_error"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tetragon on {{ $labels.pod }} ({{ $labels.node }}) has a tracing policy in {{ $labels.state }} — a policy file may be invalid or use a hook this kernel lacks"
      - alert: TetragonEnforcementKill
        expr: |
          increase(tetragon_kill_events_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Tetragon enforcement killed a process on {{ $labels.pod }} ({{ $labels.node }}) — check tetra getevents for the policy and binary"
        # tetragon_kill_events_total materializes on the first enforcement
        # event (stage 2) — until then the series is absent and this alert
        # stays inactive by design, arming exactly when enforcement goes live
  - name: trivy-alerts
    rules:
      - alert: TrivyCriticalImageVulnerabilities
        expr: |
          sum by (namespace) (trivy_image_vulnerabilities{severity="Critical", namespace=~"kube-system|flux-system|certificates|secrets|policies|storage|objects|monitoring|backups|logging|security"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "trivy reports {{ $value }} CRITICAL image vulnerabilities in {{ $labels.namespace }} — kubectl get vulnerabilityreports -A | grep {{ $labels.namespace }}"
        # metric name/labels from the v0.34.0 collector source
        # (pkg/metrics/collector.go: trivy_image_vulnerabilities, severity
        # label values are capitalized). ignoreUnfixed=false means unfixed
        # CVEs count too — on a test cluster this alert is informational and
        # may stay firing for a long time; mailpit absorbs it. Scoped to the
        # platform namespaces so app-image noise stays out of alerting.
