apiVersion: monitoring.thanos.io/v1alpha1
kind: ThanosRuler
metadata:
  name: main
  namespace: monitoring
spec:
  replicas: 1
  alertmanagerURL: "http://alertmanager-operated.monitoring.svc:9093"
  # JSON logging: see main.thanos-query.yaml
  additionalArgs:
    - --log.format=json
  queryLabelSelector:
    matchLabels:
      app.kubernetes.io/part-of: thanos
      app.kubernetes.io/component: query-layer
  ruleConfigSelector:
    matchLabels:
      operator.thanos.io/rule-file: "true"
  evaluationInterval: 1m
  securityContext:
    # NSA hardening: pod-level non-root also covers the operator's
    # config-reloader sidecar, which has no container-level securityContext of
    # its own (see the thanos-ruler PolicyException for its missing resources).
    # runAsUser must be numeric: the config-reloader image declares USER
    # "nobody", which kubelet can't verify against a bare runAsNonRoot
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  resourceRequirements:
    requests:
      cpu: 10m
      # audit: 56Mi steady = 100% of the old 56Mi request —
      # 72Mi = P99 x 1.2
      memory: 72Mi
    limits:
      cpu: 200m
      memory: 84Mi
  storage:
    storageClass: local-path
    size: 1Gi
  rulerMode:
    type: Stateful
    stateful:
      objectStorageConfig:
        name: thanos-objstore
        key: objstore.yaml
