apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - main.grafana.yaml
  - main.alertmanager.yaml
  - main.thanos-ruler.yaml
  - main.thanos-compact.yaml
  - main.thanos-query.yaml
  - main.thanos-store.yaml
  - mail.alertmanager-config.yaml
  - flux-system.alert.yaml
  - flux-system.provider.yaml
  - prometheus.grafana-datasource.yaml
  # the dotdc k8s-views dashboards were removed 2026-09-07 (superseded by
  # platform-deployment) — they're `url:` pointers to
  # github.com/dotdc/grafana-dashboards-kubernetes; re-add as 10-line CRs
  # (git log has them) whenever a reference view is wanted again
  - platform-deployment.grafana-dashboard.yaml
  - main-grafana-credentials.external-secret.yaml
configMapGenerator:
  - name: thanos-rules
    namespace: monitoring
    files:
      - thanos-rules.yaml
    options:
      labels:
        operator.thanos.io/rule-file: "true"
        operator.thanos.io/prometheus-rule: "true"
  - name: platform-deployment-dashboard
    namespace: monitoring
    files:
      - platform-deployment.dashboard.json
    # name-referenced by the GrafanaDashboard CR — a hash suffix would break the ref
    options:
      disableNameSuffixHash: true
