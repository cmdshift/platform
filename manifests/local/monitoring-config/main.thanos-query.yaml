apiVersion: monitoring.thanos.io/v1alpha1
kind: ThanosQuery
metadata:
  name: main
  namespace: monitoring
spec:
  replicas: 1
  # manual prometheus-head endpoint: the operator's label-based discovery
  # can't see the chart's discovery service — without it ruler rules
  # evaluate against empty vectors forever (AGENTS.md thanos landmine)
  additionalArgs:
    - --endpoint=dnssrv+_grpc._tcp.kube-prometheus-stack-thanos-discovery.monitoring.svc
    # JSON logging: see logging/loki-values.yaml
    - --log.format=json
  securityContext:
    # NSA hardening: thanos image runs as nobody; pod-level is the
    # only non-root knob the CRD exposes (no per-container securityContext)
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  resourceRequirements:
    requests:
      cpu: 10m
      # audit: 84Mi steady at first sizing; 7d max 50Mi (VPA rec 61Mi) —
      # 64Mi = peak x 1.2, limit 1.5x (cmdshift/platform#66)
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 96Mi
  customStoreLabelSelector:
    matchLabels:
      operator.thanos.io/store-api: "true"
  replicaLabels:
    - prometheus_replica
  logFormat: json
