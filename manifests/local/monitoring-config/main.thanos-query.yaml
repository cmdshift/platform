apiVersion: monitoring.thanos.io/v1alpha1
kind: ThanosQuery
metadata:
  name: main
  namespace: monitoring
spec:
  replicas: 1
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  resourceRequirements:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 96Mi
  customStoreLabelSelector:
    matchLabels:
      operator.thanos.io/store-api: "true"
  replicaLabels:
    - prometheus_replica
  logFormat: json
