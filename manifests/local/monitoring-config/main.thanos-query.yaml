apiVersion: monitoring.thanos.io/v1alpha1
kind: ThanosQuery
metadata:
  name: main
  namespace: monitoring
spec:
  replicas: 1
  # the prometheus sidecar's store API (served via the thanos-discovery
  # service). The operator's label-based discovery can't find that service —
  # it requires part-of=thanos, and overriding the chart's part-of label
  # breaks helm rendering (duplicate key). Without this endpoint the query
  # only sees block data (2h+ old) and ruler rules evaluate against empty
  # vectors forever.
  additionalArgs:
    - --endpoint=dnssrv+_grpc._tcp.kube-prometheus-stack-thanos-discovery.monitoring.svc
  securityContext:
    # NSA hardening: thanos image runs as nobody; pod-level is the
    # only non-root knob the CRD exposes (no per-container securityContext)
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  resourceRequirements:
    requests:
      cpu: 10m
      # 2026-09-07 audit: 84Mi steady = 131% of the old 64Mi request and 88%
      # of the old 96Mi limit — 112Mi = P99 x 1.2, limit 1.5x
      memory: 112Mi
    limits:
      cpu: 200m
      memory: 160Mi
  customStoreLabelSelector:
    matchLabels:
      operator.thanos.io/store-api: "true"
  replicaLabels:
    - prometheus_replica
  logFormat: json
