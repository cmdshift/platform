apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: platform-deployment
  namespace: monitoring
  annotations:
    # tracks the dashboard's origin issue
    platform.local/issue: "39"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  # Dashboard JSON comes from the configMapGenerator (platform-deployment.dashboard.json)
  # — keeps the CR readable; url: is only for mirroring upstream dashboards (issue #39).
  configMapRef:
    name: platform-deployment-dashboard
    key: platform-deployment.dashboard.json
  # Operator only re-reads the configMapRef content on a resync (metadata-only
  # CR changes are filtered out, so annotations do NOT trigger a re-apply).
  # 5m bounds how long a JSON-only edit can linger — bump a spec field (or wait
  # this out) after editing platform-deployment.dashboard.json.
  resyncPeriod: 5m
  # no content cache — a cached fetch was observed serving a stale ConfigMap
  # after a JSON-only edit; 0 forces a re-read on every reconcile
  contentCacheDuration: "0s"
