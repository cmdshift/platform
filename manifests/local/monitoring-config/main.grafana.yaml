apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: monitoring
  labels:
    dashboards: grafana
spec:
  config:
    log:
      mode: console
  disableDefaultAdminSecret: true
  deployment:
    spec:
      template:
        spec:
          # NSA hardening: grafana only serves HTTP — no SA
          # token needed; non-root at pod level (grafana image runs as uid 472)
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
          containers:
            - name: grafana
              resources:
                requests:
                  cpu: 10m
                  memory: 320Mi
                limits:
                  cpu: 200m
                  memory: 480Mi
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: main-grafana-credentials
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: main-grafana-credentials
                      key: GF_SECURITY_ADMIN_PASSWORD
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: local-path
