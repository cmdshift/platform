apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: monitoring
  labels:
    dashboards: grafana
spec:
  config:
    log:
      mode: console
  disableDefaultAdminSecret: true
  deployment:
    spec:
      template:
        spec:
          # NSA hardening: grafana only serves HTTP — no SA
          # token needed; non-root at pod level (grafana image runs as uid 472)
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
          containers:
            - name: grafana
              resources:
                requests:
                  cpu: 10m
                  memory: 320Mi
                limits:
                  cpu: 200m
                  memory: 480Mi
              env:
                # JSON logging (2026-09-07): env beats grafana.ini, and the
                # operator's validating webhook rejects spec.config.log.console
                # (strict-decoded vendored type) — [log] format alone is
                # ignored by grafana 13, so the env override is the only path
                - name: GF_LOG_CONSOLE_FORMAT
                  value: json
                # the deployment dashboard's preset strip renders button-styled
                # links via a text panel (html mode + inline styles) — the
                # sanitizer strips style attributes. Content is repo-authored
                # only (no user-generated dashboards), so the guard is off
                - name: GF_PANELS_DISABLE_SANITIZE_HTML
                  value: "true"
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: main-grafana-credentials
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: main-grafana-credentials
                      key: GF_SECURITY_ADMIN_PASSWORD
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: local-path
