# routes alerts to mailpit (smtp.cloud.test) — read them at http://mail.cloud.test
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: mail
  namespace: monitoring
spec:
  route:
    groupBy: [alertname, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: email
    routes:
      # kube-proxy targets are down until the rebuild lands the metrics
      # bind-address fix (cmdshift/platform#23) — mute instead of emailing.
      # REMOVE after the rebuild.
      - matchers:
          - name: job
            value: kube-proxy
        receiver: "null"
  receivers:
    - name: email
      emailConfigs:
        - to: you@cloud.test
          smarthost: "smtp.cloud.test:25"
          from: alertmanager@cloud.test
          requireTLS: false
          sendResolved: true
    # no integrations — sink for the muted kube-proxy TargetDown
    # (quoted: bare `null` parses as a YAML null and the CRD rejects it)
    - name: "null"
