apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# flux-system (flux2 HelmRelease) and kube-system (cluster-owned) are not managed here
resources:
  - policies.namespace.yaml
  - certificates.namespace.yaml
  - secrets.namespace.yaml
  - storage.namespace.yaml
  - datastores.namespace.yaml
  - monitoring.namespace.yaml
  - objects.namespace.yaml
  - logging.namespace.yaml
  - backups.namespace.yaml
  - security.namespace.yaml
