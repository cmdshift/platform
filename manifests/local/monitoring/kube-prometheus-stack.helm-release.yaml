apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    alertmanager:
      enabled: false
      # resources:
      #   requests:
      #     cpu: ""
      #     memory: ""
      #   limits:
      #     cpu: ""
      #     memory: ""
    prometheus:
      prometheusSpec:
        retention: 2d
        externalLabels:
          cluster: local
        thanos:
          objectStorageConfig:
            existingSecret:
              name: thanos-objstore
              key: objstore.yaml
      thanosService:
        enabled: true
      thanosServiceMonitor:
        enabled: true
      # resources:
      #   requests:
      #     cpu: ""
      #     memory: ""
      #   limits:
      #     cpu: ""
      #     memory: ""
    grafana:
      enabled: false
      # resources:
      #   requests:
      #     cpu: ""
      #     memory: ""
      #   limits:
      #     cpu: ""
      #     memory: ""
