podSecurityContext:
  # NSA hardening: pod-level non-root (container-level comes from
  # the chart defaults); operator image is distroless nonroot
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
# NSA hardening: explicit non-root uid/gid at container level
# (image runs as 65532, gid was implicit 0 before). Chart default already
# sets roFS + runAsNonRoot on the container; these merge in
securityContext:
  runAsUser: 65532
  runAsGroup: 65532
# JSON logging: see logging/loki-values.yaml (chart renders --zap-encoder)
logging:
  encoder: json
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 96Mi
