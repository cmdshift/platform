apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana-operator
      version: 5.25.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    podSecurityContext:
      # NSA hardening: pod-level non-root (container-level comes from
      # the chart defaults); operator image is distroless nonroot
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    # NSA hardening: explicit non-root uid/gid at container level
    # (image runs as 65532, gid was implicit 0 before). Chart default already
    # sets roFS + runAsNonRoot on the container; these merge in
    securityContext:
      runAsUser: 65532
      runAsGroup: 65532
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 96Mi
