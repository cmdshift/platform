apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: thanos-operator
  namespace: flux-system
spec:
  interval: 24h
  retryInterval: 5s
  sourceRef:
    kind: GitRepository
    name: thanos-operator
    namespace: flux-system
  path: .
  wait: true
  prune: true
  timeout: 5m
