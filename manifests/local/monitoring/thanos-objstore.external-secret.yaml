apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-objstore
  namespace: monitoring
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: main
    kind: ClusterSecretStore
  target:
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: monitoring/thanos-objstore
