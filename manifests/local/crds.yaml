apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crds
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 5s
  dependsOn:
    - name: sources
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/crds
  # never prune: deleting a CRD destroys every CR of that kind cluster-wide —
  # CRD removal must be deliberate and coordinated, never git-driven
  prune: false
  wait: true
  timeout: 2m
