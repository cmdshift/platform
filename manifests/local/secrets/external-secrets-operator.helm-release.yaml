apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 12h
  chart:
    spec:
      chart: external-secrets
      version: "2.10.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    installCRDs: true
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 120Mi
      limits:
        cpu: 200m
        memory: 180Mi
    certController:
      resources:
        requests:
          cpu: 10m
          memory: 160Mi
        limits:
          cpu: 200m
          memory: 240Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 144Mi
        limits:
          cpu: 200m
          memory: 216Mi
