apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 12h
  chart:
    spec:
      chart: external-secrets
      version: "2.10.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    installCRDs: true
    replicaCount: 1
    # C-0013 (kubescape NSA): pod-level non-root; container-level was already
    # set by the chart, this satisfies kubescape's stricter pod-level check
    podSecurityContext:
      runAsNonRoot: true
    # C-0013 (kubescape NSA): explicit non-root gid at container level (the
    # chart sets runAsUser 1000 but left gid implicit 0)
    securityContext:
      runAsGroup: 1000
    resources:
      requests:
        cpu: 10m
        memory: 120Mi
      limits:
        cpu: 200m
        memory: 180Mi
    certController:
      securityContext:
        runAsGroup: 1000 # C-0013 (kubescape NSA): explicit non-root gid
      resources:
        requests:
          cpu: 10m
          memory: 160Mi
        limits:
          cpu: 200m
          memory: 240Mi
    webhook:
      securityContext:
        runAsGroup: 1000 # C-0013 (kubescape NSA): explicit non-root gid
      resources:
        requests:
          cpu: 10m
          memory: 144Mi
        limits:
          cpu: 200m
          memory: 216Mi
