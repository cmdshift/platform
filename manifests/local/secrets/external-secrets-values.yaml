installCRDs: true
replicaCount: 1
# NSA hardening: pod-level non-root (chart sets container level only)
podSecurityContext:
  runAsNonRoot: true
# NSA hardening: explicit non-root gid at container level (the
# chart sets runAsUser 1000 but left gid implicit 0)
securityContext:
  runAsGroup: 1000
resources:
  requests:
    cpu: 10m
    memory: 120Mi
  limits:
    cpu: 200m
    memory: 180Mi
certController:
  securityContext:
    runAsGroup: 1000 # NSA hardening: explicit non-root gid
  resources:
    requests:
      cpu: 10m
      memory: 160Mi
    limits:
      cpu: 200m
      memory: 240Mi
webhook:
  securityContext:
    runAsGroup: 1000 # NSA hardening: explicit non-root gid
  resources:
    requests:
      cpu: 10m
      memory: 144Mi
    limits:
      cpu: 200m
      memory: 216Mi
