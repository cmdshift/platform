apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: networking
    - name: certificates
    # loki-values.yaml names storageClassName: local-path
    - name: storage-config
    - name: objects-config
    - name: secrets-config
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/observability
  prune: true
  wait: true
  timeout: 10m
