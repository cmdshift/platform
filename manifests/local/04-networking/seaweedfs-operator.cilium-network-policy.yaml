apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: seaweedfs-operator
  namespace: seaweedfs-operator
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
      - matchLabels:
          io.kubernetes.pod.namespace: seaweedfs-operator
    - toEndpoints:
      - matchLabels:
          io.kubernetes.pod.namespace: objects
