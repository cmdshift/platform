apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: logging-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: logging
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/logging-config
  prune: true
  wait: true
  timeout: 5m
