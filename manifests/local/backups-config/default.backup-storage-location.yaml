apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: backups
spec:
  provider: aws
  # the default BSL: backups without an explicit --storage-location land here
  default: true
  objectStorage:
    bucket: backups
  config:
    s3Url: http://s3.cloud.test
    s3ForcePathStyle: "true"
    region: local
  credential:
    name: velero-s3-credentials
    key: default
