apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: pvcs
  namespace: backups
spec:
  schedule: "0 3 * * *"
  template:
    includedNamespaces: ["*"]
    includedResources: []
    defaultVolumesToFsBackup: true
    snapshotVolumes: false
    # daily 03:00 schedule — 72h keeps at most 3 backup generations live
    ttl: 72h
    storageLocation: default
