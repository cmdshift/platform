apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: backups
spec:
  hard:
    # velero + node-agents (cmdshift/platform#93); velero memory is 2x on purpose
    # (kopia spikes — rationale on the HelmRelease), pods quota leaves room for
    # kopia maintenance Jobs (cmdshift/platform#109)
    requests.cpu: 150m
    requests.memory: 1500Mi
    limits.cpu: 6
    limits.memory: 2500Mi
    pods: "12"
