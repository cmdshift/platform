apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: crds
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/security
  prune: true
  wait: true
  timeout: 10m
