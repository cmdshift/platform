apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  # StorageClasses moved here from storage/ (cmdshift/platform#35, X/X-config split) —
  # PVC-creating groups (objects, logging, backups) must depend on THIS
  # kustomization, not storage (the move's few seconds of SC absence pend
  # through harmlessly with WaitForFirstConsumer)
  dependsOn:
    - name: storage
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/storage-config
  prune: true
  wait: true
  timeout: 5m
