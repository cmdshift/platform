apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-config
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 5s
  dependsOn:
    - name: secrets
    - name: monitoring
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/11-monitoring-config
  prune: true
  wait: true
  timeout: 10m
