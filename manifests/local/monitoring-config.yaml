apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-config
  namespace: flux-system
spec:
  # drift-heal only: propagation is event-driven; manual flow = sync_wait + flux_wait
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: monitoring
    - name: thanos-operator
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/monitoring-config
  prune: true
  wait: true
  timeout: 10m
  healthCheckExprs:
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: Grafana
      current: status.conditions.filter(e, e.type == 'GrafanaReady').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'GrafanaReady').all(e, e.status == 'False')
    - apiVersion: monitoring.coreos.com/v1
      kind: Alertmanager
      current: status.conditions.filter(e, e.type == 'Available').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'Available').all(e, e.status == 'False')
    # thanos CRs gate on the operator's Ready condition (single condition since
    # thanos-community/thanos-operator#636; before it, ReconcileFailed=True was
    # sticky — #22). NOTE: empty conditions pass vacuously (.all on []) — a CR
    # the operator hasn't reconciled yet reads Ready here; that's the same
    # semantics the Grafana/Alertmanager entries have.
    - apiVersion: monitoring.thanos.io/v1alpha1
      kind: ThanosQuery
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
    - apiVersion: monitoring.thanos.io/v1alpha1
      kind: ThanosRuler
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
    - apiVersion: monitoring.thanos.io/v1alpha1
      kind: ThanosStore
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
    - apiVersion: monitoring.thanos.io/v1alpha1
      kind: ThanosCompact
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
