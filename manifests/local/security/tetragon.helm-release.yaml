apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tetragon
  namespace: security
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: tetragon
      version: 1.7.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # tracefs mount for talos-in-docker: Talos mounts /sys fresh inside the node
  # containers and skips the pseudo-fs submounts in container mode (machined
  # MountPseudoLate runs "only in !container"), so /sys/kernel/tracing is an
  # unmounted sysfs dir. The agent's own auto-mount refuses to mount over the
  # kubelet's hostPath bind ("instance exists with other type" — mountinfo shows
  # sysfs, not tracefs) and cilium/ebpf's kprobe attach then dies with
  # "neither debugfs nor tracefs are mounted". A privileged init container mounts
  # tracefs itself; Bidirectional propagation pushes the mount up to the node's
  # /sys and back down into the agent container's bind, so its fstype check sees
  # real tracefs. postRender keeps helm the single writer. Covered by the
  # allow-tetragon-security-contexts PolicyException (name-prefix match,
  # cmdshift/platform#80).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: tetragon
            patch: |-
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: tetragon
                namespace: security
              spec:
                template:
                  spec:
                    initContainers:
                      - name: mount-tracefs
                        # idempotent: mount only when /sys/kernel/tracing isn't
                        # already real tracefs (Bidirectional propagation pushes
                        # the mount up to the node, so later pods see it there)
                        image: busybox:1.37
                        command:
                          - sh
                          - -c
                          - "[ \"$(stat -f -c %t /sys/kernel/tracing)\" = 74726163 ] || mount -t tracefs -o nosuid,noexec,nodev tracefs /sys/kernel/tracing"
                        securityContext:
                          privileged: true
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            cpu: 100m
                            memory: 32Mi
                        volumeMounts:
                          - name: sys-kernel-tracing
                            mountPath: /sys/kernel/tracing
                            mountPropagation: Bidirectional
                    containers:
                      - name: tetragon
                        volumeMounts:
                          - name: sys-kernel-tracing
                            mountPath: /sys/kernel/tracing
                            mountPropagation: Bidirectional
  valuesFrom:
    - kind: ConfigMap
      name: tetragon-values
      valuesKey: values.yaml
