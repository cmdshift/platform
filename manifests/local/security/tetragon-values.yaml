# load-bearing chart default, kept explicit: process visibility requires the
# host network namespace (tetragon docs)
hostNetwork: true
# Talos >= 1.12 does not mount tracefs — required per
# tetragon.io/docs/installation/kubernetes (Talos Linux section)
extraHostPathMounts:
  - name: sys-kernel-tracing
    mountPath: /sys/kernel/tracing
tetragon:
  # required by the privileges-raise TracingPolicy (uid/gid/caps in exec
  # events); small overhead, events stay useful for jq filtering
  enableProcessCred: true
  # labels events so multi-cluster Loki queries stay unambiguous
  clusterName: local-test
  # loopback-only gRPC in the host netns: kubectl port-forward dials
  # 127.0.0.1 inside the pod netns (= node netns for hostNetwork), so
  # `tetra --server-address localhost:54321` works through kubeconfig auth.
  # Nothing listens on the node IP — the docs' TLS warning is about
  # non-loopback TCP listeners.
  grpc:
    address: "localhost:54321"
  # provisional — audit after burn-in per the resource-sizing convention
  # (request ~= P99 x 1.2, limit 1.5x; event processing is burst-heavy)
  resources:
    requests:
      cpu: 50m
      # 2026-09-07 audit: baseline 400-430Mi with a 497Mi spike against the
      # old 128Mi request (312-338% — first evicted under node pressure) and
      # a 97%-of-limit burst. request = P99 x 1.2 rounded to 512Mi; limit
      # 1.5x. Rising-baseline watch: re-audit at 24h — if it keeps climbing
      # at steady state it's a leak (eventcache ruled out: 70-94 entries),
      # not churn.
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 768Mi
  prometheus:
    serviceMonitor:
      enabled: true # agent metrics :2112
# hubble-export-stdout sidecar: streams events to container stdout -> alloy -> Loki
export:
  # provisional — audit after burn-in
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
tetragonOperator:
  prometheus:
    serviceMonitor:
      enabled: true # operator metrics :2113
  # resources/securityContext: chart defaults are house-shaped
  # (non-root 65532, drop ALL, 10m/64Mi req -> 500m/128Mi lim)
