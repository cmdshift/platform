apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: security
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: trivy-operator
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # values live in trivy-values.yaml (configMapGenerator in
  # kustomization.yaml -> valuesFrom) — the valuesFrom pattern from
  # cmdshift/platform#31; helm_verify renders that file directly
  valuesFrom:
    - kind: ConfigMap
      name: trivy-operator-values
      valuesKey: values.yaml
