# Exec deny-list, flux-system — stage-2 flip 2, enforce (cmdshift/platform#28).
# Static evidence substitutes for the monitor stream (security/README.md).
# Scoping is pod labels: tetragon 1.7.1 matchNamespaces has no "Kube" type —
# the podSelector is the only k8s scoping surface; a future flux controller
# must be added below to come into scope. `kubectl exec ... sh` debug shells
# are killed by design. security_bprm_check verified in node kallsyms
# (security/README.md); adapted from the tetragon exec-enforcement pattern.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: exec-deny-list-flux-system
spec:
  # with enable-policy-filter on the agent, policies without a podSelector
  # don't reach the export sink; the label scope is also the enforcement scope
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - helm-controller
          - kustomize-controller
          - notification-controller
          - source-controller
  # list-of-{name,value} form; valid values are "enforce"/"monitor" —
  # option-value trap: security/README.md
  options:
    - name: policy-mode
      value: enforce
  kprobes:
    - call: security_bprm_check
      syscall: false
      # type: file silently never enforces (arg0 is linux_binprm*; the agent
      # only logs a validation warning) — landmine in security/README.md
      args:
        - index: 0
          type: linux_binprm
      message: "exec of denied binary in operator namespace"
      selectors:
        - # Prefix matches by path prefix; no legit binary in these pods
          # shares a prefix with the deny list
          matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /bin/sh
                - /bin/bash
                - /bin/dash
                - /bin/ash
                - /bin/zsh
                - /usr/bin/sh
                - /usr/bin/bash
                - /usr/bin/dash
                - /usr/bin/zsh
                - /usr/bin/python
                - /usr/bin/perl
                - /usr/bin/ruby
                - /usr/bin/node
                - /usr/bin/env
                - /usr/bin/nc
                - /bin/nc
                - /usr/bin/socat
                - /bin/socat
                - /usr/bin/wget
                - /bin/wget
                - /usr/bin/curl
                - /bin/curl
          matchActions:
            - action: Sigkill
