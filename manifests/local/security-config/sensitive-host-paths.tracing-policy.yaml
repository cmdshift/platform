# File-integrity baseline: opens of the node's crown-jewel host paths by
# containerized processes. monitor_only — stage-2 Override (EACCES) candidates
# are decided from this stream's evidence.
# ATTACHMENT NOTE: plain kprobe, not lsmhooks — linuxkit 7.0.12 vmlinux BTF
# lacks the bpf_lsm_* hook symbols (security/README.md kernel intel); kprobe
# attach works and fmodret is supported, so Override stays available.
# Scoping notes (why the selectors look like this):
# - matchNamespaces Pid NotIn host_ns: etcd and the containerd/kubelet stack are
#   host-namespace processes on Talos and legitimately touch these paths
#   constantly; only pod-side access is a signal.
# - /var/lib/etcd: no pod has any legitimate reason to open etcd's data dir.
# - /run/containerd/containerd.sock: kubelet (a static pod, kube-system) dials
#   it for every CRI call, so this selector is rate-limited to 1 event/min —
#   it is a review trail, not a fire alarm; a stage-2 override must first
#   carve out kube-system CRI access.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sensitive-host-paths
spec:
  # k8s pod processes only (see privileges-raise for the live finding)
  podSelector:
    matchLabels: {}
  kprobes:
    - call: security_file_open
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /var/lib/etcd
          matchActions:
            - action: Post
              rateLimit: "1m"
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchArgs:
            - index: 0
              operator: Equal
              values:
                - /run/containerd/containerd.sock
          matchActions:
            - action: Post
              rateLimit: "1m"
