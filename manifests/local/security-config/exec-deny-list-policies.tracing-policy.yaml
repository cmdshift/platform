# Exec deny-list, policies namespace (kyverno) — stage-2 flip 2, sibling of
# exec-deny-list-flux-system (full rationale there; issue cmdshift/platform#28 ladder,
# pod-label scoping because the 1.7.1 CRD has no Kube namespace matcher,
# debug shells killed by design).
# Scoping label: the chart's release instance label, unique cluster-wide.
# retire: flux prunes this group — deleting the file unloads the sensor.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: exec-deny-list-policies
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: kyverno
  options:
    - name: policy-mode
      value: enforce
  kprobes:
    - call: security_bprm_check
      syscall: false
      args:
        - index: 0
          type: linux_binprm
      message: "exec of denied binary in operator namespace"
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /bin/sh
                - /bin/bash
                - /bin/dash
                - /bin/ash
                - /bin/zsh
                - /usr/bin/sh
                - /usr/bin/bash
                - /usr/bin/dash
                - /usr/bin/zsh
                - /usr/bin/python
                - /usr/bin/perl
                - /usr/bin/ruby
                - /usr/bin/node
                - /usr/bin/env
                - /usr/bin/nc
                - /bin/nc
                - /usr/bin/socat
                - /bin/socat
                - /usr/bin/wget
                - /bin/wget
                - /usr/bin/curl
                - /bin/curl
          matchActions:
            - action: Sigkill
