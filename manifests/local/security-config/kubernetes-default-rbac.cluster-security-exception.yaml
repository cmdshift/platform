# Kubescape ClusterSecurityException — the C-0035/C-0002 findings on the
# rbac.authorization.k8s.io pseudo-resource are kubernetes' own default
# ClusterRoleBindings (system:basic-user, system:discovery,
# system:public-info-viewer for system:authenticated) — stock cluster
# bootstrap, not managed by any manifest here.
apiVersion: kubescape.io/v1beta1
kind: ClusterSecurityException
metadata:
  name: kubernetes-default-rbac-bindings
spec:
  reason: stock kubernetes system:* discovery/basic-user ClusterRoleBindings
  author: platform
  posture:
    - controlID: C-0035
      action: ignore
    - controlID: C-0002
      action: ignore
  match:
    resources:
      - apiGroup: rbac.authorization.k8s.io
        kind: ClusterRoleBinding
        name: system:basic-user
      - apiGroup: rbac.authorization.k8s.io
        kind: ClusterRoleBinding
        name: system:discovery
      - apiGroup: rbac.authorization.k8s.io
        kind: ClusterRoleBinding
        name: system:public-info-viewer
      - apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:basic-user
      - apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:discovery
      - apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:public-info-viewer
