# Kubescape SecurityException — see kyverno.security-exception.yaml header.
# node-exporter: hostNetwork/hostPID by design (allow-node-exporter
# PolicyException). prometheus/ksm/grafana-operator: API clients (SD,
# scrapes, CR watches) need their tokens. thanos CRs: the monitoring.thanos.io
# CRD exposes no automount knob and the operator recreates the SAs on every
# reconcile (verified), so token mounting can't be turned off; roFS/non-root
# at container level are equally unreachable (pod-level is set where the CRD
# allows). ruler limits: operator-injected config-reloader has no resource
# knobs (allow-thanos-ruler-security-contexts PolicyException).
apiVersion: kubescape.io/v1beta1
kind: SecurityException
metadata:
  name: node-exporter-host-access
  namespace: monitoring
spec:
  reason: hostNetwork + hostPID are how node-exporter sees the node
  author: platform
  posture:
    - controlID: C-0041
      action: ignore
    - controlID: C-0038
      action: ignore
    - controlID: C-0016
      action: ignore
    - controlID: C-0055
      action: ignore
  match:
    resources:
      - kind: DaemonSet
        name: kube-prometheus-stack-prometheus-node-exporter
---
apiVersion: kubescape.io/v1beta1
kind: SecurityException
metadata:
  name: api-clients-need-sa-tokens
  namespace: monitoring
spec:
  reason: these workloads authenticate to the API with the SA token
  author: platform
  posture:
    - controlID: C-0034
      action: ignore
  match:
    resources:
      - kind: StatefulSet
        name: prometheus-kube-prometheus-stack-prometheus
      - kind: Deployment
        name: kube-prometheus-stack-kube-state-metrics
      - kind: Deployment
        name: kube-prometheus-stack-operator
      - kind: Deployment
        name: grafana-operator
---
apiVersion: kubescape.io/v1beta1
kind: SecurityException
metadata:
  name: thanos-operator-crd-walls
  namespace: monitoring
spec:
  reason: >-
    monitoring.thanos.io CRDs expose no automount/container-securityContext
    knobs and the operator recreates the SAs on reconcile (verified live);
    pod-level runAsNonRoot is set where the CRD allows; ruler's
    config-reloader is operator-injected without resource knobs
  author: platform
  posture:
    - controlID: C-0034
      action: ignore
    - controlID: C-0013
      action: ignore
    - controlID: C-0017
      action: ignore
    - controlID: C-0270
      action: ignore
    - controlID: C-0271
      action: ignore
  match:
    resources:
      - kind: Deployment
        name: thanos-query-main
      - kind: StatefulSet
        name: thanos-compact-main
      - kind: StatefulSet
        name: thanos-store-main
      - kind: StatefulSet
        name: thanos-ruler-main
