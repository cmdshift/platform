# Kernel-module operations — enforcement (stage-2 flip 1, cmdshift/platform#28).
# Burn-in: 327 events/~6h, all benign net-pf-* Go auto-load probes, zero real
# loads. Split: Override(EACCES) on auto-load requests, Sigkill on real loads —
# rationale in security/README.md. Adapted from tetragon policylibrary
# modules(+nohost); do_init_module added (free_module is inlined in this kernel).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: kernel-modules
spec:
  # podSelector required: with enable-policy-filter on the agent, policies
  # without one don't reach the export sink (Override events were
  # Loki-invisible without this; NENFORCE still fires sensor-side) —
  # security/README.md
  podSelector:
    matchLabels: {}
  # list-of-{name,value} form; valid values are "enforce"/"monitor" (upstream
  # TpStringToMode) — "enforcement"/"monitor_only" are display strings, not
  # option values
  options:
    - name: policy-mode
      value: enforce
  kprobes:
    - call: security_kernel_module_request
      # Automatic module loading requests (missing kernel feature)
      message: "kernel module auto-load requested"
      syscall: false
      return: true
      args:
        - index: 0
          type: string
      returnArg:
        index: 0
        type: int
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Override
              argError: -13 # EACCES — request aborts before modprobe runs
    - call: security_kernel_read_file
      # Explicit module loading via finit_module() — prints the module's full path
      message: "kernel module file read"
      syscall: false
      return: true
      args:
        - index: 0
          type: file
        - index: 1
          type: int
      returnArg:
        index: 0
        type: int
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchArgs:
            - index: 1
              operator: Equal
              values:
                - "2" # READING_MODULE
          matchActions:
            - action: Sigkill
    - call: do_init_module
      # Handles both init_module() and finit_module() — names the module
      message: "kernel module initialized"
      syscall: false
      args:
        - index: 0
          type: module
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Sigkill
