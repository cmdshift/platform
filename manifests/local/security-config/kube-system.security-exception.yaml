# Kubescape SecurityExceptions for kube-system — the findings that remain
# after every app-namespace acceptance. Two families:
#
# 1. Talos-managed objects: the control-plane static pods are rendered by
#    Talos from machine config (never in this tree), and kube-proxy/coredns
#    are likewise Talos-owned (talosctl/nodes, not kustomizations). Hardening
#    belongs to Talos machine config, not manifests — see
#    manifests/local/notes.md. The statics exception matches kind: Pod with
#    NO name deliberately: node names embed a random_id (cluster/local/nodes)
#    so every rebuild changes the pod names; a nameless kind-level match is
#    rebuild-stable and still scoped to exactly the Talos statics, which are
#    the only bare pods in kube-system.
# 2. cilium stack: eBPF CNI by design (hostNetwork/hostPort/privileged/
#    explicit caps) — the kubescape side of the allow-cilium-system-components
#    PolicyException. Fix-first was applied: metrics-server C-0013 is fixed at
#    the chart (securityContext.runAsGroup) instead of exceptioned here.
apiVersion: kubescape.io/v1beta1
kind: SecurityException
metadata:
  name: talos-control-plane-statics
  namespace: kube-system
spec:
  reason: >-
    Talos-rendered static pods (apiserver/controller-manager/scheduler) —
    hostNetwork, no roFS, no limits by upstream design; not manifest-owned
  author: platform
  posture:
    - controlID: C-0017
      action: ignore
    - controlID: C-0034
      action: ignore
    - controlID: C-0041
      action: ignore
    - controlID: C-0068
      action: ignore
    - controlID: C-0270
      action: ignore
    - controlID: C-0271
      action: ignore
  match:
    resources:
      - kind: Pod
---
