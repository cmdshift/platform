    eBPF CNI needs hostNetwork, hostPort, privileged agents and explicit
    capabilities; roFS/APE uncovered by chart knobs — see
    allow-cilium-system-components PolicyException (remove in the cloud)
  author: platform
  posture:
    - controlID: C-0013
      action: ignore
    - controlID: C-0016
      action: ignore
    - controlID: C-0017
      action: ignore
    - controlID: C-0034
      action: ignore
    - controlID: C-0041
      action: ignore
    - controlID: C-0044
      action: ignore
    - controlID: C-0046
      action: ignore
    - controlID: C-0055
      action: ignore
    - controlID: C-0057
      action: ignore
  match:
    resources:
      - kind: DaemonSet
        name: cilium
      - kind: DaemonSet
        name: cilium-envoy
