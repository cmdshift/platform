  author: platform
  posture:
    - controlID: C-0013
      action: ignore
    - controlID: C-0016
      action: ignore
    - controlID: C-0017
      action: ignore
    - controlID: C-0034
      action: ignore
    - controlID: C-0041
      action: ignore
    - controlID: C-0055
      action: ignore
    - controlID: C-0057
      action: ignore
    - controlID: C-0270
      action: ignore
    - controlID: C-0271
      action: ignore
  match:
