# SLO recording rules + multiwindow burn-rate alerting — the template shape (cmdshift/platform#85).
# Copy this group for the first real service; keep the conventions, swap the SLI expressions.
#
# Recording-rule naming:  slo:<service>:<sli>:rate<window>   (windows: 5m, 30m, 1h, 6h)
# Burn windows:           fast pair 5m/1h (>14.4x budget → critical), slow pair 30m/6h (>6x → warning)
#                         — the classic multiwindow multi-burn pair; both windows of a pair must
#                         burn for the alert to hold, so no `for:` is needed (the `and` sustains it)
# Error budget:           99.9% → ratio threshold 0.001 (burn 14.4x = 0.0144, burn 6x = 0.006)
# Routing:                alerts carry `slo: "true"` — the AlertmanagerConfig child route in
#                         mail.alertmanager-config.yaml matches on that label, not severity
groups:
  - name: slo-cilium-datapath
    rules:
      - record: slo:cilium_datapath:drop_ratio:rate5m
        expr: |
          sum(rate(cilium_drop_count_total[5m]))
            /
          clamp_min(sum(rate(cilium_forward_count_total[5m])), 1)
      - record: slo:cilium_datapath:drop_ratio:rate30m
        expr: |
          sum(rate(cilium_drop_count_total[30m]))
            /
          clamp_min(sum(rate(cilium_forward_count_total[30m])), 1)
      - record: slo:cilium_datapath:drop_ratio:rate1h
        expr: |
          sum(rate(cilium_drop_count_total[1h]))
            /
          clamp_min(sum(rate(cilium_forward_count_total[1h])), 1)
      - record: slo:cilium_datapath:drop_ratio:rate6h
        expr: |
          sum(rate(cilium_drop_count_total[6h]))
            /
          clamp_min(sum(rate(cilium_forward_count_total[6h])), 1)
      - alert: CiliumDatapathFastBurn
        expr: |
          slo:cilium_datapath:drop_ratio:rate5m > 0.0144
            and
          slo:cilium_datapath:drop_ratio:rate1h > 0.0144
        labels:
          severity: critical
          slo: "true"
        annotations:
          summary: "cilium datapath fast burn: {{ $value | humanizePercentage }} drop ratio (14.4x budget) over 5m and 1h"
      - alert: CiliumDatapathSlowBurn
        expr: |
          slo:cilium_datapath:drop_ratio:rate30m > 0.006
            and
          slo:cilium_datapath:drop_ratio:rate6h > 0.006
        labels:
          severity: warning
          slo: "true"
        annotations:
          summary: "cilium datapath slow burn: {{ $value | humanizePercentage }} drop ratio (6x budget) over 30m and 6h"
