apiVersion: v1
kind: LimitRange
metadata:
  name: compute-defaults
  namespace: observability
spec:
  limits:
    - type: Container
      # ResourceQuota/compute admission fails any pod whose containers lack
      # requests/limits — including containers that kyverno legitimately skips
      # via PolicyException (the thanos-operator's config-reloader sidecar has
      # no resources and no CRD knob; the first pod replacement after the #93
      # quotas landed wedged the ruler STS on exactly this — cmdshift/platform#111).
      # Defaults fill the gap so exception-exempt containers still satisfy quota.
      # Sized from the config-reloader audit (~18Mi steady, 10m CPU).
      default:
        cpu: 200m
        memory: 64Mi
      defaultRequest:
        cpu: 10m
        memory: 24Mi
