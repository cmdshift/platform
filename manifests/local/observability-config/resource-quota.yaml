apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: observability
spec:
  hard:
    # audit 2026-09: prometheus + thanos ×4 + grafana + alertmanager + operators
    # — 310m CPU / 3080Mi req, 9700m/4620Mi limits, 16 pods (cmdshift/platform#93).
    # CPU limits quota covers prometheus/thanos-compaction bursts; 2× request-sum
    # absorbs kube-state-metrics/grafana-operator VPA gaps (recs +87%/+86%).
    # 2026-09-17 tempo + beyla: +1280Mi req, +3.5Gi limits, +6 pods ceiling
    # (tempo 1Gi + beyla ×5 512Mi; cmdshift/platform#83) — and requests.cpu
    # 750m→1: beyla ×5 requests saturated the old ceiling (690m used, tempo's
    # 150m request denied at the DS rollout)
    requests.cpu: "1"
    requests.memory: 7Gi
    limits.cpu: 16
    limits.memory: 12Gi
    pods: "41"
