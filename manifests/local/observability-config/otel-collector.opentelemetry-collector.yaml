apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: observability
spec:
  mode: deployment
  replicas: 1
  # v1beta1 CRD takes config as a structured object (v1alpha1 took a string)
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      k8sattributes: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch: {}
    exporters:
      otlphttp/tempo:
        endpoint: http://tempo.observability.svc:4318
      otlphttp/loki:
        endpoint: http://loki-gateway.observability.svc:80/otlp
        headers:
          X-Scope-OrgID: self-monitoring
      prometheusremotewrite/mimir:
        endpoint: http://mimir.observability.svc:8080/api/v1/push
        headers:
          X-Scope-OrgID: self-monitoring
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes, memory_limiter, batch]
          exporters: [otlphttp/tempo]
        logs:
          receivers: [otlp]
          processors: [k8sattributes, memory_limiter, batch]
          exporters: [otlphttp/loki]
        metrics:
          receivers: [otlp]
          processors: [k8sattributes, memory_limiter, batch]
          exporters: [prometheusremotewrite/mimir]
  managementState: managed
  observability:
    metrics:
      enableMetrics: true
  resources:
    # no pre-deploy evidence: lean start per the sizing convention, audit
    # after seasoning (cmdshift/platform#128)
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 30
