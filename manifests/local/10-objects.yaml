apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: objects
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 5s
  dependsOn:
    - name: sources
    - name: networking
    - name: storage
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/10-objects
  prune: true
  wait: true
  timeout: 10m
