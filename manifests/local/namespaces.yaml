apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  # drift-heal only: propagation is event-driven; manual flow = sync_wait + flux_wait
  interval: 1h
  retryInterval: 5s
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/namespaces
  # never prune: pruning a namespace manifest deletes the namespace and
  # everything in it, including objects owned by other kustomizations
  prune: false
  wait: true
  timeout: 2m
