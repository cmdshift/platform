apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: networking
  namespace: flux-system
spec:
  # drift-heal only: propagation is event-driven; manual flow = sync_wait + flux_wait
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: crds
    - name: certificates
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/networking
  prune: true
  wait: true
  timeout: 10m
