apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: networking
    - name: flux
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/policies
  prune: false
  wait: true
  timeout: 10m
