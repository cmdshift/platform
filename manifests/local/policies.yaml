apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: networking
    - name: flux
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/policies
  # never prune: admission guardrails must not be garbage-collectable —
  # dropping a policy file must never silently strip cluster protection
  prune: false
  wait: true
  timeout: 10m
