apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: networking
    - name: flux
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/policies
  # test-bed posture: prune enabled (see policies-config.yaml for the tripwire)
  prune: true
  wait: true
  timeout: 10m
