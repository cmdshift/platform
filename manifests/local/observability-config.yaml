apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: observability
    - name: thanos-operator
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/observability-config
  prune: true
  wait: true
  timeout: 10m
  healthCheckExprs:
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: Grafana
      current: status.conditions.filter(e, e.type == 'GrafanaReady').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'GrafanaReady').all(e, e.status == 'False')
    - apiVersion: monitoring.coreos.com/v1
      kind: Alertmanager
      current: status.conditions.filter(e, e.type == 'Available').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'Available').all(e, e.status == 'False')
    # thanos CRs gate on the operator's single Ready condition
    # (thanos-community/thanos-operator#636). NOTE: empty conditions pass
    # vacuously (.all on []) — a CR the operator hasn't reconciled yet reads
    # Ready here; same semantics as the Grafana/Alertmanager entries.
    - apiVersion: monitoring.thanos.io/v1alpha1
      kind: ThanosQuery
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
    - apiVersion: monitoring.thanos.io/v1alpha1
      kind: ThanosRuler
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
    - apiVersion: monitoring.thanos.io/v1alpha1
      kind: ThanosStore
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
    - apiVersion: monitoring.thanos.io/v1alpha1
      kind: ThanosCompact
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
