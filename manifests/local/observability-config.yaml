apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: observability
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/observability-config
  prune: true
  wait: true
  timeout: 10m
  healthCheckExprs:
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: Grafana
      current: status.conditions.filter(e, e.type == 'GrafanaReady').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'GrafanaReady').all(e, e.status == 'False')
    - apiVersion: monitoring.coreos.com/v1
      kind: Alertmanager
      # no `failed:` expr: the operator flips the CR to Available=False
      # (NoPodReady) for the first ~60s of a fresh-rebuild slow start
      # (cold image pulls + PVC wait) — a known-self-healing blip that
      # failed the gate on every rebuild; a real failure surfaces as the
      # kustomization timeout instead (cmdshift/platform#69)
      current: status.conditions.filter(e, e.type == 'Available').all(e, e.status == 'True')
    # operator-managed CR gates on the operator's single Ready condition.
    # NOTE: empty conditions pass vacuously (.all on []) — a CR the operator
    # hasn't reconciled yet reads Ready here; same semantics as the
    # Grafana/Alertmanager entries (pattern also used by thanos, pre-#128).
    - apiVersion: opentelemetry.io/v1beta1
      kind: OpenTelemetryCollector
      # operator-managed CR: same single-condition semantics as the thanos
      # entries above
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
