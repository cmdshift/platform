apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-policies
  namespace: flux-system
spec:
  interval: 10s
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: cni
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/04-network-policies
  prune: true
  wait: true
