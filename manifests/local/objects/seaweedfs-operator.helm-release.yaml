apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
  namespace: seaweedfs-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: seaweedfs-operator
      version: 0.1.40
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-operator
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    webhook:
      certManager:
        enabled: true
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
