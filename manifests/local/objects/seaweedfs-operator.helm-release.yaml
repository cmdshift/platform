apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
  namespace: objects
spec:
  interval: 1h
  chart:
    spec:
      chart: seaweedfs-operator
      version: 0.1.40
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-operator
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # values live in seaweedfs-operator-values.yaml (configMapGenerator in
  # kustomization.yaml -> valuesFrom) — the valuesFrom pattern from
  # cmdshift/platform#31; helm_verify renders that file directly
  valuesFrom:
    - kind: ConfigMap
      name: seaweedfs-operator-values
      valuesKey: values.yaml
