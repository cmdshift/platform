# audit: chart default request ran at 114% in steady state — 120Mi = peak x 1.2; CPU
# pinned at 20m (7d peak 1.9m vs the 100m chart default) and limits at 1.5x request
# so a chart bump can't silently re-shape them (cmdshift/platform#66)
resources:
  requests:
    cpu: 20m
    memory: 120Mi
  limits:
    cpu: 500m
    memory: 180Mi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
# NSA hardening: explicit non-root gid at container level (image is 65532:65532)
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
webhook:
  certManager:
    enabled: true
