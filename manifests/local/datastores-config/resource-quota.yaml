apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: datastores
spec:
  hard:
    # audit 2026-09: 3 operators — 35m CPU / 176Mi req, 1700m/264Mi limits,
    # 3 pods (cmdshift/platform#93). 2× request-sum headroom; VPA recs flat.
    requests.cpu: 100m
    requests.memory: 500Mi
    limits.cpu: 4
    limits.memory: 750Mi
    pods: "8"
