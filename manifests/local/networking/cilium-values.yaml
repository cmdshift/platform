upgradeCompatibility: null # set to previous version
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
encryption:
  enabled: true
  type: wireguard
envoy:
  resources:
    requests:
      cpu: 10m
      # steady state ~25Mi, but the connectivity test's L7 traffic pushed
      # the busy node's envoy to ~69Mi against the old 72Mi limit (90%)
      memory: 64Mi
    limits:
      cpu: 40m
      memory: 128Mi
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true
    nodes:
      matchLabels:
        k8s-role/work: ""
hubble:
  relay:
    enabled: true
    prometheus:
      # relay metrics (9966) — the SM needs the metrics endpoint enabled
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 96Mi
  ui:
    enabled: true
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          # audit: 13.6% of CFS periods throttled at the old 100m
          cpu: 200m
          memory: 72Mi
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          # audit: 33% of CFS periods throttled at the old 20m
          cpu: 100m
          memory: 24Mi
ipam:
  mode: kubernetes
initResources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    cpu: 100m
    memory: 128Mi
k8sServiceHost: localhost
k8sServicePort: 7445
# gateway-api controller prerequisite — the operator refuses the GatewayClass without it (cmdshift/platform#70)
kubeProxyReplacement: true
l2announcements:
  enabled: true
prometheus:
  # cilium-agent metrics (9962) — endpoint is disabled by chart default,
  # and the SM needs it enabled
  enabled: true
  serviceMonitor:
    enabled: true
    # SM CRDs ship via the prometheus-operator-crds release — the chart's
    # render-time CRD gate needs them declared to pass
    trustCRDsExist: true
operator:
  prometheus:
    serviceMonitor:
      enabled: true # chart default requires release labels; Prometheus selects all SMs (serviceMonitorSelector: {})
  resources:
    requests:
      cpu: 10m
      memory: 144Mi
    limits:
      # audit: 7.3% of CFS periods throttled at the old 40m —
      # convention floor for burst headroom
      cpu: 200m
      memory: 216Mi
resources:
  requests:
    cpu: 50m
    # audit: agents 296-351Mi (worst node, post ns-refactor churn) —
    # 448Mi = worst-node x 1.2, limit 1.5x
    memory: 448Mi
  limits:
    # audit: 21.8% of CFS periods throttled at the old 200m —
    # eBPF/encrypt bursts; generous CPU limit per convention
    cpu: 500m
    # connectivity-test runs spiked agents to ~323Mi (endpoints/identities) —
    # limit 1.5x keeps burst headroom
    memory: 672Mi
rollOutCiliumPods: true
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
