apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: cilium
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    upgradeCompatibility: null # set to previous version
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    encryption:
      enabled: true
      type: wireguard
    envoy:
      resources:
        requests:
          cpu: 10m
          # steady state ~25Mi, but the connectivity test's L7 traffic pushed
          # the busy node's envoy to ~69Mi against the old 72Mi limit (90%)
          memory: 64Mi
        limits:
          cpu: 40m
          memory: 128Mi
    gatewayAPI:
      enabled: true
      hostNetwork:
        enabled: true
        nodes:
          matchLabels:
            k8s-role/work: ""
    hubble:
      relay:
        enabled: true
        prometheus:
          # relay metrics (9966) — the SM needs the metrics endpoint enabled
          enabled: true
          serviceMonitor:
            enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 96Mi
      ui:
        enabled: true
        backend:
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 72Mi
        frontend:
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 20m
              memory: 24Mi
    ipam:
      mode: kubernetes
    initResources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 128Mi
    k8sServiceHost: localhost
    k8sServicePort: 7445
    kubeProxyReplacement: false # true in the cloud
    l2announcements:
      enabled: true
    prometheus:
      # cilium-agent metrics (9962) — endpoint is disabled by chart default,
      # and the SM needs it enabled
      enabled: true
      serviceMonitor:
        enabled: true
        # helm-controller renders without API discovery, so the chart's
        # validate.yaml gate fails unless told the SM CRDs exist — they do
        # (prometheus-operator-crds release, crds/)
        trustCRDsExist: true
    operator:
      prometheus:
        serviceMonitor:
          enabled: true # chart default requires release labels; Prometheus selects all SMs (serviceMonitorSelector: {})
      resources:
        requests:
          cpu: 10m
          memory: 144Mi
        limits:
          cpu: 40m
          memory: 216Mi
    resources:
      requests:
        cpu: 50m
        # request audit 2026-09-06: the busy work node's agent sat at 234Mi
        # steady (91% of the old 256Mi request); 288Mi = worst-node x 1.2
        memory: 288Mi
      limits:
        cpu: 200m
        # test-namespace endpoints/identities spiked agents to ~323Mi against
        # the old 384Mi limit (84%) during a connectivity test run; 512Mi keeps
        # burst headroom
        memory: 512Mi
    rollOutCiliumPods: true
    securityContext:
      capabilities:
        ciliumAgent: [CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID]
        cleanCiliumState: [NET_ADMIN,SYS_ADMIN,SYS_RESOURCE]
