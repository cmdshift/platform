apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: cilium
      # pre-release: 1.20.x crashes at startup on kernel 7.2 hosts (cilium/cilium#48016);
      # must match the bootstrap pin or adoption downgrades back to a broken release
      version: 1.21.0-pre.2
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
