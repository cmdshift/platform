apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies-config
  namespace: flux-system
spec:
  # drift-heal only: propagation is event-driven; manual flow = sync_wait + flux_wait
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: policies
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/policies-config
  # never prune: auto-deleting an exception (e.g. velero node-agents, cilium)
  # would immediately get those pods denied at admission on next restart
  prune: false
  wait: true
  timeout: 2m
