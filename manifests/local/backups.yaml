apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backups
  namespace: flux-system
spec:
  # drift-heal only: propagation is event-driven; manual flow = sync_wait + flux_wait
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: networking
    # was: storage — the StorageClasses split out into storage-config (#35);
    # restore drills depend on the local PV types (defaultVolumeType: local)
    - name: storage-config
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/backups
  prune: true
  wait: true
  timeout: 10m
