apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    alertmanager:
      enabled: false
    prometheus:
      prometheusSpec:
        retention: 7d
        disableCompaction: true
        externalLabels:
          cluster: local
      thanosService:
        enabled: true
      thanosServiceMonitor:
        enabled: true
    grafana:
      enabled: false
