apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 5s
  dependsOn:
    - name: networking
    - name: certificates
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/metrics
  prune: true
  wait: true
  timeout: 5m
