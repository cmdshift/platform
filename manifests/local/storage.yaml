apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: networking
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/storage
  prune: true
  wait: true
  timeout: 5m
