apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 5s
  dependsOn:
    - name: sources
    - name: crds
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/02-policies
  prune: false
  wait: true
