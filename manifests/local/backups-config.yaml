apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backups-config
  namespace: flux-system
spec:
  # drift-heal only: propagation is event-driven; manual flow = sync_wait + flux_wait
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: backups
    - name: secrets-config
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/backups-config
  prune: true
  wait: true
  timeout: 10m
