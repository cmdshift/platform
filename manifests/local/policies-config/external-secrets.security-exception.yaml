# Kubescape SecurityException — see kyverno.security-exception.yaml header.
apiVersion: kubescape.io/v1beta1
kind: SecurityException
metadata:
  name: api-clients-need-sa-tokens
  namespace: external-secrets
spec:
  reason: external-secrets components are API clients (secrets, certificates)
  author: platform
  posture:
    - controlID: C-0034
      action: ignore
  match:
    resources:
      - kind: Deployment
        name: external-secrets
      - kind: Deployment
        name: external-secrets-cert-controller
      - kind: Deployment
        name: external-secrets-webhook
