apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: allow-cilium-system-components
  namespace: policies
spec:
  policyRefs:
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-host-ports
      kind: ValidatingPolicy
    - name: disallow-privileged
      kind: ValidatingPolicy
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    - name: restrict-seccomp-strict
      kind: ValidatingPolicy
    # the agents terminate in 1s by design (fast node shutdown, no state to drain)
    - name: require-graceful-termination
      kind: ValidatingPolicy
  matchConditions:
    # hubble-relay (part of the cilium release) also terminates in 1s by design
    - name: match-cilium
      expression: "object.metadata.namespace == 'kube-system' && (object.metadata.name.startsWith('cilium') || object.metadata.name == 'hubble-relay')"
