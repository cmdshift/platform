apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: allow-cilium-system-components
  namespace: policies
spec:
  policyRefs:
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-host-ports
      kind: ValidatingPolicy
    - name: disallow-privileged
      kind: ValidatingPolicy
    # ztunnel-cilium sets allowPrivilegeEscalation: true (chart-design, the
    # proxy rewrites pod netns iptables rules — cmdshift/platform#87); the
    # cilium agent itself runs with APE unset (default false) so this ref is
    # a no-op for it
    - name: disallow-privilege-escalation
      kind: ValidatingPolicy
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    - name: restrict-seccomp-strict
      kind: ValidatingPolicy
    # the agents terminate in 1s by design (fast node shutdown, no state to drain)
    - name: require-graceful-termination
      kind: ValidatingPolicy
  matchConditions:
    # hubble-relay (part of the cilium release) also terminates in 1s by design
    # startsWith is required for hubble-relay: autogen pods carry RS-hash suffixes,
    # exact-name matching left them unexcepted and background scans kept re-reporting
    # require-graceful-termination failures on every rollout (cmdshift/platform#100)
    - name: match-cilium
      # ztunnel-cilium (cmdshift/platform#87): hostNetwork, NET_ADMIN/SYS_ADMIN/
      # NET_RAW + allowPrivilegeEscalation by chart design — the per-node proxy
      # rewrites pod netns iptables rules for HBONE redirect
      expression: "object.metadata.namespace == 'kube-system' && (object.metadata.name.startsWith('cilium') || object.metadata.name.startsWith('hubble-relay') || object.metadata.name.startsWith('ztunnel-cilium'))"
