apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: allow-privileged-system-workloads
  namespace: policies
  # annotation bump to force admission re-pick-up after the ns-refactor CEL
  # update — the generator saw the edit, the admission path kept evaluating
  # the previous expression (storage matched, backups denied with identical
  # CEL) (cmdshift/platform#31)
  annotations:
    platform.cmdshift.io/ns-refactor: "2026-09-07"
spec:
  policyRefs:
    - name: disallow-privileged
      kind: ValidatingPolicy
  matchConditions:
    - name: exempt-namespaces
      expression: "object.metadata.namespace in ['storage', 'backups']"
