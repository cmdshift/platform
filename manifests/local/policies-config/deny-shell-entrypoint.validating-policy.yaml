# Admission-time backstop for the tetragon exec deny-list (security-config/
# exec-deny-list-*.tracing-policy.yaml): container-init execs escape tetragon's
# pod-scoped enforcement — the pod context isn't resolved when a container's
# entrypoint execs — so shell/interpreter entrypoints land unharmed at runtime.
# Admission is deterministic and race-free. Binary list is verbatim the
# tetragon deny-list's — keep the two in lockstep (security/README.md).
# Scoped to the operator namespaces: static evidence shows zero shell
# entrypoints there (no `command:` overrides, no Jobs/CronJobs — flip-2
# evidence, PR cmdshift/platform#56). Shell-needing hook jobs get a scoped
# PolicyException (policies-config/allow-*.policy-exception.yaml pattern),
# not a carve-out here. cmdshift/platform#58
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: deny-shell-entrypoint
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: ["pods"]
  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - daemonsets
        - jobs
        - cronjobs
  matchConditions:
    - name: operator-namespaces
      expression: "object.metadata.namespace in ['flux-system', 'policies', 'secrets']"
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c,
          (c.?command.orValue([]) + c.?args.orValue([]))
            .all(e, !(e in [
              '/bin/sh', '/bin/bash', '/bin/dash', '/bin/ash', '/bin/zsh',
              '/usr/bin/sh', '/usr/bin/bash', '/usr/bin/dash', '/usr/bin/zsh',
              '/usr/bin/python', '/usr/bin/perl', '/usr/bin/ruby', '/usr/bin/node',
              '/usr/bin/env', '/usr/bin/nc', '/bin/nc',
              '/usr/bin/socat', '/bin/socat',
              '/usr/bin/wget', '/bin/wget',
              '/usr/bin/curl', '/bin/curl'
            ])))
      message: >-
        Containers must not run a shell, interpreter, or net/exec tool as an
        explicit command or argument in the operator namespaces (matches the
        tetragon exec deny-list; needs a shell? file a scoped PolicyException
        in policies-config/ — see manifests/local/policies/README.md).
