apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: allow-velero-security-contexts
  namespace: kyverno
spec:
  policyRefs:
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    - name: restrict-seccomp-strict
      kind: ValidatingPolicy
  matchConditions:
    - name: match-velero
      expression: "object.metadata.namespace == 'velero' && (object.metadata.name.startsWith('velero') || object.metadata.name.startsWith('node-agent'))"
