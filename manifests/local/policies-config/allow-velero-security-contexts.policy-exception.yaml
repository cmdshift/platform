apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: allow-velero-security-contexts
  namespace: policies
  # ns-refactor re-pick-up bump (pattern: allow-privileged-system-worloads)
  annotations:
    platform.cmdshift.io/ns-refactor: "2026-09-07"
spec:
  policyRefs:
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: require-graceful-termination
      kind: ValidatingPolicy
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    - name: restrict-seccomp-strict
      kind: ValidatingPolicy
  matchConditions:
    - name: match-velero
      # velero/node-agent pods by name, plus data mover pods (arbitrary name prefix, always
      # the velero.io/pod-volume-* label). require-graceful-termination covers the movers:
      # velero hardcodes TerminationGracePeriodSeconds: 0, no upstream knob (cmdshift/platform#111)
      expression: "object.metadata.namespace == 'backups' && (object.metadata.name.startsWith('velero') || object.metadata.name.startsWith('node-agent') || 'velero.io/pod-volume-backup' in object.metadata.labels || 'velero.io/pod-volume-restore' in object.metadata.labels)"
