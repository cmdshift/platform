apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: allow-beyla-ebpf
  namespace: policies
  annotations:
    # bump to force admission re-pick-up after CEL updates — the engine can
    # lag the stored object (policies/README.md)
    platform.cmdshift.io/force-reconcile: "1"
spec:
  policyRefs:
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-privileged
      kind: ValidatingPolicy
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    - name: restrict-seccomp-strict
      kind: ValidatingPolicy
  matchConditions:
    # same shape as allow-tetragon-security-contexts: the agent DaemonSet runs
    # privileged with hostPID because eBPF auto-instrumentation needs the BPF
    # syscall and process visibility in the host pid namespace. Prefix match
    # covers the generated pods (beyla-xxxxx).
    - name: match-beyla
      expression: "object.metadata.namespace == 'observability' && object.metadata.name.startsWith('beyla')"
