apiService:
  create: true
args:
  - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
  - --metric-resolution=15s
  # JSON logging: see logging/loki-values.yaml (component-base logging flag)
  - --logging-format=json
# chart's securityContext is CONTAINER-level; runAsGroup added for NSA
# hardening (requires explicit container-level uid+gid, not just runAsNonRoot)
securityContext:
  runAsGroup: 1000
resources:
  requests:
    cpu: 10m
    memory: 72Mi
  limits:
    cpu: 200m
    memory: 108Mi
