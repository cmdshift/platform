monitoring:
  serviceMonitor:
    enabled: true # loki self-metrics — lives under `monitoring:` in this chart
test:
  enabled: false
lokiCanary:
  enabled: false
global:
  extraArgs:
    - "-config.expand-env=true"
    # JSON logging: all platform components log JSON so log lines are
    # field-queryable (`| json` in LogQL) — set at the source, the pipeline
    # passes lines through unchanged
    - "-log.format=json"
  extraEnvFrom:
    - secretRef:
        name: loki-s3-credentials
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
    rule_path: /tmp/loki/rules
    alertmanager_url: http://alertmanager-operated.observability.svc:9093
    enable_api: true
    enable_alertmanager_v2: true
    evaluation_interval: 1m
sidecar:
  rules:
    enabled: true
    folder: /etc/loki/rules
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 144Mi
gateway:
  config:
    server:
      http_listen_port: 80
    frontend:
      log_requests: false
    limits:
      allow_structured_metadata: true
    common:
      path_prefix: /
    org_id:
      default: self-monitoring
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 24Mi
  metrics:
    resources:
      # overnight: peak 22.3Mi — request = P99 x 1.2, limit = 1.5x request
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        cpu: 100m
        memory: 36Mi
loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: aws
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki-rules
    s3:
      endpoint: "main-s3.objects.svc:8333"
      s3ForcePathStyle: true
      insecure: true
      accessKeyId: "${LOKI_S3_ACCESS_KEY_ID}"
      secretAccessKey: "${LOKI_S3_SECRET_ACCESS_KEY}"
  limits_config:
    # bounded retention — 30d matches the thanos 5m-tier; logs are triage data
    retention_period: 30d
  compactor:
    retention_enabled: true
    # Loki 3.x retention requires a delete-request store; `s3` names the
    # chart-generated object store
    delete_request_store: s3
    # default 2h safe-delete window is production caution; 5m keeps the
    # delete path observable in a test cluster (verify via
    # loki_compactor_deleted_lines_total after each retention sweep)
    retention_delete_delay: 5m
    # default 24h = the undo window before a delete request is processed;
    # 15m is a deliberate local-only tradeoff (shorter accidental-delete
    # undo, faster delete-path feedback) — true in the cloud: keep the default
    delete_request_cancel_period: 15m
  extraEnv:
    - name: LOKI_S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: loki-s3-credentials
          key: LOKI_S3_ACCESS_KEY_ID
    - name: LOKI_S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: loki-s3-credentials
          key: LOKI_S3_SECRET_ACCESS_KEY
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  resources:
    requests:
      # 7d CPU peak 25m vs the old 15m request (VPA rec 23m) — 20m keeps
      # the lean-request convention with headroom (cmdshift/platform#66)
      cpu: 20m
      # audit: steady 296Mi climbing to 404Mi post-WAL-replay —
      # 512Mi = P99 x 1.2, limit 1.5x. 7d max 333Mi stays under it;
      # unchanged: WAL-replay restarts are the spike case
      memory: 512Mi
    limits:
      cpu: 200m
      memory: 768Mi
chunksCache:
  resources:
    requests:
      cpu: 10m
      # audit: 49Mi steady at first sizing; 7d later the cache grew to a
      # 95Mi peak (94% of the old 96Mi limit) — 120Mi = peak x 1.2,
      # limit = 1.5x (cmdshift/platform#66)
      memory: 120Mi
    limits:
      cpu: 20m
      memory: 180Mi
resultsCache:
  resources:
    requests:
      cpu: 10m
      memory: 8Mi
    limits:
      cpu: 20m
      memory: 12Mi
memcachedExporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 100m
      memory: 36Mi
