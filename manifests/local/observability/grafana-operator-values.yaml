podSecurityContext:
  # NSA hardening: pod-level non-root (container-level comes from
  # the chart defaults); operator image is distroless nonroot
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
# NSA hardening: explicit non-root uid/gid at container level
# (image is 65532; the chart leaves gid implicit 0)
securityContext:
  runAsUser: 65532
  runAsGroup: 65532
# JSON logging: see logging/loki-values.yaml (chart renders --zap-encoder)
logging:
  encoder: json
resources:
  requests:
    cpu: 10m
    # 7d max 37Mi, VPA rec 47Mi — 48Mi = peak x 1.2, limit 1.5x
    # (cmdshift/platform#66)
    memory: 48Mi
  limits:
    cpu: 200m
    memory: 72Mi
