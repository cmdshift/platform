controller:
  enabled: true
  rbac:
    enableArgoproj: false # no Argo Rollouts here
  flags:
    # Off-mode VPAs for every workload outside the system namespaces (cmdshift/platform#62)
    on-by-default: "true"
    exclude-namespaces: "kube-system,flux-system"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      # greenfield sizing — audit after the first days (resource-sizing skill)
      cpu: 200m
      memory: 96Mi
dashboard:
  enabled: true
  replicaCount: 1
  flags:
    on-by-default: "true"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      # greenfield sizing — audit after the first days (resource-sizing skill)
      cpu: 200m
      memory: 96Mi
