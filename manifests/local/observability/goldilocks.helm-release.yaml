apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: kube-system
spec:
  interval: 12h
  releaseName: goldilocks
  dependsOn:
    - name: vpa
  chart:
    spec:
      chart: goldilocks
      version: "11.1.0"
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: goldilocks-values
      valuesKey: values.yaml
