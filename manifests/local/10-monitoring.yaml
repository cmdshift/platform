apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10s
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: network-policies
    - name: storage
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/10-monitoring
  prune: true
  wait: true
  timeout: 10m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: prometheus
      namespace: monitoring
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: perses
      namespace: monitoring
