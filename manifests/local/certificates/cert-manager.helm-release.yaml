apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 12h
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    crds:
      enabled: true
      keep: true
    config:
      enableGatewayAPI: true
    # NSA hardening: explicit non-root uid/gid at container level
    # (image runs as 65532, gid was implicit 0 before)
    containerSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
    resources:
      requests:
        cpu: 10m
        # request audit 2026-09-06: steady 77Mi peak against the old 80Mi
        # request; 96Mi = observed x 1.2, limit bumped to keep the 1.5x ratio
        memory: 96Mi
      limits:
        cpu: 200m
        memory: 144Mi
    cainjector:
      containerSecurityContext:
        runAsUser: 65532
        runAsGroup: 65532
      resources:
        requests:
          cpu: 10m
          memory: 144Mi
        limits:
          cpu: 200m
          memory: 216Mi
    webhook:
      containerSecurityContext:
        runAsUser: 65532
        runAsGroup: 65532
      resources:
        requests:
          cpu: 10m
          memory: 56Mi
        limits:
          cpu: 200m
          memory: 84Mi
    startupapicheck:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

