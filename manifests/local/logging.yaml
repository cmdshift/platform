apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: logging
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 5s
  dependsOn:
    - name: sources
    - name: secrets-config
    - name: storage
    - name: monitoring
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/logging
  prune: true
  wait: true
  timeout: 10m
