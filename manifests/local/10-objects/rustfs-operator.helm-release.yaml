apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs-operator
  namespace: rustfs-operator
spec:
  interval: 10m
  chart:
    spec:
      chart: ./deploy/rustfs-operator
      version: 0.0.6
      sourceRef:
        kind: GitRepository
        name: rustfs-operator
        namespace: flux-system
      interval: 10m
  values:
    sts:
      enabled: false