apiVersion: v1
kind: ConfigMap
metadata:
  name: node-agent-config
  namespace: backups
data:
  # sizes the temporary data-mover pods (BestEffort would be admission-denied) — backups/README.md
  config: |
    {
      "podResources": {
        "cpuRequest": "50m",
        "cpuLimit": "1000m",
        "memoryRequest": "256Mi",
        "memoryLimit": "512Mi"
      }
    }
