apiVersion: v1
kind: ConfigMap
metadata:
  name: node-agent-config
  namespace: backups
data:
  # podResources sizes the temporary data mover pods velero creates for
  # fs-backup/restore — without it they're BestEffort and the
  # require-resource-limits policy denies them (backups PartiallyFailed).
  # Memory 2x request like the velero server (kopia repo-prep OOM history —
  # see velero.helm-release.yaml)
  config: |
    {
      "podResources": {
        "cpuRequest": "50m",
        "cpuLimit": "1000m",
        "memoryRequest": "256Mi",
        "memoryLimit": "512Mi"
      }
    }
