initContainers:
  - name: velero-plugin-for-aws
    image: index.docker.io/velero/velero-plugin-for-aws:v1.14.2
    volumeMounts:
      - mountPath: /target
        name: plugins
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 40m
        memory: 48Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
# C-0016/C-0046 hardening via the plugin init container's container-level
# securityContext. The chart only exposes securityContext at pod level (its
# runAsUser: 0 default is deliberate — the node-agent needs root), so
# container-level readOnlyRootFilesystem / caps dropping is unreachable via
# values — accepted deviations for the velero deployment (manifests/local/README.md)
podSecurityContext:
  # v1.18 maintenance-job pods copy this pod/container securityContext from the
  # velero deployment (pkg/repository/maintenance buildJob), so hardening here
  # fixes the kopia repo-maintenance admission denials at the source — no
  # PolicyException (cmdshift/platform#109). runAsUser must be numeric: the
  # image's USER cnb is non-numeric and kubelet can't verify runAsNonRoot
  # against a bare username (same trap as thanos-ruler, README.md:52); 1002 =
  # cnb in the velero v1.18.1 image
  runAsNonRoot: true
  runAsUser: 1002
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
credentials: {}
resources:
  # memory sized after OOMKill at the 132Mi limit during kopia repo prep
  # (nightly fs-backup); limit is 2x request instead of the usual 1.5x to
  # absorb unified-repo maintenance spikes
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
configuration:
  # JSON logging: see observability/loki-values.yaml
  logFormat: json
  backupStorageLocation: null
  volumeSnapshotLocation: null
  repositoryMaintenanceJob:
    repositoryConfigData:
      global:
        keepLatestMaintenanceJobs: 3
        # maintenance-job pods default to zero resources (BestEffort) and are
        # denied by require-resource-limits (cmdshift/platform#109) — sized
        # like the data-mover pods (node-agent-config.configmap.yaml), memory
        # limit 2x request for kopia maintenance spikes
        podResources:
          cpuRequest: 50m
          cpuLimit: 1000m
          memoryRequest: 256Mi
          memoryLimit: 512Mi
deployNodeAgent: true
upgradeJobResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
nodeAgent:
  containerSecurityContext:
    privileged: true
  extraArgs:
    # sizes the temporary data mover pods (see node-agent-config.configmap.yaml, backups/)
    - --node-agent-configmap=node-agent-config
  resources:
    requests:
      cpu: 10m
      # audit: busiest node-agent 51Mi steady — 88Mi = observed x 1.2
      memory: 88Mi
    limits:
      cpu: 500m
      memory: 120Mi
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
