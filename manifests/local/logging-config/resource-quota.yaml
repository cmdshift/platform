apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: logging
spec:
  hard:
    # audit 2026-09: loki + 5 alloy daemons + caches + gateway — 190m CPU /
    # 2104Mi req, 3140m/3236Mi limits, 9 pods (cmdshift/platform#93). 2×
    # request-sum absorbs the largest VPA gap in the cluster (loki-chunks-cache
    # memcached rec 335Mi vs 120Mi req).
    requests.cpu: 500m
    requests.memory: 4500Mi
    limits.cpu: 7
    limits.memory: 6Gi
    pods: "20"
