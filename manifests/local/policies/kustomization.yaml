apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# every yaml in the dir must be registered here — unregistered files get pruned by flux
resources:
  - kyverno.helm-release.yaml
configMapGenerator:
  - name: kyverno-values
    namespace: policies
    files:
      - values.yaml=kyverno-values.yaml
    options:
      disableNameSuffixHash: true
