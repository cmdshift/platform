apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: kyverno
      version: 3.9.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno
      admissionReports:
        enabled: false
      deferredLoading:
        enabled: false
      backgroundScan:
        enabled: true
        backgroundScanWorkers: 1
        backgroundScanInterval: 5m
      reporting:
        validate: false
    config:
      resourceFiltersInclude:
        - "[*/*,kyverno,*]"
      webhooks:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
    admissionController:
      replicas: 1
      hostNetwork: true # remove in the cloud
      serviceMonitor:
        enabled: true
      # resources:
      #   requests:
      #     cpu: ""
      #     memory: ""
      #   limits:
      #     cpu: ""
      #     memory: ""
    backgroundController:
      replicas: 1
      hostNetwork: true # remove in the cloud
      serviceMonitor:
        enabled: true
      # resources:
      #   requests:
      #     cpu: ""
      #     memory: ""
      #   limits:
      #     cpu: ""
      #     memory: ""
    cleanupController:
      replicas: 1
      hostNetwork: true # remove in the cloud
      serviceMonitor:
        enabled: true
      # resources:
      #   requests:
      #     cpu: ""
      #     memory: ""
      #   limits:
      #     cpu: ""
      #     memory: ""
    reportsController:
      replicas: 1
      hostNetwork: true # remove in the cloud
      serviceMonitor:
        enabled: true
      # resources:
      #   requests:
      #     cpu: ""
      #     memory: ""
      #   limits:
      #     cpu: ""
      #     memory: ""
