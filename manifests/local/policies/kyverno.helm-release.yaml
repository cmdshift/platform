apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: kyverno
      version: 3.9.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno
      admissionReports:
        enabled: false
      deferredLoading:
        enabled: false
      backgroundScan:
        enabled: true
        backgroundScanWorkers: 1
        backgroundScanInterval: 1h # investigate: was 5m, reports-controller CPU ramped to 5+ cores (see cmdshift/platform#17)
      reporting:
        validate: false
    config:
      resourceFiltersInclude:
        - "[*/*,kyverno,*]"
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
                - kube-public
                - kube-node-lease
                - flux-system
                - kyverno
    admissionController:
      replicas: 1
      hostNetwork: true # remove in the cloud
      container:
        resources:
          requests:
            cpu: 15m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 300Mi
      serviceMonitor:
        enabled: true
    backgroundController:
      replicas: 1
      hostNetwork: true # remove in the cloud
      resources:
        requests:
          cpu: 10m
          memory: 144Mi
        limits:
          cpu: 500m
          memory: 216Mi
      serviceMonitor:
        enabled: true
    cleanupController:
      replicas: 1
      hostNetwork: true # remove in the cloud
      resources:
        requests:
          cpu: 10m
          memory: 104Mi
        limits:
          cpu: 500m
          memory: 156Mi
      serviceMonitor:
        enabled: true
    reportsController:
      replicas: 1
      hostNetwork: true # remove in the cloud
      resources:
        requests:
          cpu: 100m
          memory: 160Mi
        limits:
          cpu: 2000m
          memory: 240Mi # memory sawtooth peaks ~178Mi during the hourly background scan (93% of the old 192Mi limit); 240Mi leaves headroom, request 160Mi covers the scan-driven baseline
      serviceMonitor:
        enabled: true
