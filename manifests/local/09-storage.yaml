apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage
  namespace: flux-system
spec:
  interval: 10s
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: network-policies
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/09-storage
  prune: true
  wait: true
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: local-path-provisioner
      namespace: local-path-storage
