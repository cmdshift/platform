apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backups
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 5s
  dependsOn:
    - name: sources
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/13-backups
  prune: true
  wait: true
  timeout: 10m
