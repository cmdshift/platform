apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certificates-config
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 5s
  dependsOn:
    - name: certificates
    - name: secrets-config
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/certificates-config
  prune: true
  wait: true
  timeout: 5m
