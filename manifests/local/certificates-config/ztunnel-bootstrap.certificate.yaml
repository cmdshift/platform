apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ztunnel-bootstrap
  namespace: kube-system
spec:
  # end-entity cert securing the agent<->ztunnel gRPC — self-signed with CA:FALSE
  # (rustls rejects a CA cert serving TLS), SAN localhost, server+client auth. ztunnel
  # pins this cert as its trust anchor. Pair: ztunnel-ca (cmdshift/platform#87).
  commonName: ztunnel-bootstrap
  dnsNames:
    - localhost
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  duration: 87600h # 10y
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
    # subPath mounts pin content at pod start — mid-flight rotation would split-brain
    # agent vs ztunnel until every pod rolls (rotation runbook)
    rotationPolicy: Never
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
  secretName: cilium-ztunnel-secrets
