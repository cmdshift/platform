apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: certificates
spec:
  hard:
    # audit 2026-09: cert-manager trio — 30m CPU / 224Mi req, 600m/336Mi limits,
    # 3 pods (cmdshift/platform#93). 2× request-sum headroom; VPA recs small
    # (largest: cert-manager-controller 75Mi).
    requests.cpu: 100m
    requests.memory: 500Mi
    limits.cpu: 1500m
    limits.memory: 750Mi
    pods: "8"
