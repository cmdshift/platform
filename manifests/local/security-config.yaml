apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-config
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 5s
  dependsOn:
    - name: security
    - name: crds
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/security-config
  # never prune: an exception deleted by GC is a finding that silently comes
  # back (or, for kyverno-side PolicyExceptions, pods denied at admission).
  # Exception removal must be a deliberate file deletion + explicit cleanup.
  prune: false
  wait: true
  timeout: 2m
