apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: security-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    # TracingPolicy CRDs come from the tetragon operator (security group); the
    # reverse dependency (security on this group) was a deadlock. The tetragon
    # PolicyException lives in policies-config/ so it lands before the release.
    - name: security
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/security-config
  # prune on purpose: TracingPolicies retire by file deletion; the tetragon
  # PolicyException (admission-critical) lives in policies-config/
  prune: true
  # no wait:true — TracingPolicy CRs are conditionless; waiting stalled 3x 2m
  # live ("no matches for kind" while the CRD exists). Real loaded-signal:
  # `tetra tracingpolicy list` + the TetragonTracingPolicyLoadFailed alert
  # (thanos-rules tetragon-alerts).
  timeout: 2m
