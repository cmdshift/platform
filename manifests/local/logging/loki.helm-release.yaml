# 12-logging/loki.helm-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: logging
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: 18.12.1
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    monitoring:
      serviceMonitor:
        enabled: true # loki self-metrics — lives under `monitoring:` in this chart
    test:
      enabled: false
    lokiCanary:
      enabled: false
    global:
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: loki-s3-credentials
    ruler:
      storage:
        type: local
        local:
          directory: /etc/loki/rules
        rule_path: /tmp/loki/rules
        alertmanager_url: http://alertmanager-operated.monitoring.svc:9093
        enable_api: true
        enable_alertmanager_v2: true
        evaluation_interval: 1m
    sidecar:
      rules:
        enabled: true
        folder: /etc/loki/rules
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          cpu: 500m
          memory: 144Mi
    gateway:
      config:
        server:
          http_listen_port: 80
        frontend:
          log_requests: false
        limits:
          allow_structured_metadata: true
        common:
          path_prefix: /
        org_id:
          default: self-monitoring
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 24Mi
      metrics:
        resources:
          # 2026-09-06 overnight: peak 22.3Mi = 93% of the old 24Mi limit —
          # request = P99 x 1.2, limit = 1.5x request
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 36Mi
    loki:
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: aws
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: s3
        bucketNames:
          chunks: loki
          ruler: loki-rules
        s3:
          endpoint: "main-s3.objects.svc:8333"
          s3ForcePathStyle: true
          insecure: true
          accessKeyId: "${LOKI_S3_ACCESS_KEY_ID}"
          secretAccessKey: "${LOKI_S3_SECRET_ACCESS_KEY}"
      limits_config:
        # bounded retention (was unbounded — the seaweed loki bucket grew
        # forever); 30d matches the thanos 5m-tier. Logs are triage data.
        retention_period: 30d
      compactor:
        retention_enabled: true
        # Loki 3.x retention requires a delete-request store; `s3` names the
        # chart-generated aws object store — verified in /config + compactor
        # startup after reconcile
        delete_request_store: s3
        # default 2h safe-delete window is production caution; 5m keeps the
        # delete path observable in a test cluster (verify via
        # loki_compactor_deleted_lines_total after each retention sweep)
        retention_delete_delay: 5m
        # default 24h = the undo window before a delete request is processed;
        # 15m is a deliberate local-only tradeoff (shorter accidental-delete
        # undo, faster delete-path feedback) — `# true in the cloud` style:
        # keep the default in cloud
        delete_request_cancel_period: 15m
      extraEnv:
        - name: LOKI_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: loki-s3-credentials
              key: LOKI_S3_ACCESS_KEY_ID
        - name: LOKI_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: loki-s3-credentials
              key: LOKI_S3_SECRET_ACCESS_KEY
      persistence:
        enabled: true
        storageClassName: local-path
        size: 2Gi
      resources:
        requests:
          cpu: 15m
          memory: 320Mi
        limits:
          cpu: 200m
          memory: 512Mi
    chunksCache:
      resources:
        requests:
          cpu: 10m
          memory: 40Mi
        limits:
          cpu: 20m
          memory: 60Mi
    resultsCache:
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 20m
          memory: 12Mi
    memcachedExporter:
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          cpu: 100m
          memory: 36Mi
