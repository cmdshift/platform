# 12-logging/loki.helm-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: logging
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: 18.12.1
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  values:
    test:
      enabled: false
    lokiCanary:
      enabled: false
    global:
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: loki-s3-credentials
    ruler:
      storage:
        type: local
        local:
          directory: /etc/loki/rules
        rule_path: /tmp/loki/rules
        alertmanager_url: http://alertmanager-operated.monitoring.svc:9093
        enable_api: true
        enable_alertmanager_v2: true
        evaluation_interval: 1m
    sidecar:
      rules:
        enabled: true
        folder: /etc/loki/rules
    gateway:
      config:
        server:
          http_listen_port: 80
        frontend:
          log_requests: false
        limits:
          allow_structured_metadata: true
        common:
          path_prefix: /
        org_id:
          default: self-monitoring
    loki:
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: aws
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        type: s3
        bucketNames:
          chunks: loki
          ruler: loki-rules
        s3:
          endpoint: "main-s3.objects.svc:8333"
          s3ForcePathStyle: true
          insecure: true
          accessKeyId: "${LOKI_S3_ACCESS_KEY_ID}"
          secretAccessKey: "${LOKI_S3_SECRET_ACCESS_KEY}"
      extraEnv:
        - name: LOKI_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: loki-s3-credentials
              key: LOKI_S3_ACCESS_KEY_ID
        - name: LOKI_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: loki-s3-credentials
              key: LOKI_S3_SECRET_ACCESS_KEY
      persistence:
        enabled: true
        storageClassName: local-path
        size: 2Gi
