alloy:
  mounts:
    varlog: true
    containerd: true
    extra:
      # writable /tmp: --storage.path=/tmp/alloy (WAL + positions) below
      - name: tmp
        mountPath: /tmp
  # config comes from the kustomization-generated alloy-config ConfigMap
  # (configMapGenerator on config.alloy). Without this block the chart
  # SILENTLY installs its example config — pods run healthy, push nothing,
  # and Loki ingests nothing (cmdshift/platform#27, dropped in ddd4f83 by
  # an edit that overwrote this block with the tmp mount).
  configMap:
    create: false
    name: alloy-config
    key: config.alloy
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
    # NSA hardening: immutable root fs. Alloy still runs as root
    # (image declares no USER; the alloy PolicyException covers
    # run-as-nonroot for the host-log mounts) — the WAL/positions live in
    # --storage.path=/tmp/alloy, so /tmp stays a writable emptyDir
    readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 10m
      # 2026-09-07 audit (post ns-refactor churn): pods 283-310Mi = 118-129%
      # of the old 240Mi request — 384Mi = P99 x 1.2, limit 1.5x
      memory: 384Mi
    limits:
      cpu: 200m
      memory: 576Mi
configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi
controller:
  volumes:
    extra:
      - name: tmp
        emptyDir: {}
serviceMonitor:
  enabled: true # alloy self-metrics — top-level key in this chart
