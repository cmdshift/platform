apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: logging
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    alloy:
      mounts:
        varlog: true
        containerd: true
        extra:
          # writable /tmp: --storage.path=/tmp/alloy (WAL + positions) below
          - name: tmp
            mountPath: /tmp
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
        # C-0017 (kubescape NSA): immutable root fs. Alloy still runs as root
        # (image declares no USER; the alloy PolicyException covers
        # run-as-nonroot for the host-log mounts) — the WAL/positions live in
        # --storage.path=/tmp/alloy, so /tmp stays a writable emptyDir
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 10m
          memory: 240Mi
        limits:
          cpu: 200m
          memory: 512Mi
    configReloader:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
    controller:
      volumes:
        extra:
          - name: tmp
            emptyDir: {}
    serviceMonitor:
      enabled: true # alloy self-metrics — top-level key in this chart
