apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certificates
  namespace: flux-system
spec:
  # drift-heal only: propagation is event-driven; manual flow = sync_wait + flux_wait
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/local/certificates
  prune: true
  wait: true
  timeout: 5m
