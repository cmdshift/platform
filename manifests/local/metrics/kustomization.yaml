apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# every yaml in the dir must be registered here — unregistered files get pruned by flux
resources:
  - metrics-server.helm-release.yaml
configMapGenerator:
  - name: metrics-server-values
    namespace: kube-system
    files:
      - values.yaml=metrics-server-values.yaml
    options:
      disableNameSuffixHash: true
