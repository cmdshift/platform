apiVersion: v1
kind: LimitRange
metadata:
  name: compute-defaults
  namespace: observability
spec:
  limits:
    - type: Container
      # quota admission fails any container lacking requests/limits — including
      # PolicyException-exempt ones (wedged the thanos-ruler STS once, cmdshift/platform#111);
      # these defaults fill that gap (sized from the config-reloader audit)
      default:
        cpu: 200m
        memory: 64Mi
      defaultRequest:
        cpu: 10m
        memory: 24Mi
