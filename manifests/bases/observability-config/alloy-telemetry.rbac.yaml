apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-telemetry
  namespace: observability
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "services", "endpoints", "endpointslices"]
    verbs: ["get", "list", "watch"]
  # kubelet /metrics + /metrics/cadvisor authorize via SubjectAccessReview for
  # nodes/{subresource}: get nodes/metrics + nodes/proxy (SA-token scrapes need
  # these — cmdshift/platform#141)
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/proxy", "nodes/stats", "nodes/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch"]
  # apiserver /metrics is a non-resource URL — RBAC for it lives outside the
  # apiGroups shape (a 403 here reads as a plain scrape failure in the scraper)
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-telemetry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-telemetry
subjects:
  - kind: ServiceAccount
    name: alloy-telemetry
    namespace: observability