apiVersion: batch/v1
kind: Job
metadata:
  name: o2-sync
  namespace: observability
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: o2-sync
    spec:
      serviceAccountName: o2-sync
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: registry.cloud.test/platform/o2-sync:default
          imagePullPolicy: IfNotPresent
          command: ["/bin/sync.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: O2_URL
              value: http://openobserve.observability.svc:5080
            - name: O2_USER
              valueFrom:
                secretKeyRef:
                  name: openobserve-credentials
                  key: ZO_ROOT_USER_EMAIL
            - name: O2_PASS
              valueFrom:
                secretKeyRef:
                  name: openobserve-credentials
                  key: ZO_ROOT_USER_PASSWORD
            - name: MAX_STREAM_RETRIES
              value: "10"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /bin/sync.sh
              subPath: sync.sh
              readOnly: true
            - name: destinations
              mountPath: /destinations
              readOnly: true
            - name: dashboards-kubernetes
              mountPath: /dashboards/kubernetes
              readOnly: true
            - name: dashboards-openobserve
              mountPath: /dashboards/openobserve
              readOnly: true
            - name: alerts
              mountPath: /alerts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: o2-sync-script
            defaultMode: 0555
        - name: destinations
          configMap:
            name: o2-destinations
        - name: dashboards-kubernetes
          configMap:
            name: o2-dashboards-kubernetes
        - name: dashboards-openobserve
          configMap:
            name: o2-dashboards-openobserve
        - name: alerts
          configMap:
            name: o2-alerts
        - name: tmp
          emptyDir: {}
