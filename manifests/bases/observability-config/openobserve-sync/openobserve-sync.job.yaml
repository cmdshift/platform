apiVersion: batch/v1
kind: Job
metadata:
  name: openobserve-sync
  namespace: observability
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openobserve-sync
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: registry.cloud.test/platform/openobserve-sync:default
          imagePullPolicy: IfNotPresent
          command: ["/script/sync.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: O2_URL
              value: http://openobserve.observability.svc:5080
            - name: O2_USER
              valueFrom:
                secretKeyRef:
                  name: openobserve-credentials
                  key: ZO_ROOT_USER_EMAIL
            - name: O2_PASS
              valueFrom:
                secretKeyRef:
                  name: openobserve-credentials
                  key: ZO_ROOT_USER_PASSWORD
            - name: MAX_STREAM_RETRIES
              value: "10"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
            - name: streams
              mountPath: /streams
              readOnly: true
            - name: alerts
              mountPath: /alerts
              readOnly: true
            - name: dashboards
              mountPath: /dashboards
              readOnly: true
            - name: destinations
              mountPath: /destinations
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: openobserve-sync-script
            defaultMode: 0555
        - name: streams
          configMap:
            name: openobserve-sync-streams
        - name: alerts
          configMap:
            name: openobserve-sync-alerts
        - name: dashboards
          configMap:
            name: openobserve-sync-dashboards
        - name: destinations
          configMap:
            name: openobserve-sync-destinations
        - name: tmp
          emptyDir: {}
