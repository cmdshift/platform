apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: Prometheus
    type: prometheus
    access: proxy
    # mimir monolith — prometheus-compatible query API lives under /prometheus
    # (the OTel collector remote-writes here with the same OrgID,
    # cmdshift/platform#128)
    url: http://mimir.observability.svc:8080/prometheus
    isDefault: true
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: self-monitoring
