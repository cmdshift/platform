apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: observability
spec:
  # statefulset, not deployment: the target allocator only supports statefulset
  # pools (operator rewrites mode with a validation error otherwise)
  mode: statefulset
  replicas: 1
  targetAllocator:
    enabled: true
    prometheusCR:
      enabled: true
      scrapeInterval: 30s
      evaluationInterval: 30s
      # empty object = select ALL ServiceMonitors/PodMonitors cluster-wide;
      # an omitted selector matches nothing, silently (cmdshift/platform#141)
      serviceMonitorSelector: {}
      podMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorNamespaceSelector: {}
    # the TA pod inherits nothing from the collector spec — without these the
    # kyverno Deny-mode set rejects it (targetallocator_controller reconcile
    # error, admission denied, empty TA endpoints; cmdshift/platform#141)
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  # v1beta1 CRD takes config as a structured object (v1alpha1 took a string)
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          global:
            # multi-cluster prep — kube-prometheus-stack carried this label
            external_labels:
              cluster: local
            scrape_interval: 30s
          scrape_configs:
            # control-plane scrapes the ServiceMonitors can't express without
            # node endpoints juggling: node-role SD + the collector's own SA
            # token (no secretRef mounting through the target allocator)
            - job_name: kubelet
              scheme: https
              tls_config:
                insecure_skip_verify: true
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(.+)
            - job_name: cadvisor
              scheme: https
              metrics_path: /metrics/cadvisor
              tls_config:
                insecure_skip_verify: true
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(.+)
            - job_name: apiserver
              scheme: https
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: endpoints
                  namespaces:
                    names: [default]
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_label_component, __meta_kubernetes_service_label_provider]
                  action: keep
                  regex: apiserver;kubernetes
            # host-network static pods — SD by pod label, fixed host ports
            - job_name: kube-controller-manager
              scheme: https
              tls_config:
                insecure_skip_verify: true
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_component]
                  action: keep
                  regex: kube-controller-manager
                - source_labels: [__meta_kubernetes_pod_phase]
                  action: drop
                  regex: Pending|Succeeded|Failed|Completed
                - source_labels: [__meta_kubernetes_pod_host_ip]
                  action: replace
                  target_label: __address__
                  regex: (.+)
                  replacement: ${1}:10257
            - job_name: kube-scheduler
              scheme: https
              tls_config:
                insecure_skip_verify: true
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_component]
                  action: keep
                  regex: kube-scheduler
                - source_labels: [__meta_kubernetes_pod_phase]
                  action: drop
                  regex: Pending|Succeeded|Failed|Completed
                - source_labels: [__meta_kubernetes_pod_host_ip]
                  action: replace
                  target_label: __address__
                  regex: (.+)
                  replacement: ${1}:10259
    processors:
      k8sattributes: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch:
        # one monolithic batch deadlined / burst-rejected at mimir — split the
        # scrape snapshot into ~5s-sized pushes (cmdshift/platform#141)
        timeout: 5s
        send_batch_size: 8000
        send_batch_max_size: 12000
    exporters:
      otlphttp/tempo:
        endpoint: http://tempo.observability.svc:4318
      otlphttp/loki:
        endpoint: http://loki-gateway.observability.svc:80/otlp
        headers:
          X-Scope-OrgID: self-monitoring
      prometheusremotewrite/mimir:
        endpoint: http://mimir.observability.svc:8080/api/v1/push
        headers:
          X-Scope-OrgID: self-monitoring
        # the full cluster's scrape payload rides one exporter — the default 5s
        # remote_write timeout deadlined every batch (context deadline exceeded,
        # all data dropped, cmdshift/platform#141)
        timeout: 30s
        remote_write_queue:
          enabled: true
          queue_size: 10000
          num_consumers: 10
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes, memory_limiter, batch]
          exporters: [otlphttp/tempo]
        logs:
          receivers: [otlp]
          processors: [k8sattributes, memory_limiter, batch]
          exporters: [otlphttp/loki]
        metrics:
          receivers: [otlp, prometheus]
          processors: [k8sattributes, memory_limiter, batch]
          exporters: [prometheusremotewrite/mimir]
  managementState: managed
  observability:
    metrics:
      enableMetrics: true
  resources:
    # inherits the prometheus scrape load (kps ran 100m/1536Mi requests);
    # lean-start evidence pending — audit after seasoning (cmdshift/platform#141)
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: 2000m
      memory: 1536Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 30
