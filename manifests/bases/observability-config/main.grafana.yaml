apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: observability
  labels:
    dashboards: grafana
spec:
  config:
    log:
      mode: console
    # auth via the oauth2-proxy side of the Gateway (cmdshift/platform#41):
    # the proxy validates the OIDC session and forwards X-Forwarded-Email on
    # every upstream request (pass_user_headers default) — X-Auth-Request-*
    # headers only ride the auth flow, not cookie-authed requests
    auth.proxy:
      enabled: "true"
      header_name: X-Forwarded-Email
      header_property: email
      auto_sign_up: "true"
    users:
      allow_sign_up: "true"
      auto_assign_org: "true"
      auto_assign_org_role: "Viewer"
  disableDefaultAdminSecret: true
  deployment:
    spec:
      template:
        spec:
          # NSA hardening: grafana only serves HTTP — no SA token needed; non-root at pod level
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
          containers:
            - name: grafana
              resources:
                requests:
                  cpu: 10m
                  memory: 320Mi
                limits:
                  cpu: 200m
                  memory: 480Mi
              env:
                # JSON logging: env beats grafana.ini, and the operator's validating
                # webhook rejects spec.config.log.console — grafana 13 ignores
                # [log] format alone, so the env override is the only path
                - name: GF_LOG_CONSOLE_FORMAT
                  value: json
                # the dashboard's preset strip renders button-styled links via a text
                # panel (html + inline styles) — the sanitizer strips style attributes.
                # Content is repo-authored only, so the guard is off
                - name: GF_PANELS_DISABLE_SANITIZE_HTML
                  value: "true"
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: main-grafana-credentials
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: main-grafana-credentials
                      key: GF_SECURITY_ADMIN_PASSWORD
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: local-path
