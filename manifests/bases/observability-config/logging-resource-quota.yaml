apiVersion: v1
kind: ResourceQuota
metadata:
  # was ResourceQuota/compute in the logging namespace — renamed on the merge (cmdshift/platform#120):
  # two same-named quotas would double-charge every pod. Both admit every pod here, so each
  # must clear the FULL namespace pod set; kept in lockstep with `compute`
  name: logging-compute
  namespace: observability
spec:
  hard:
    # sized = `compute` in this namespace (both quotas admit the same pod set;
    # lockstep history: cmdshift/platform#83, cmdshift/platform#128, #146);
    # raised from 16 in cmdshift/platform#155 — a grafana-deployment surge pod
    # did not fit (7-node DSs alone charge 11.1 CPU: node-exporter 7 + alloy-logging 4.1)
    requests.cpu: "3"
    requests.memory: 10Gi
    limits.cpu: 20
    limits.memory: 16Gi
    pods: "36"
