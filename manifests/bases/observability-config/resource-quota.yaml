apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: observability
spec:
  hard:
    # sized for the current namespace pod set (26 pods incl. 2 DS × 7 nodes);
    # the surge headroom below admits a grafana-deployment rolling update
    # (blocked at 16 on logging-compute in cmdshift/platform#155)
    requests.cpu: "3"
    requests.memory: 10Gi
    limits.cpu: 20
    limits.memory: 16Gi
    pods: "32"
