apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: observability
spec:
  hard:
    # sized to the full namespace (audit cmdshift/platform#93): CPU limits quota covers
    # prometheus/compaction bursts; headroom absorbs the thanos↔mimir coexistence window
    # (cmdshift/platform#128) — re-audit after thanos teardown
    requests.cpu: "1"
    requests.memory: 8Gi
    limits.cpu: 16
    limits.memory: 12Gi
    pods: "36"
