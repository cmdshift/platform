apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: observability
spec:
  hard:
    # sized for the namespace pod set (shrank with the LGTM teardown,
    # cmdshift/platform#171 — openobserve + collector replace the LGTM pods)
    requests.cpu: "3"
    requests.memory: 10Gi
    limits.cpu: 20
    limits.memory: 16Gi
    pods: "32"
