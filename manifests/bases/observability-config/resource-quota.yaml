apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: observability
spec:
  hard:
    # cmdshift/platform#146: the OTel collector swap (768Mi/250m req) became the
    # alloy-telemetry release (same requests; a statefulset, so the cluster
    # Service + config-reloader add one CPU-request unit vs the CR shape)
    # requests ≈ 0.9Gi headroom, limits ≈ 3Gi burst headroom
    requests.cpu: "2"
    requests.memory: 8Gi
    limits.cpu: 16
    limits.memory: 12Gi
    pods: "24"
