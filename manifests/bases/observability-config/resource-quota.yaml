apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: observability
spec:
  hard:
    # cmdshift/platform#149: the parallel window runs both alloy stacks + the
    # alloy-operator; commit 2 (old releases deleted) sheds ~7 pods back
    # requests ≈ 0.9Gi headroom, limits ≈ 3Gi burst headroom
    requests.cpu: "3"
    requests.memory: 10Gi
    limits.cpu: 20
    limits.memory: 16Gi
    pods: "32"
