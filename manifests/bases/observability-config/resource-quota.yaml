apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: observability
spec:
  hard:
    # re-audited post cmdshift/platform#141: kps prometheus (1536Mi req / 2304Mi
    # lim) + operator + reloaders removed; mimir absorbed the raw-store load
    # (1280Mi req / 1920Mi lim) and the OTel collector the scraping (768Mi req /
    # 1536Mi lim). Requests ≈ 0.6Gi headroom, limits ≈ 3Gi burst headroom
    requests.cpu: "1"
    requests.memory: 8Gi
    limits.cpu: 16
    limits.memory: 12Gi
    pods: "24"
