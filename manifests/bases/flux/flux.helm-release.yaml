apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux
  namespace: flux-system
spec:
  interval: 12h
  releaseName: flux
  chart:
    spec:
      chart: flux2
      version: "2.19.0"
      sourceRef:
        kind: HelmRepository
        name: fluxcd-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: flux-values
      valuesKey: values.yaml
