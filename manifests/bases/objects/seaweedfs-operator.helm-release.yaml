apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs-operator
  namespace: objects
spec:
  interval: 1h
  chart:
    spec:
      chart: seaweedfs-operator
      version: 0.1.42
      sourceRef:
        kind: HelmRepository
        name: seaweedfs-operator
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # generated by configMapGenerator in kustomization.yaml (cmdshift/platform#31)
  valuesFrom:
    - kind: ConfigMap
      name: seaweedfs-operator-values
      valuesKey: values.yaml
  # JSON logging: the chart exposes no args knob for the manager — rendered via postRenderers
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: seaweedfs-operator
              spec:
                template:
                  spec:
                    containers:
                      # container name is seaweedfs-operator — a "manager" name patch matches nothing
                      - name: seaweedfs-operator
                        args:
                          - --leader-elect
                          - --metrics-bind-address=:8080
                          - --zap-encoder=json
            target:
              kind: Deployment
              name: seaweedfs-operator
