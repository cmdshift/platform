apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey-operator
  namespace: datastores
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey-operator
      version: 0.6.0
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: valkey-operator-values
      valuesKey: values.yaml
