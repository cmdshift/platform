upgradeCompatibility: null # set to previous version
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
encryption:
  enabled: true
  # ztunnel — CA + postRenderers mechanics: networking/README.md
  type: ztunnel
  ztunnel:
    ca:
      type: internal
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        # chart default sets requests only — admission requires limits
        cpu: 500m
        memory: 768Mi
envoy:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi # steady ~25Mi; connectivity-test L7 traffic pushed a busy node to ~69Mi
    limits:
      cpu: 40m
      memory: 128Mi
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true
    nodes:
      matchLabels:
        k8s-role/work: ""
hubble:
  relay:
    enabled: true
    prometheus:
      # relay metrics (9966) — alloy-telemetry scrapes the metrics service
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 96Mi
  ui:
    enabled: true
    # chart 1.21-pre nil-pointers when hubble.ui.httpRoute is absent
    httpRoute:
      enabled: false
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          cpu: 200m # audit: 13.6% of CFS periods throttled (at 100m)
          memory: 72Mi
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m # audit: 33% of CFS periods throttled (at 20m)
          memory: 24Mi
ipam:
  mode: kubernetes
initResources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    cpu: 100m
    memory: 128Mi
k8sServiceHost: localhost
k8sServicePort: 7445
# gateway-api controller prerequisite — the operator refuses the GatewayClass without it (cmdshift/platform#70)
kubeProxyReplacement: true
l2announcements:
  enabled: true
prometheus:
  enabled: true # cilium-agent metrics :9962 — disabled by chart default, alloy-telemetry scrapes it
  # the metrics services exist ONLY while serviceMonitor.enabled is true (chart
  # renders svc+SM as one block) — keep metricsService on now that the SMs are
  # gone, or discovery finds no cilium-agent/cilium-operator targets (#146)
  metricsService: true
operator:
  prometheus:
    metricsService: true
  resources:
    requests:
      cpu: 10m
      memory: 144Mi
    limits:
      cpu: 200m # audit: 7.3% of CFS periods throttled (at 40m) — convention floor
      memory: 216Mi
resources:
  requests:
    # 12h CPU P99 85m with 7.5% of CFS periods throttled at 50m — eBPF/encrypt bursts
    cpu: 100m
    # audit: agents 296-351Mi (worst node) — 448Mi = worst-node x 1.2, limit 1.5x
    memory: 448Mi
  limits:
    cpu: 1000m # audit: 21.8% of CFS periods throttled (at 200m) — eBPF/encrypt bursts
    memory: 672Mi # connectivity-test runs spiked agents to ~323Mi — 1.5x keeps burst headroom
rollOutCiliumPods: true
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
