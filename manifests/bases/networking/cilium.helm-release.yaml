apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: cilium
      # stable 1.20.2: kernel-7.2 startup crash fixed here (b73ca6e8
      # bpf_core_enum_value_exists for HAVE_SET_RETVAL, cilium/cilium#48016) —
      # the pre-release pin is no longer needed; must match the bootstrap pin
      # or adoption downgrades back to a broken release
      version: 1.20.2
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
