apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ztunnel-ca
  namespace: kube-system
spec:
  # mesh root of trust for cilium ztunnel — NOT root+intermediate (networking/README.md)
  isCA: true
  commonName: ztunnel-ca
  usages:
    - digital signature
    - cert sign
  duration: 87600h # 10y
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
    rotationPolicy: Never # a CA key must outlive any cert it issues
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
  secretName: cilium-ztunnel-ca
