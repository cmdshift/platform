apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-auth
  namespace: access
spec:
  parentRefs:
    - name: local-test
      namespace: default
      sectionName: https-wildcard
  hostnames:
    - grafana.local.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana-auth-proxy-oauth2-proxy
          port: 4180
---
