apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-credentials
  namespace: access
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: main
    kind: ClusterSecretStore
  # single extract — the chart's existingSecret contract is one Secret with
  # client-id/client-secret/cookie-secret keys, and the webhook provider
  # serves whole JSON docs (extract, not per-key data)
  dataFrom:
    - extract:
        key: access/oauth2-proxy-credentials
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-root-ca
  namespace: access
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: main
    kind: ClusterSecretStore
  dataFrom:
    - extract:
        key: access/platform-root-ca
