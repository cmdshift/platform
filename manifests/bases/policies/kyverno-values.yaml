features:
  policyExceptions:
    enabled: true
    namespace: policies
# chart default is reg.kyverno.io, a vanity proxy of ghcr (its token realm is
# ghcr.io/token) — but the caching proxy's pull-through to it fails silently
# (angos_pull_through_total miss, 404 served) while ghcr.io works; same content
global:
  image:
    registry: ghcr.io
  # JSON logging: see observability/loki-values.yaml (nests under features here)
  logging:
    format: json
  admissionReports:
    enabled: false
  deferredLoading:
    enabled: false
  backgroundScan:
    enabled: true
    backgroundScanWorkers: 1
    backgroundScanInterval: 1h # investigate: was 5m, reports-controller CPU ramped to 5+ cores (see cmdshift/platform#17)
  reporting:
    validate: false
config:
  resourceFiltersInclude:
    - "[*/*,policies,*]"
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - flux-system
            - policies
admissionController:
  replicas: 1
  hostNetwork: true # remove in the cloud
  container:
    resources:
      requests:
        cpu: 15m
        memory: 208Mi # audit: steady 120Mi — observed peak x 1.2
      limits:
        cpu: 500m
        memory: 300Mi
  podSecurityContext:
    runAsNonRoot: true
backgroundController:
  replicas: 1
  hostNetwork: true # remove in the cloud
  resources:
    requests:
      cpu: 10m
      memory: 144Mi
    limits:
      cpu: 500m
      memory: 216Mi
  podSecurityContext:
    runAsNonRoot: true
cleanupController:
  replicas: 1
  hostNetwork: true # remove in the cloud
  resources:
    requests:
      cpu: 10m
      memory: 104Mi
    limits:
      cpu: 500m
      memory: 156Mi
  podSecurityContext:
    runAsNonRoot: true
reportsController:
  replicas: 1
  hostNetwork: true # remove in the cloud
  resources:
    requests:
      # 7d peak 101m during scan churn — 20m request, limit keeps burst room (cmdshift/platform#66)
      cpu: 20m
      memory: 160Mi
    limits:
      cpu: 2000m
      memory: 240Mi # memory sawtooth peaks ~178Mi during the hourly background scan; 240Mi leaves headroom, request 160Mi covers the scan-driven baseline
  podSecurityContext:
    runAsNonRoot: true
