apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: allow-alloy-host-logs
  namespace: policies
  annotations:
    # bump to force admission re-pick-up after CEL updates — the engine can
    # lag the stored object (policies/README.md)
    platform.cmdshift.io/force-reconcile: "1"
spec:
  policyRefs:
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    # DAC_READ_SEARCH for the read-only audit-log hostPath mount
    # (cmdshift/platform#90)
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
  matchConditions:
    - name: match-alloy
      expression: "object.metadata.namespace == 'observability' && object.metadata.name.startsWith('alloy')"
