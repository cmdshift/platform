apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: allow-openobserve-collector-host-access
  namespace: policies
  annotations:
    # bump to force admission re-pick-up after CEL updates — the engine can
    # lag the stored object (policies/README.md)
    platform.cmdshift.io/force-reconcile: "1"
spec:
  policyRefs:
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    # hostmetrics receiver needs host fs access; check what caps the agent
    # actually drops to — tighten the refs list after first on-cluster run
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
  matchConditions:
    - name: match-openobserve-collector
      expression: "object.metadata.namespace == 'observability' && object.metadata.name.startsWith('openobserve-collector')"
