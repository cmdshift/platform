apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: auto-pod-disruption-budget-multi-replica
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: ["deployments", "statefulsets"]
  matchConditions:
    - name: multi-replica
      expression: "object.spec.?replicas.orValue(1) > 1"
    - name: no-skip-label
      expression: "!('pdb.kyverno.io/skip' in object.metadata.?labels.orValue({}))"
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: policy/v1
          kind: PodDisruptionBudget
          metadata:
            name: (( object.metadata.name ))-auto
            namespace: (( object.metadata.namespace ))
            labels:
              app.kubernetes.io/managed-by: kyverno
          spec:
            maxUnavailable: 1
            selector: (( object.spec.selector ))
