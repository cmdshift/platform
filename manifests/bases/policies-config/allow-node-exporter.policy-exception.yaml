apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: allow-node-exporter
  namespace: policies
spec:
  policyRefs:
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-host-ports
      kind: ValidatingPolicy
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    - name: restrict-seccomp-strict
      kind: ValidatingPolicy
  matchConditions:
    - name: match-node-exporter
      # both prefixes: the standalone release DS and the kps-vendored one while it still
      # exists mid-decomposition — kps prefix removable after its next upgrade (cmdshift/platform#69)
      expression: "object.metadata.namespace == 'observability' && (object.metadata.name.startsWith('prometheus-node-exporter') || object.metadata.name.startsWith('kube-prometheus-stack-prometheus-node-exporter'))"
