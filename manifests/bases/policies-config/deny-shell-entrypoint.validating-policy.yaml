# Admission-time backstop for the tetragon exec deny-list: container-init execs escape
# pod-scoped enforcement. Binary list is verbatim the tetragon deny-list's — keep the two
# in lockstep (security/README.md; scoped namespaces cmdshift/platform#56, cmdshift/platform#58)
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: deny-shell-entrypoint
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: ["pods"]
  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - daemonsets
        - jobs
        - cronjobs
  matchConditions:
    # phase-4 wave 1 (cmdshift/platform#60): every flux-managed namespace.
    # Lockstep with the exec-deny-list-* TracingPolicies.
    # NOTE: the sync Job for OpenObserve dashboards/alerts curls the O2 API from
    # an image whose ENTRYPOINT is the sync script — no shell command needed.
    - name: operator-namespaces
      expression: "object.metadata.namespace in ['flux-system', 'policies', 'secrets', 'access', 'backups', 'certificates', 'datastores', 'observability', 'scanning', 'security', 'storage']"
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c,
          (c.?command.orValue([]) + c.?args.orValue([]))
            .all(e, !(e in [
              '/bin/sh', '/bin/bash', '/bin/dash', '/bin/ash', '/bin/zsh',
              '/usr/bin/sh', '/usr/bin/bash', '/usr/bin/dash', '/usr/bin/zsh',
              '/usr/bin/python', '/usr/bin/perl', '/usr/bin/ruby', '/usr/bin/node',
              '/usr/bin/env', '/usr/bin/nc', '/bin/nc',
              '/usr/bin/socat', '/bin/socat',
              '/usr/bin/wget', '/bin/wget',
              '/usr/bin/curl', '/bin/curl'
            ])))
      message: >-
        Containers must not run a shell, interpreter, or net/exec tool as an
        explicit command or argument in the operator namespaces (matches the
        tetragon exec deny-list; needs a shell? file a scoped PolicyException
        in policies-config/ — see manifests/bases/policies/README.md).
