initContainers:
  - name: velero-plugin-for-aws
    image: index.docker.io/velero/velero-plugin-for-aws:v1.14.2
    volumeMounts:
      - mountPath: /target
        name: plugins
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 40m
        memory: 48Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
# chart exposes container-level securityContext only on the plugin init container —
# the roFS/caps deviations land there (backups/README.md)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1002
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
credentials: {}
resources:
  # OOMKilled at 132Mi during kopia repo prep — 2x limit absorbs maintenance spikes
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
configuration:
  # JSON logging: see observability/loki-values.yaml
  logFormat: json
  backupStorageLocation: null
  volumeSnapshotLocation: null
  repositoryMaintenanceJob:
    repositoryConfigData:
      global:
        keepLatestMaintenanceJobs: 3
        podResources:
          cpuRequest: 50m
          cpuLimit: 1000m
          memoryRequest: 256Mi
          memoryLimit: 512Mi
deployNodeAgent: true
upgradeJobResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
nodeAgent:
  containerSecurityContext:
    privileged: true
  extraArgs:
    # sizes the temporary data mover pods (see node-agent-config.configmap.yaml, backups/)
    - --node-agent-configmap=node-agent-config
  resources:
    requests:
      cpu: 10m
      # audit: busiest node-agent 51Mi steady — 88Mi = observed x 1.2
      memory: 88Mi
    limits:
      cpu: 500m
      memory: 120Mi
metrics:
  enabled: true # velero server metrics :8085 — alloy-telemetry scrapes the metrics service
