apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - node-agent-config.configmap.yaml
  - velero.helm-release.yaml
configMapGenerator:
  - name: velero-values
    namespace: backups
    files:
      - values.yaml=velero-values.yaml
    options:
      disableNameSuffixHash: true
