apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tetragon
  namespace: security
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: tetragon
      version: 1.7.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # tracefs mount for talos-in-docker — mechanics: security/README.md
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: tetragon
            patch: |-
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: tetragon
                namespace: security
              spec:
                template:
                  spec:
                    initContainers:
                      - name: mount-tracefs
                        # idempotent: mount only when /sys/kernel/tracing isn't already
                        # real tracefs (Bidirectional propagation pushes the mount up
                        # to the node, so later pods see it there)
                        image: busybox:1.37
                        command:
                          - sh
                          - -c
                          - "[ \"$(stat -f -c %t /sys/kernel/tracing)\" = 74726163 ] || mount -t tracefs -o nosuid,noexec,nodev tracefs /sys/kernel/tracing"
                        securityContext:
                          privileged: true
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            cpu: 100m
                            memory: 32Mi
                        volumeMounts:
                          - name: sys-kernel-tracing
                            mountPath: /sys/kernel/tracing
                            mountPropagation: Bidirectional
                    containers:
                      - name: tetragon
                        volumeMounts:
                          - name: sys-kernel-tracing
                            mountPath: /sys/kernel/tracing
                            mountPropagation: Bidirectional
  valuesFrom:
    - kind: ConfigMap
      name: tetragon-values
      valuesKey: values.yaml
