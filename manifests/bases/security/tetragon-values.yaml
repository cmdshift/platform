# process visibility requires the host network namespace (load-bearing chart default)
hostNetwork: true
extraHostPathMounts:
  - name: sys-kernel-tracing
    mountPath: /sys/kernel/tracing
tetragon:
  extraArgs:
    disable-kprobe-multi: "true" # kernel 7.2 kprobe_multi attach failure (security/README.md)
  enableProcessCred: true
  clusterName: local-test
  grpc:
    address: "localhost:54321"
  # request ~= P99 x 1.2, limit 1.5x (48h audit, cmdshift/platform#28/#66) — warmup
  # ramp then GC sawtooth, not a leak: the data cache is capacity-bounded
  resources:
    requests:
      cpu: 50m
      memory: 880Mi
    limits:
      cpu: 1000m
      memory: 1320Mi
  prometheus:
    enabled: true # agent metrics :2112 — alloy-telemetry scrapes the tetragon service
# hubble-export-stdout sidecar: streams events to container stdout -> alloy -> Loki
export:
  # audited: near-idle at burn-in (single-digit data events/min cluster-wide)
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
tetragonOperator:
  prometheus:
    enabled: true # operator metrics :2113 — alloy-telemetry scrapes it
