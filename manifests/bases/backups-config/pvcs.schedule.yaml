apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: pvcs
  namespace: backups
spec:
  schedule: "0 3 * * *"
  template:
    includedNamespaces: ["*"]
    includedResources: []
    defaultVolumesToFsBackup: true
    resourcePolicy:
      kind: configmap
      name: volume-policy
    snapshotVolumes: false
    ttl: 72h
    storageLocation: default
