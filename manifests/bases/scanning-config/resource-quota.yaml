apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: scanning
spec:
  hard:
    # trivy-operator + trivy-server + up to 3 concurrent scan jobs (scanJobsConcurrentLimit)
    # — scan bursts peak ~768Mi each; headroom for one rollout overlap (cmdshift/platform#93)
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 6Gi
    pods: "12"
