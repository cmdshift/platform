# Recommendation mode only: updater + admission controller disabled — VPA never
# mutates pods or injects webhooks, so manifests stay authoritative and the
# recommendations are pure evidence (cmdshift/platform#62)
recommender:
  enabled: true
  extraArgs:
    v: "4"
    # chart defaults clamp recommendations UP to 15m CPU / 100Mi — lower the
    # floors so this cluster's small pods get honest numbers
    pod-recommendation-min-cpu-millicores: "2"
    pod-recommendation-min-memory-mb: "10"
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      # greenfield sizing — audit after the first days (resource-sizing skill)
      cpu: 200m
      memory: 192Mi
updater:
  enabled: false
admissionController:
  enabled: false
