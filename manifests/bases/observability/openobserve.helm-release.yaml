apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openobserve
  namespace: observability
spec:
  interval: 1h
  releaseName: openobserve
  chart:
    spec:
      # pinned: SQLite metadata migration chains break across minor bumps —
      # test on a fork of the PVC before bumping (cmdshift/platform#171)
      chart: openobserve-standalone
      version: 1.0.1
      sourceRef:
        kind: HelmRepository
        name: openobserve
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: openobserve-values
      valuesKey: values.yaml
