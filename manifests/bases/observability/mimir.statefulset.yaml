apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: observability
  labels:
    app.kubernetes.io/name: mimir
spec:
  replicas: 1
  serviceName: mimir-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mimir
          image: grafana/mimir:3.2.0
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/mimir/mimir.config.yaml
            - -config.expand-env=true
            # 3.2.0 quirk: this flag has NO yaml config equivalent — retention is
            # CLI-only (cmdshift/platform#128), and flat: Mimir has no downsampling
            # (grafana/mimir#1834)
            - -compactor.blocks-retention-period=168h
          envFrom:
            - secretRef:
                name: mimir-s3-credentials
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9095
            - name: memberlist
              containerPort: 7946
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            # lean start (sizing convention) — audit after seasoning; ingester WAL is the memory spike case
            requests:
              cpu: 150m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/mimir
            - name: rules
              mountPath: /etc/mimir/rules
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: rules
          configMap:
            name: mimir-rules
            items:
              - key: self-monitoring.mimir-rules.yaml
                path: self-monitoring/mimir-rules.yaml
              - key: self-monitoring.slo.rules.yaml
                path: self-monitoring/slo.rules.yaml
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
