prometheus:
  monitor:
    enabled: true
containerSecurityContext:
  # NSA hardening: explicit non-root uid/gid at container level (image declares USER "nobody")
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
resources:
  requests:
    cpu: 10m
    memory: 56Mi # 7d max 46Mi, VPA rec 61Mi — peak x 1.2, limit 1.5x; re-check after series growth
  limits:
    cpu: 200m
    memory: 84Mi
