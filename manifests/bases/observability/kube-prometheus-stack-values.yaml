alertmanager:
  enabled: false
defaultRules:
  disabled:
    # environmental on Talos-in-Docker: node_timex_sync_status=0 on every node (no sync flag from the docker VMs)
    NodeClockNotSynchronising: true
    InfoInhibitor: true # its only consumer (chart inhibit_rules) isn't loaded — cmdshift/platform#114
  # vendored components moved to standalone releases; kube-proxy gone (cilium KPR)
kubeProxy:
  enabled: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false
prometheusOperator:
  # JSON logging: see observability/loki-values.yaml
  logFormat: json
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
  resources:
    requests:
      cpu: 10m
      memory: 56Mi # 7d max 46Mi, VPA rec 61Mi — peak x 1.2, limit 1.5x
    limits:
      cpu: 500m
      memory: 84Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi # audit: 38Mi steady — P99 x 1.2
      limits:
        # 18% of CFS periods throttled (at 200m) — reload bursts; generous per convention
        cpu: 500m
        memory: 72Mi
prometheus:
  prometheusSpec:
    logFormat: json
    retention: 2d
    # CR-managed Alertmanager — without this the kubernetes-mixin rules never deliver (observability/README.md)
    alertingEndpoints:
      - namespace: observability
        name: alertmanager-operated
        port: 9093
        scheme: http
    # the falsy-empty-selector + `release:` gate story: observability/README.md
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    remoteWrite:
      - url: http://mimir.observability.svc:8080/api/v1/push
        headers:
          X-Scope-OrgID: self-monitoring
    externalLabels:
      cluster: local
    resources:
      # working set 1010-1175Mi, head series churn-driven (157k -> 187k over 2h,
      # watch for plateau) — request = P99 x 1.2, limit 1.5x; playbook: cmdshift/platform#20
      requests:
        cpu: 100m # audit: 56m steady — keeps the reservation honest
        memory: 1536Mi
      limits:
        cpu: 1000m
        memory: 2304Mi
grafana:
  enabled: false
