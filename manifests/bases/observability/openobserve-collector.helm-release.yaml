apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openobserve-collector
  namespace: observability
spec:
  interval: 1h
  releaseName: openobserve-collector
  dependsOn:
    - name: openobserve
    - name: kube-state-metrics
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.175.0
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: openobserve-collector-agent-values
      valuesKey: values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openobserve-collector-gateway
  namespace: observability
spec:
  interval: 1h
  releaseName: openobserve-collector-gateway
  dependsOn:
    - name: openobserve
    - name: kube-state-metrics
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.175.0
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: openobserve-collector-gateway-values
      valuesKey: values.yaml
