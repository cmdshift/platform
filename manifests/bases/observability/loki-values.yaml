monitoring:
  serviceMonitor:
    enabled: true # loki self-metrics — lives under `monitoring:` in this chart
test:
  enabled: false
lokiCanary:
  enabled: false
global:
  extraArgs:
    - "-config.expand-env=true"
    # JSON logging — set at the source, the pipeline passes lines through unchanged
    - "-log.format=json"
  extraEnvFrom:
    - secretRef:
        name: loki-s3-credentials
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
    rule_path: /tmp/loki/rules
    alertmanager_url: http://alertmanager-operated.observability.svc:9093
    enable_api: true
    enable_alertmanager_v2: true
    evaluation_interval: 1m
sidecar:
  rules:
    enabled: true
    folder: /etc/loki/rules
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 144Mi
gateway:
  config:
    server:
      http_listen_port: 80
    frontend:
      log_requests: false
    limits:
      allow_structured_metadata: true
    common:
      path_prefix: /
    org_id:
      default: self-monitoring
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 24Mi
  metrics:
    resources:
      # overnight: peak 22.3Mi — request = P99 x 1.2, limit = 1.5x request
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        cpu: 100m
        memory: 36Mi
loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: aws
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki-rules
    s3:
      endpoint: "main-s3.objects.svc:8333"
      s3ForcePathStyle: true
      insecure: true
      accessKeyId: "${LOKI_S3_ACCESS_KEY_ID}"
      secretAccessKey: "${LOKI_S3_SECRET_ACCESS_KEY}"
  limits_config:
    retention_period: 30d # bounded — logs are triage data
  compactor:
    retention_enabled: true
    delete_request_store: s3
    retention_delete_delay: 5m
    # true in the cloud: keep the default
    delete_request_cancel_period: 15m
  extraEnv:
    - name: LOKI_S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: loki-s3-credentials
          key: LOKI_S3_ACCESS_KEY_ID
    - name: LOKI_S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: loki-s3-credentials
          key: LOKI_S3_SECRET_ACCESS_KEY
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  resources:
    requests:
      cpu: 20m # VPA rec 23m — lean-request convention with headroom (cmdshift/platform#66)
      memory: 512Mi # steady 296Mi climbing to 404Mi post-WAL-replay — P99 x 1.2, limit 1.5x
    limits:
      cpu: 200m
      memory: 768Mi
chunksCache:
  resources:
    requests:
      cpu: 10m
      memory: 120Mi # 7d peak 95Mi (94% of old limit) — peak x 1.2, limit 1.5x (cmdshift/platform#66)
    limits:
      cpu: 20m
      memory: 180Mi
resultsCache:
  resources:
    requests:
      cpu: 10m
      memory: 8Mi
    limits:
      cpu: 20m
      memory: 12Mi
memcachedExporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 100m
      memory: 36Mi
