apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: kube-system
spec:
  interval: 12h
  releaseName: vpa
  chart:
    spec:
      chart: vpa
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: vpa-values
      valuesKey: values.yaml
