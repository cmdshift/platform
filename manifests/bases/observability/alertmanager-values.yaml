# values for the alertmanager chart (replaces the kps-operator-managed
# Alertmanager CR — cmdshift/platform#141)
fullnameOverride: alertmanager

automountServiceAccountToken: false

image:
  repository: quay.io/prometheus/alertmanager
  # chart default (appVersion) — pinned explicitly per convention
  tag: v0.34.1

# JSON logging: platform convention (was loki-values.yaml, pre-OpenObserve)
extraArgs:
  log.format: json

service:
  # openobserve alert webhooks + the flux provider address this name:port
  # (chart service is <fullnameOverride>)
  type: ClusterIP
  port: 9093

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    # audit: 15.2% of CFS periods throttled (at 200m) — group-notification
    # bursts; generous CPU limit per convention
    cpu: 500m
    memory: 72Mi

persistence:
  enabled: true
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClass: local-path

config:
  enabled: true
  # link annotations (dashboard_url/explore_logs_url, cmdshift/platform#155):
  # the default template prints only summary — this one adds a Links block
  templates:
    - '/etc/alertmanager/email.tmpl'
  # camelCase keys are the AlertmanagerConfig-CR spelling — the raw am config
  # uses snake_case; the chart renders this verbatim into alertmanager.yml
  route:
    receiver: email
    group_by: [alertname, severity]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # SLO burn-rate alerts (slo.rules.yaml): tighter grouping than the root
      # route so a burning budget pages fast; matched on the `slo` label, not
      # severity (cmdshift/platform#85)
      - matchers:
          - slo="true"
        receiver: email
        group_by: [alertname]
        group_wait: 30s
        group_interval: 1m
        repeat_interval: 1h
  receivers:
    - name: email
      email_configs:
        - to: you@cloud.test
          smarthost: smtp.cloud.test:25
          from: alertmanager@cloud.test
          require_tls: false
          send_resolved: true
          # raw am config passes straight through the chart (configmap.yaml
          # `toYaml`) — html/text override the built-in email templates to
          # render the link annotations (email.tmpl below, cmdshift/platform#155)
          html: '{{ template "email.default.html" . }}'
          text: '{{ template "email.default.text" . }}'

testFramework:
  enabled: false

# custom email template (rendered into the alertmanager ConfigMap, mounted at
# /etc/alertmanager): the built-in default only prints the summary annotation,
# so the dashboard_url/explore_logs_url links (openobserve alert webhooks carry
# them, cmdshift/platform#155/#171) never reach the inbox —
# email.default.text/html are overridden to include them.
# Validated with `amtool check-config` (v0.34.1 image) before landing
templates:
  email.tmpl: |-
    {{ define "email.default.text" }}{{ template "__subject" . }}

    {{ range .Alerts }}
    Labels:
    {{ range .Labels.SortedPairs }} - {{ .Name }} = {{ .Value }}
    {{ end }}Annotations:
    {{ range .Annotations.SortedPairs }} - {{ .Name }} = {{ .Value }}
    {{ end }}{{ with .Annotations.dashboard_url }}Dashboard: {{ . }}
    {{ end }}{{ with .Annotations.explore_logs_url }}Logs: {{ . }}
    {{ end }}Source: {{ .GeneratorURL }}
    {{ end }}
    Sent by Alertmanager ( {{ template "__alertmanagerURL" . }} )
    {{ end }}

    {{ define "email.default.html" }}<!DOCTYPE html>
    <html>
      <body>
        {{ template "__subject" . }}
        <ul>
          {{ range .Alerts }}
          <li>
            <strong>{{ .Annotations.summary }}</strong>
            {{ range .Labels.SortedPairs }}<br/>{{ .Name }} = {{ .Value }}{{ end }}
            {{ with .Annotations.dashboard_url }}<br/><a href="{{ . }}">Dashboard</a>{{ end }}
            {{ with .Annotations.explore_logs_url }} | <a href="{{ . }}">Logs</a>{{ end }}
          </li>
          {{ end }}
        </ul>
      </body>
    </html>
    {{ end }}
