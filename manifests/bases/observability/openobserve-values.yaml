# values for the openobserve-standalone chart (cmdshift/platform#171 —
# replaces the LGTM stack: mimir/loki/tempo/grafana + seaweedfs)
fullnameOverride: openobserve

image:
  oss:
    # o2cr.ai is a 302 façade to public.ecr.aws/zinclabs/openobserve — angos
    # doesn't follow cross-registry redirects on cache-miss, so point at the
    # real home (already-mapped ecr upstream) (cmdshift/platform#171)
    repository: public.ecr.aws/zinclabs/openobserve
    # pinned per convention; SQLite migration trap — see the HelmRelease
    tag: v1.0.1

podAnnotations:
  # skip the data PVC in FSB: it holds disposable SQLite metadata + WAL/parquet
  # staging (config is GitOps-recovered via o2-sync, data lives in rustfs) —
  # backing it up live fails ~90% through with an empty data-path error and
  # burns ~7GB of kopia churn per backup (cmdshift/platform#171)
  backup.velero.io/backup-volumes-excludes: data

podSecurityContext:
  fsGroup: 2000
  runAsUser: 10000
  runAsGroup: 3000
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# writable cache dir for readOnlyRootFilesystem (chart NOTE: point
# ZO_DATA_CACHE_DIR at the same path)
cache:
  enabled: true
  mountPath: /var/lib/openobserve-cache
  sizeLimit: 2Gi

# SQLite + WAL only — parquet data lives in rustfs S3
persistence:
  enabled: true
  size: 5Gi
  storageClass: local-path
  accessModes:
    - ReadWriteOnce

# chart renders ZO_ROOT_USER_* + ZO_S3_* into its Secret from these values —
# empty here; the real values come from the secrets server via env overrides
# (explicit env beats envFrom; ExternalSecrets below provide them)
auth:
  existingRootUserSecret:
    name: openobserve-credentials
    emailKey: ZO_ROOT_USER_EMAIL
    passwordKey: ZO_ROOT_USER_PASSWORD
  ZO_S3_ACCESS_KEY: ""
  ZO_S3_SECRET_KEY: ""

extraEnv:
  # no ZO_SMTP_* key exists in the chart's config-CM allowlist, so SMTP rides
  # extraEnv (cmdshift/platform#182); empty ZO_SMTP_ENCRYPTION is the documented
  # plain-SMTP mode
  - name: ZO_SMTP_ENABLED
    value: "true"
  - name: ZO_SMTP_HOST
    value: "smtp.cloud.test"
  - name: ZO_SMTP_PORT
    value: "25"
  - name: ZO_SMTP_FROM_EMAIL
    value: "alerts@cloud.test"
  - name: ZO_SMTP_ENCRYPTION
    value: ""
  - name: ZO_S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: openobserve-s3-credentials
        key: ZO_S3_ACCESS_KEY
  - name: ZO_S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: openobserve-s3-credentials
        key: ZO_S3_SECRET_KEY

config:
  ZO_LOCAL_MODE: "true"
  ZO_DATA_CACHE_DIR: "/var/lib/openobserve-cache"
  ZO_LOCAL_MODE_STORAGE: "s3"
  ZO_S3_PROVIDER: "s3"
  ZO_S3_SERVER_URL: "http://s3.cloud.test"
  ZO_S3_REGION_NAME: "local"
  ZO_S3_BUCKET_NAME: "openobserve"
  ZO_TELEMETRY: "false"
  ZO_MMDB_DISABLE_DOWNLOAD: "true"
  ZO_MEM_TABLE_MAX_SIZE: "1024"
  ZO_MAX_FILE_RETENTION_TIME: "600"
  ZO_MAX_FILE_SIZE_IN_MEMORY: "256"
  ZO_MAX_FILE_SIZE_ON_DISK: "256"
  ZO_MEM_DUMP_THREAD_NUM: "2"
  ZO_FILE_MOVE_THREAD_NUM: "2"
  ZO_FILE_MERGE_THREAD_NUM: "2"
  ZO_FILE_PUSH_INTERVAL: "300"
  ZO_COMPACT_ENABLED: "true"
  ZO_COMPACT_DATA_RETENTION_DAYS: "3"
  ZO_COMPACT_INTERVAL: "120"
  ZO_COMPACT_MAX_FILE_SIZE: "1024"
  ZO_MEMORY_CACHE_MAX_SIZE: "1536"
  ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE: "1536"
  # relief valve for the 1536/1536 query caches — 1Gi of the 5Gi PVC,
  # leaving the rest for SQLite + WAL (cmdshift/platform#182)
  ZO_DISK_CACHE_ENABLED: "true"
  ZO_DISK_CACHE_MAX_SIZE: "1024"
  ZO_LOGS_FILE_RETENTION: "daily"
  ZO_TRACES_FILE_RETENTION: "daily"

resources:
  # lean request: the quota charges requests (2/3 of the 3-cpu budget at the
  # old 2-core request) and O2 reads host cores anyway — the 4-core limit is
  # the burst cap (cmdshift/platform#182)
  requests:
    cpu: 500m
    memory: 5Gi
  limits:
    cpu: "4"
    memory: 7Gi

service:
  type: ClusterIP
  http_port: 5080
  grpc_port: 5081

serviceMonitor:
  enabled: false
