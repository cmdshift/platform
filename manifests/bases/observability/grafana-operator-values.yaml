podSecurityContext:
  # NSA hardening: pod-level non-root (container-level comes from the chart defaults)
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
# NSA hardening: explicit non-root uid/gid at container level (image is 65532; chart leaves gid implicit 0)
securityContext:
  runAsUser: 65532
  runAsGroup: 65532
# JSON logging: see logging/loki-values.yaml (chart renders --zap-encoder)
logging:
  encoder: json
resources:
  requests:
    cpu: 10m
    memory: 48Mi # 7d max 37Mi, VPA rec 47Mi — peak x 1.2, limit 1.5x
  limits:
    cpu: 200m
    memory: 72Mi
