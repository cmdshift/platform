crds:
  # PodLogs CRD was installed by the k8s-monitoring release we replaced — keep
  # it owned here so it isn't orphaned when that release was removed
  # (cmdshift/platform#149)
  deployPodLogsCRD: true

resources:
  requests:
    # 12h P99 81m CPU / 101Mi mem — the old 10m/64Mi left the operator the
    # cluster's most-throttled container (23-29% of CFS periods)
    cpu: 50m
    memory: 140Mi
  limits:
    cpu: 500m
    memory: 210Mi

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
