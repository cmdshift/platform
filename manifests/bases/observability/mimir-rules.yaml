groups:
  - name: pod-alerts
    rules:
      - alert: PodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total[5m]) > 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping ({{ $value }} restarts in 15m)"
  - name: kubernetes-mixin
    # the essential kubernetes-mixin rules (kps defaultRules evaluated them in
    # the Prometheus CR — they moved here when kps was removed, cmdshift/platform#141)
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alerting-pipeline heartbeat — always firing; its absence means the rule path or delivery is broken"
      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} has been NotReady for 15m"
      - alert: KubeDeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas{namespace!~"kube-system"} > kube_deployment_status_replicas_available{namespace!~"kube-system"}
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has not matched its expected number of replicas for 15m"
      - alert: KubeJobFailed
        # ksm v2: kube_job_status_stage does not exist (cmdshift/platform#141)
        expr: kube_job_status_failed > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to complete"
  - name: memory-alerts
    rules:
      - alert: ContainerOOMKilled
        expr: |
          increase(kube_pod_container_status_restarts_total[10m]) > 0
            and on(namespace, pod, container)
          kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOM-killed — limit too low or a leak"
  - name: node-alerts
    rules:
      - alert: NodeHighDiskUsage
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs"} / node_filesystem_size_bytes{fstype!~"tmpfs"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage above 85% on {{ $labels.instance }}"
  - name: backup-alerts
    rules:
      - alert: VeleroBackupStale
        # the gauge only exists once a Completed pvcs backup exists — while the
        # series is absent, exactly when the alert matters most, bare
        # time() - gauge matches nothing; the absent() arm covers that state
        expr: |
          time() - velero_backup_last_successful_timestamp{schedule="pvcs"} > 93600
            or absent(velero_backup_last_successful_timestamp{schedule="pvcs"})
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No successful velero backup in 26h or never succeeded (schedule pvcs) — nightly 03:00 run missed or failing"
      - alert: VeleroBackupFailed
        # PartiallyFailed lands in backup_partial_failure_total, not
        # backup_failure_total — both arms required (cmdshift/platform#111)
        expr: |
          increase(velero_backup_failure_total[24h]) > 0
            or increase(velero_backup_partial_failure_total[24h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "A velero backup failed or partially failed in the last 24h (schedule {{ $labels.schedule }})"
      - alert: VeleroRepoMaintenanceFailed
        expr: |
          increase(velero_repo_maintenance_failure_total[2h]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Kopia repo maintenance failed in the last 2h (repo {{ $labels.repository_name }}) — check BackupRepository recentMaintenance"
  - name: tetragon-alerts
    rules:
      - alert: TetragonTracingPolicyLoadFailed
        expr: |
          tetragon_tracingpolicy_loaded{state=~"error|load_error"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tetragon on {{ $labels.pod }} ({{ $labels.node }}) has a tracing policy in {{ $labels.state }} — a policy file may be invalid or use a hook this kernel lacks"
      - alert: TetragonEnforcementKill
        expr: |
          increase(tetragon_policy_events_total{policy=~"kernel-modules|exec-deny-list-.*"}[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tetragon enforcement fired (policy {{ $labels.policy }}) — check `tetra getevents -o json` and per-node `tetra tracingpolicy list` NENFORCE for the policy and binary"
        # tetragon_kill_events_total does not exist (cmdshift/platform#57) —
        # policy_events_total materializes on first enforcement; for: 5m absorbs
        # rebuild one-shot spikes (cmdshift/platform#60) — full story: security/README.md
  - name: trivy-alerts
    rules:
      - alert: TrivyCriticalImageVulnerabilities
        expr: |
          sum by (namespace) (max_over_time(trivy_image_vulnerabilities{severity="Critical", namespace=~"kube-system|flux-system|certificates|secrets|policies|storage|objects|observability|backups|security"}[30m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "trivy reports {{ $value }} CRITICAL image vulnerabilities in {{ $labels.namespace }} — kubectl get vulnerabilityreports -A | grep {{ $labels.namespace }}"
        # max_over_time(30m) holds the alert through rescan-gap flaps; informational,
        # Critical-only by design (cmdshift/platform#36)
