apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - openobserve.helm-release.yaml
  - openobserve-collector.helm-release.yaml
  - kube-state-metrics.helm-release.yaml
  - metrics-server.helm-release.yaml
  - vpa.helm-release.yaml
  - openobserve.vpa.yaml
  - openobserve-credentials.external-secret.yaml
  - openobserve-s3-credentials.external-secret.yaml
configMapGenerator:
  - name: openobserve-values
    namespace: observability
    files:
      - values.yaml=openobserve-values.yaml
    options:
      disableNameSuffixHash: true
  - name: openobserve-collector-agent-values
    namespace: observability
    files:
      - values.yaml=openobserve-collector-agent-values.yaml
    options:
      disableNameSuffixHash: true
  - name: openobserve-collector-gateway-values
    namespace: observability
    files:
      - values.yaml=openobserve-collector-gateway-values.yaml
    options:
      disableNameSuffixHash: true
  - name: kube-state-metrics-values
    namespace: observability
    files:
      - values.yaml=kube-state-metrics-values.yaml
    options:
      disableNameSuffixHash: true
  # metrics-server/vpa install into kube-system (cluster plumbing);
  # their HelmReleases live in the observability group by domain
  - name: metrics-server-values
    namespace: kube-system
    files:
      - values.yaml=metrics-server-values.yaml
    options:
      disableNameSuffixHash: true
  - name: vpa-values
    namespace: kube-system
    files:
      - values.yaml=vpa-values.yaml
    options:
      disableNameSuffixHash: true
