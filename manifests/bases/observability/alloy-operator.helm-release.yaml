apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-operator
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy-operator
      version: 0.7.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: alloy-operator-values
      valuesKey: values.yaml
