alloy:
  mounts:
    varlog: true
    containerd: true
    extra:
      # writable /tmp: --storage.path=/tmp/alloy (WAL + positions) below
      - name: tmp
        mountPath: /tmp
      # kube-apiserver audit logs (cmdshift/platform#90) — the audit dir is 0700
      # 65534:nogroup with 0600 files; the DAC_READ_SEARCH capability below is
      # what makes the read possible. Mount is read-only.
      - name: audit
        mountPath: /var/log/audit
        readOnly: true
  # without this block the chart SILENTLY installs its example config — pods run
  # healthy, push nothing, Loki ingests nothing (cmdshift/platform#27)
  configMap:
    create: false
    name: alloy-logging-config
    key: config.alloy
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      # read-only access to the 0700 root-owned audit log dir (cmdshift/platform#90)
      add:
        - DAC_READ_SEARCH
    seccompProfile:
      type: RuntimeDefault
    # NSA hardening: immutable root fs; WAL/positions live in the /tmp emptyDir.
    # Alloy still runs as root (image declares no USER) — PolicyException covers it
    readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 10m
      memory: 224Mi # 7d max 189Mi — max x 1.2, limit 1.5x (cmdshift/platform#66)
    limits:
      cpu: 200m
      memory: 336Mi
configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi
controller:
  volumes:
    extra:
      - name: tmp
        emptyDir: {}
      # kube-apiserver audit logs on every node (written on ctrl) (cmdshift/platform#90)
      - name: audit
        hostPath:
          path: /var/log/audit
          type: DirectoryOrCreate
  # audit logs live on the ctrl node — its taint must be tolerated or the scrape never runs there
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
