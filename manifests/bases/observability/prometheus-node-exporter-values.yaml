podLabels:
  # kubernetes-mixin node rules select job="node-exporter" — the job label is
  # hard-set by alloy-telemetry's scrape `job_name` (cmdshift/platform#149)
  jobLabel: node-exporter
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 1000m # 46% CFS-throttle spikes at 500m on system-metrics scrapes — bursty, not steady
    memory: 48Mi
