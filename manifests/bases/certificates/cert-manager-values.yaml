crds:
  enabled: true
  keep: true
config:
  enableGatewayAPI: true
# NSA hardening: explicit non-root uid/gid at container level
# (image runs as 65532; the chart leaves gid implicit 0)
containerSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
resources:
  requests:
    cpu: 10m
    # 7d max 34Mi, VPA rec 47Mi — peak x 1.2, limit 1.5x
    memory: 40Mi
  limits:
    cpu: 200m
    memory: 60Mi
cainjector:
  containerSecurityContext:
    runAsUser: 65532
    runAsGroup: 65532
  resources:
    requests:
      cpu: 10m
      memory: 144Mi
    limits:
      cpu: 200m
      memory: 216Mi
webhook:
  containerSecurityContext:
    runAsUser: 65532
    runAsGroup: 65532
  resources:
    requests:
      cpu: 10m
      # 7d max 30Mi, VPA rec 35Mi — peak x 1.2, limit 1.5x
      memory: 40Mi
    limits:
      cpu: 200m
      memory: 60Mi
startupapicheck:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
