apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: policies
  namespace: policies
spec:
  endpointSelector: {}
  egress:
    - toEntities:
      - kube-apiserver
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: policies
