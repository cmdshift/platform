apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backups
  namespace: backups
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
    - toFQDNs:
        - matchName: ${S3_FQDN}
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - toEntities:
        - host
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
