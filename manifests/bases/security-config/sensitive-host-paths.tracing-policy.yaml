# File-integrity enforcement: opens of the node's crown-jewel host paths by containerized
# processes (stage-2 flip, cmdshift/platform#60 phase 5). 7-day monitor burn-in was EMPTY —
# both paths are touched only by host-ns processes (etcd static pod, kubelet/containerd),
# so the pod-ns filter arms a policy that cannot fire from any flux-managed workload;
# enforcement is defense-in-depth. Override(EACCES) — Sigkill would kill interpreters
# mid-open; the stream evidence and carve-out analysis: security/README.md. Plain
# kprobe (BTF lacks lsmhooks symbols), podSelector-only scoping
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sensitive-host-paths
spec:
  # k8s pod processes only (see privileges-raise for the live finding)
  podSelector:
    matchLabels: {}
  # list-of-{name,value}; "enforce"/"monitor" only — the display strings fail agent-side
  options:
    - name: policy-mode
      value: enforce
  kprobes:
    - call: security_file_open
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /var/lib/etcd
          matchActions:
            - action: Override
              argError: -13 # EACCES — open fails before any read lands
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchArgs:
            - index: 0
              operator: Equal
              values:
                - /run/containerd/containerd.sock
          matchActions:
            - action: Override
              argError: -13 # EACCES — CRI socket reach is kubelet/host-only
