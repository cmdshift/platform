apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sensitive-host-paths
spec:
  podSelector:
    matchLabels: {}
  options:
    - name: policy-mode
      value: enforce
  kprobes:
    - call: security_file_open
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /var/lib/etcd
          matchActions:
            - action: Override
              argError: -13 # EACCES — open fails before any read lands
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchArgs:
            - index: 0
              operator: Equal
              values:
                - /run/containerd/containerd.sock
          matchActions:
            - action: Override
              argError: -13 # EACCES — CRI socket reach is kubelet/host-only
