# File-integrity baseline: opens of the node's crown-jewel host paths by containerized
# processes; monitor_only — stage-2 Override candidates decided from this stream. Plain
# kprobe (BTF lacks lsmhooks symbols), podSelector-only scoping — security/README.md
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sensitive-host-paths
spec:
  # k8s pod processes only (see privileges-raise for the live finding)
  podSelector:
    matchLabels: {}
  kprobes:
    - call: security_file_open
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /var/lib/etcd
          matchActions:
            - action: Post
              rateLimit: "1m"
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchArgs:
            - index: 0
              operator: Equal
              values:
                - /run/containerd/containerd.sock
          matchActions:
            - action: Post
              rateLimit: "1m"
