# Exec deny-list, backups namespace, velero pods (velero controller + node-agent
# DaemonSet) — phase-4 wave 1 (cmdshift/platform#60), sibling of
# exec-deny-list-flux-system (cmdshift/platform#28; full rationale there).
# Scoping label: the release instance label. k8s LabelSelectors AND their terms —
# a pod can't match "velero OR kopia-job OR talos-backup" in one selector, so the
# pod groups are split into sibling policies sharing this name prefix.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: exec-deny-list-backups
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: velero
  options:
    - name: policy-mode
      value: enforce
  kprobes:
    - call: security_bprm_check
      syscall: false
      args:
        - index: 0
          type: linux_binprm
      message: "exec of denied binary in operator namespace"
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /bin/sh
                - /bin/bash
                - /bin/dash
                - /bin/ash
                - /bin/zsh
                - /usr/bin/sh
                - /usr/bin/bash
                - /usr/bin/dash
                - /usr/bin/zsh
                - /usr/bin/python
                - /usr/bin/perl
                - /usr/bin/ruby
                - /usr/bin/node
                - /usr/bin/env
                - /usr/bin/nc
                - /bin/nc
                - /usr/bin/socat
                - /bin/socat
                - /usr/bin/wget
                - /bin/wget
                - /usr/bin/curl
                - /bin/curl
          matchActions:
            - action: Sigkill
