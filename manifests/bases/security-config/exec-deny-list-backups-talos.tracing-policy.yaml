# Exec deny-list, backups namespace, talos-backup cronjob — phase-4 wave 1
# (cmdshift/platform#60), sibling of exec-deny-list-backups. Standalone label set;
# a separate policy because k8s LabelSelectors AND their terms.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: exec-deny-list-backups-talos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: talos-backup
  options:
    - name: policy-mode
      value: enforce
  kprobes:
    - call: security_bprm_check
      syscall: false
      args:
        - index: 0
          type: linux_binprm
      message: "exec of denied binary in operator namespace"
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /bin/sh
                - /bin/bash
                - /bin/dash
                - /bin/ash
                - /bin/zsh
                - /usr/bin/sh
                - /usr/bin/bash
                - /usr/bin/dash
                - /usr/bin/zsh
                - /usr/bin/python
                - /usr/bin/perl
                - /usr/bin/ruby
                - /usr/bin/node
                - /usr/bin/env
                - /usr/bin/nc
                - /bin/nc
                - /usr/bin/socat
                - /bin/socat
                - /usr/bin/wget
                - /bin/wget
                - /usr/bin/curl
                - /bin/curl
          matchActions:
            - action: Sigkill
