apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: security
spec:
  hard:
    # tetragon (x4 daemons) dominates: the 8-CPU limits sum is daemon bursts, so the
    # limits quota sits at 12 to keep one rollout overlap from blocking (cmdshift/platform#93)
    requests.cpu: 1
    requests.memory: 11Gi
    limits.cpu: 12
    limits.memory: 14Gi
    pods: "20"
