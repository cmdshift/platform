# Exec deny-list, storage namespace (local-path-provisioner) — phase-4 wave 1
# (cmdshift/platform#60), sibling of exec-deny-list-flux-system
# (cmdshift/platform#28; full rationale there).
# Scoping label: the chart's release instance label. The on-demand helper pods
# (setup/teardown) exec /bin/sh /script/setup legitimately and carry this same
# instance label (inherited from the helperPod template) — the tetragon selector
# cannot scope them out by label, so the kyverno backstop's
# allow-local-path-helper-pod exception covers the admission layer and the
# helper's shell exec is accepted collateral here (documented in
# storage/README.md). Unscoped execs (debug shells into the provisioner) are
# still killed.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: exec-deny-list-storage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: local-path-provisioner
  options:
    - name: policy-mode
      value: enforce
  kprobes:
    - call: security_bprm_check
      syscall: false
      args:
        - index: 0
          type: linux_binprm
      message: "exec of denied binary in operator namespace"
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /bin/sh
                - /bin/bash
                - /bin/dash
                - /bin/ash
                - /bin/zsh
                - /usr/bin/sh
                - /usr/bin/bash
                - /usr/bin/dash
                - /usr/bin/zsh
                - /usr/bin/python
                - /usr/bin/perl
                - /usr/bin/ruby
                - /usr/bin/node
                - /usr/bin/env
                - /usr/bin/nc
                - /bin/nc
                - /usr/bin/socat
                - /bin/socat
                - /usr/bin/wget
                - /bin/wget
                - /usr/bin/curl
                - /bin/curl
          matchActions:
            - action: Sigkill
