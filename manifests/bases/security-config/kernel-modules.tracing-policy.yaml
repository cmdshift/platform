apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: kernel-modules
spec:
  podSelector:
    matchLabels: {}
  options:
    - name: policy-mode
      value: enforce
  kprobes:
    - call: security_kernel_module_request
      message: "kernel module auto-load requested"
      syscall: false
      return: true
      args:
        - index: 0
          type: string
      returnArg:
        index: 0
        type: int
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Override
              argError: -13 # EACCES — request aborts before modprobe runs
    - call: security_kernel_read_file
      message: "kernel module file read"
      syscall: false
      return: true
      args:
        - index: 0
          type: file
        - index: 1
          type: int
      returnArg:
        index: 0
        type: int
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchArgs:
            - index: 1
              operator: Equal
              values:
                - "2" # READING_MODULE
          matchActions:
            - action: Sigkill
    - call: do_init_module
      message: "kernel module initialized"
      syscall: false
      args:
        - index: 0
          type: module
      selectors:
        - matchNamespaces:
            - namespace: Pid
              operator: NotIn
              values:
                - host_ns
          matchActions:
            - action: Sigkill
