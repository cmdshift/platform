apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: exec-deny-list-datastores
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - cloudnative-pg
          - valkey-operator
          # no strimzi-kafka-operator: its entrypoint execs env→bash→script
          # (no values knob for the chain) — deny-list enforcement would kill
          # every operator startup; cmdshift/platform#166
  options:
    - name: policy-mode
      value: enforce
  kprobes:
    - call: security_bprm_check
      syscall: false
      args:
        - index: 0
          type: linux_binprm
      message: "exec of denied binary in operator namespace"
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /bin/sh
                - /bin/bash
                - /bin/dash
                - /bin/ash
                - /bin/zsh
                - /usr/bin/sh
                - /usr/bin/bash
                - /usr/bin/dash
                - /usr/bin/zsh
                - /usr/bin/python
                - /usr/bin/perl
                - /usr/bin/ruby
                - /usr/bin/node
                - /usr/bin/env
                - /usr/bin/nc
                - /bin/nc
                - /usr/bin/socat
                - /bin/socat
                - /usr/bin/wget
                - /bin/wget
                - /usr/bin/curl
                - /bin/curl
          matchActions:
            - action: Sigkill
