installCRDs: true
replicaCount: 1
# NSA hardening: pod-level non-root (chart sets container level only)
podSecurityContext:
  runAsNonRoot: true
# NSA hardening: explicit non-root gid at container level (chart sets runAsUser 1000 but left gid implicit 0)
securityContext:
  runAsGroup: 1000
resources:
  requests:
    cpu: 10m
    # 7d max 41Mi, VPA rec 47Mi — peak x 1.2, limit 1.5x
    memory: 56Mi
  limits:
    cpu: 200m
    memory: 84Mi
certController:
  securityContext:
    runAsGroup: 1000 # NSA hardening: explicit non-root gid
  resources:
    requests:
      cpu: 10m
      # 7d max 72Mi, VPA rec 89Mi — peak x 1.2, limit 1.5x
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 144Mi
webhook:
  securityContext:
    runAsGroup: 1000 # NSA hardening: explicit non-root gid
  resources:
    requests:
      cpu: 10m
      # 7d max 31Mi, VPA rec 47Mi — peak x 1.2, limit 1.5x
      memory: 40Mi
    limits:
      cpu: 200m
      memory: 60Mi
