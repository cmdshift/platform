features:
  policyExceptions:
    enabled: true
    namespace: policies
global:
  image:
    registry: ghcr.io
  logging:
    format: json
  admissionReports:
    enabled: false
  deferredLoading:
    enabled: false
  backgroundScan:
    enabled: true
    backgroundScanWorkers: 1
    backgroundScanInterval: 1h
  reporting:
    validate: false
config:
  resourceFiltersInclude:
    - "[*/*,policies,*]"
  webhooks:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - flux-system
            - policies
admissionController:
  replicas: 1
  # hostNetwork: true # remove in the cloud
  container:
    resources:
      requests:
        cpu: 15m
        memory: 208Mi
      limits:
        cpu: 500m
        memory: 300Mi
  podSecurityContext:
    runAsNonRoot: true
backgroundController:
  replicas: 1
  # hostNetwork: true # remove in the cloud
  resources:
    requests:
      cpu: 10m
      memory: 144Mi
    limits:
      cpu: 500m
      memory: 216Mi
  podSecurityContext:
    runAsNonRoot: true
cleanupController:
  replicas: 1
  # hostNetwork: true # remove in the cloud
  resources:
    requests:
      cpu: 10m
      memory: 104Mi
    limits:
      cpu: 500m
      memory: 156Mi
  podSecurityContext:
    runAsNonRoot: true
reportsController:
  replicas: 1
  # hostNetwork: true # remove in the cloud
  resources:
    requests:
      cpu: 20m
      memory: 160Mi
    limits:
      cpu: 2000m
      memory: 240Mi
  podSecurityContext:
    runAsNonRoot: true
