apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: access
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: secrets-config
    - name: networking-config
    - name: policies
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/clusters/local/access
  prune: true
  wait: true
  timeout: 3m
