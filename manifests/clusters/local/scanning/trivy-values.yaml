operator:
  builtInTrivyServer: true
  infraAssessmentScannerEnabled: false
  scanJobsConcurrentLimit: 3
  scanJobTTL: 10m
  builtInServerRegistryInsecure: true
trivy:
  ignoreUnfixed: false
  image:
    registry: docker.io
    # chart 0.38.1 defaults 0.76.1, built before the Alpine 3.24.3 brotli fix (0.76.2) —
    # remove when the next chart defaults trivy >= 0.76.2
    tag: "0.76.2"
  dbRegistry: registry.cloud.test
  dbRepository: docker/aquasec/trivy-db
  javaDbRegistry: registry.cloud.test
  javaDbRepository: docker/aquasec/trivy-java-db
  dbRepositoryInsecure: "true"
  registry:
    mirror:
      "docker.io": registry.cloud.test/docker
      "index.docker.io": registry.cloud.test/docker
      "ghcr.io": registry.cloud.test/ghcr
      "registry.k8s.io": registry.cloud.test/k8s
      "quay.io": registry.cloud.test/quay
      "gcr.io": registry.cloud.test/gcr
      "mcr.microsoft.com": registry.cloud.test/mcr
      "public.ecr.aws": registry.cloud.test/ecr
  insecureRegistries:
    cache: registry.cloud.test
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 768Mi
  server:
    storageClassEnabled: true
    storageSize: 5Gi
    resources:
      # request: 7d P99 39Mi × 1.2 / VPA target 61Mi (RSS trend); limit 1.5×
      requests:
        cpu: 15m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 96Mi
    podSecurityContext:
      runAsUser: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
trivyOperator:
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  scanJobPodTemplateContainerSecurityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
compliance:
  specs: []
image:
  registry: docker.io
resources:
  # request: 7d P99 283Mi × 1.2 / VPA target 454Mi (RSS trend); limit 1.5×
  requests:
    cpu: 25m
    memory: 448Mi
  limits:
    cpu: 1000m
    memory: 672Mi
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL
