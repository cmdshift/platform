apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../bases/datastores
configMapGenerator:
  - name: cloudnative-pg-values
    namespace: datastores
    files:
      - values.yaml=cloudnative-pg-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
  - name: valkey-operator-values
    namespace: datastores
    files:
      - values.yaml=valkey-operator-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
  - name: strimzi-kafka-operator-values
    namespace: datastores
    files:
      - values.yaml=strimzi-kafka-operator-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
  - name: opensearch-operator-values
    namespace: datastores
    files:
      - values.yaml=opensearch-operator-values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
