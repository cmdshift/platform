apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../bases/datastores
configMapGenerator:
  - name: cloudnative-pg-values
    namespace: datastores
    files:
      - values.yaml=cloudnative-pg-values.yaml
    options:
      disableNameSuffixHash: true
  - name: valkey-operator-values
    namespace: datastores
    files:
      - values.yaml=valkey-operator-values.yaml
    options:
      disableNameSuffixHash: true
  - name: emqx-operator-values
    namespace: datastores
    files:
      - values.yaml=emqx-operator-values.yaml
    options:
      disableNameSuffixHash: true
