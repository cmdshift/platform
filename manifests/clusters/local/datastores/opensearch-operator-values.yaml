# CRDs render into the release secret — bump gate: `helm template | wc -c` must stay <1MB (datastores README)
legacyAPI:
  enabled: false
manager:
  image:
    tag: "3.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 15m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 192Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
