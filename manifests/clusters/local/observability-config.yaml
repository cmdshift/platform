apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: observability
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/clusters/local/observability-config
  prune: true
  wait: true
  timeout: 3m
  healthCheckExprs:
    - apiVersion: monitoring.coreos.com/v1
      kind: Alertmanager
      current: status.conditions.filter(e, e.type == 'Available').all(e, e.status == 'True')
