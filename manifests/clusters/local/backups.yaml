apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backups
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: networking
    - name: storage-config
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/clusters/local/backups
  postBuild:
    substitute:
      S3_ENDPOINT: http://s3.cloud.test
      AWS_REGION: local
      CLUSTER_NAME: local-test
  prune: true
  wait: true
  timeout: 3m
