hostNetwork: true
extraHostPathMounts:
  - name: sys-kernel-tracing
    mountPath: /sys/kernel/tracing
tetragon:
  extraArgs:
    disable-kprobe-multi: "true" # kernel 7.2 kprobe_multi attach failure (security/README.md)
  enableProcessCred: true
  clusterName: local-test
  grpc:
    address: "localhost:54321"
  resources:
    # request: 7d P99 414Mi × 1.2 / VPA target 561Mi / 7d max 509Mi (RSS trend); limit 1.5×
    requests:
      cpu: 25m
      memory: 576Mi
    limits:
      cpu: 1000m
      memory: 864Mi
  prometheus:
    enabled: true # agent metrics :2112 — the metrics collector scrapes the tetragon service
export:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
tetragonOperator:
  prometheus:
    enabled: true # operator metrics :2113 — the metrics collector scrapes it
  resources:
    # VPA target 22Mi; limit 1.5×
    requests:
      cpu: 10m
      memory: 22Mi
    limits:
      cpu: 500m
      memory: 33Mi
