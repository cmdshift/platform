apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: datastores
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: crds
    - name: networking
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/clusters/local/datastores
  prune: true
  wait: true
  timeout: 3m
