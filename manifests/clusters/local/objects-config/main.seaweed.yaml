apiVersion: seaweed.seaweedfs.com/v1
kind: Seaweed
metadata:
  name: main
  namespace: objects
spec:
  image: index.docker.io/chrislusf/seaweedfs:4.44
  volumeServerDiskCount: 1
  master:
    replicas: 1
    volumeSizeLimitMB: 1024
    requests:
      cpu: 10m
      memory: 108Mi
    limits:
      cpu: 100m
      memory: 160Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
  volume:
    replicas: 1
    storageClassName: local-path
    requests:
      storage: 10Gi
      cpu: 10m
      # OOMKilled twice (132Mi, then 240Mi limits) — vacuum commit reloads
      # needle maps; observed 183Mi + unseen spike — peak x 1.2
      memory: 224Mi
    limits:
      cpu: 1000m
      memory: 336Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
  filer:
    replicas: 1
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 384Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    persistence:
      enabled: true
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi
  s3:
    replicas: 1
    requests:
      cpu: 50m
      # OOMKilled at 528Mi during a loki-flush write burst (flat 217Mi baseline,
      # burst 391Mi+) — burst x 1.2, limit 1.5x
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 768Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
