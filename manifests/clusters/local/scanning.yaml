apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: scanning
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: namespaces
    - name: sources
    - name: policies-config
    - name: security-config
    - name: storage-config
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/bases/scanning
  prune: true
  wait: true
  timeout: 10m
