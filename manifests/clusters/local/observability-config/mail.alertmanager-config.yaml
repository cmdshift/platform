# routes alerts to mailpit (smtp.cloud.test) — read them at http://mail.cloud.test
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: mail
  namespace: observability
spec:
  route:
    groupBy: [alertname, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: email
    routes:
      # SLO burn-rate alerts (slo.rules.yaml): tighter grouping than the root route so
      # a burning budget pages fast; matched on the `slo` label, not severity
      # (cmdshift/platform#85)
      - matchers:
          - name: slo
            value: "true"
        groupBy: [alertname]
        groupWait: 30s
        groupInterval: 1m
        repeatInterval: 1h
        receiver: email
  receivers:
    - name: email
      emailConfigs:
        - to: you@cloud.test
          smarthost: "smtp.cloud.test:25"
          from: alertmanager@cloud.test
          requireTLS: false
          sendResolved: true
