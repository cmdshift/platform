apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - access.yaml
  - sources.yaml
  - crds.yaml
  - secrets.yaml
  - secrets-config.yaml
  - certificates.yaml
  - certificates-config.yaml
  - networking.yaml
  - networking-config.yaml
  - flux.yaml
  - flux-config.yaml
  # security applies in the early wave (right after networking) — tetragon's
  # BPF policies must be loaded before the bulk of workload namespaces boot, or
  # containers that start during the bootstrap window are invisible to the
  # pod-scoped enforcement until their next container restart (security/README.md).
  # It no longer waits on storage/policies — tetragon needs neither; trivy moved
  # to the scanning/ group precisely to keep this dependency set minimal.
  - security.yaml
  - security-config.yaml
  # policies/datastores/backups/security were trimmed for the cmdshift/platform#146
  # bootstrap (the full stack drowned the install failure being diagnosed) and are
  # re-enabled group-by-group — policies (kyverno) landed clean first. The trim
  # is fully lifted; delete this comment once nothing else re-trims.
  - policies.yaml
  - policies-config.yaml
  - storage.yaml
  - storage-config.yaml
  - datastores.yaml
  - datastores-config.yaml
  # - observability.yaml
  # - observability-config.yaml
  - backups.yaml
  - backups-config.yaml
  - scanning.yaml
  - scanning-config.yaml
