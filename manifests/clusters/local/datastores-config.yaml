apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: datastores-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: datastores
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/bases/datastores-config
  prune: true
  wait: true
  timeout: 5m
