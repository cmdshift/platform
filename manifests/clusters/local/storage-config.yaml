apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  # PVC-creating groups (objects, observability, backups) depend on this, not storage
  # (invariant: manifests/README.md dependency rules)
  dependsOn:
    - name: storage
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/bases/storage-config
  prune: true
  wait: true
  timeout: 5m
