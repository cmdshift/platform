# The pipeline's source. Duplicated in cluster/local/bootstrap extraObjects for fresh
# installs (twin omits provider/timeout; CRD defaults fill them); flux-config
# force-adopts this object and converges it on first reconcile.
apiVersion: source.toolkit.fluxcd.io/v1
kind: Bucket
metadata:
  name: main
  namespace: flux-system
spec:
  interval: 5m
  endpoint: s3.cloud.test
  bucketName: flux
  secretRef:
    name: bucket-credentials
  insecure: true
  provider: generic
  timeout: 60s
