apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../bases/observability
configMapGenerator:
  - name: openobserve-values
    namespace: observability
    files:
      - values.yaml=openobserve-values.yaml
    options:
      disableNameSuffixHash: true
  - name: openobserve-collector-agent-values
    namespace: observability
    files:
      - values.yaml=openobserve-collector-agent-values.yaml
    options:
      disableNameSuffixHash: true
  - name: openobserve-collector-gateway-values
    namespace: observability
    files:
      - values.yaml=openobserve-collector-gateway-values.yaml
    options:
      disableNameSuffixHash: true
  - name: kube-state-metrics-values
    namespace: observability
    files:
      - values.yaml=kube-state-metrics-values.yaml
    options:
      disableNameSuffixHash: true
  - name: metrics-server-values
    namespace: kube-system
    files:
      - values.yaml=metrics-server-values.yaml
    options:
      disableNameSuffixHash: true
  - name: vpa-values
    namespace: kube-system
    files:
      - values.yaml=vpa-values.yaml
    options:
      disableNameSuffixHash: true
