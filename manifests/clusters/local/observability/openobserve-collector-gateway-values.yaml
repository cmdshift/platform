fullnameOverride: openobserve-collector-gateway

mode: deployment

rewriteDeprecatedComponentNames: false

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: 0.158.0

presets:
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: false

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [services, endpoints, endpointslices, pods, nodes, namespaces]
      verbs: [get, list, watch]
    - apiGroups: [""]
      resources: [nodes/metrics, nodes/proxy, nodes/stats]
      verbs: [get, list, watch]
    - nonResourceURLs: [/metrics]
      verbs: [get]

replicaCount: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1536Mi

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: 4317
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: 4318
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888

config:
  exporters:
    otlphttp/openobserve:
      endpoint: http://openobserve.observability.svc:5080/api/default/
      headers:
        Authorization: "Basic YWRtaW5AY2xvdWQudGVzdDpDb21wbGV4cGFzcyMxMjM="
    debug: null
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
    jaeger: null
    zipkin: null
    prometheus:
      config:
        scrape_configs:
          - job_name: kube-state-metrics
            scrape_interval: 30s
            scrape_timeout: 10s
            static_configs:
              - targets: ["kube-state-metrics.observability.svc:8080"]
          - job_name: kube-apiserver
            scheme: https
            scrape_interval: 30s
            scrape_timeout: 10s
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              type: Bearer
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names: [default]
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
                action: keep
                regex: kubernetes;https
          - job_name: kube-scheduler
            scheme: https
            scrape_interval: 30s
            scrape_timeout: 10s
            tls_config:
              insecure_skip_verify: true
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              type: Bearer
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_component]
                action: keep
                regex: kube-scheduler
              - source_labels: [__address__]
                action: replace
                regex: "([^:]+)(?::\\d+)?"
                replacement: "$1:10259"
                target_label: __address__
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
          - job_name: kube-controller-manager
            scheme: https
            scrape_interval: 30s
            scrape_timeout: 10s
            tls_config:
              insecure_skip_verify: true
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              type: Bearer
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [kube-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_component]
                action: keep
                regex: kube-controller-manager
              - source_labels: [__address__]
                action: replace
                regex: "([^:]+)(?::\\d+)?"
                replacement: "$1:10257"
                target_label: __address__
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
          - job_name: cadvisor
            scheme: https
            scrape_interval: 30s
            scrape_timeout: 10s
            metrics_path: /metrics/cadvisor
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              type: Bearer
            kubernetes_sd_configs:
              - role: node
            metric_relabel_configs:
              - action: keep
                regex: container_fs_(reads_total|writes_total|reads_bytes_total|writes_bytes_total)
                source_labels: [__name__]
              - action: drop
                regex: ".+;"
                separator: ";"
                source_labels: [id, pod]
            relabel_configs:
              - action: replace
                replacement: kubelet
                target_label: job
              - action: replace
                source_labels: [__meta_kubernetes_node_name]
                target_label: node
          - job_name: cilium-agent
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: endpoints
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_app_kubernetes_io_name]
                action: keep
                regex: kube-system;cilium-agent
              - source_labels: [__meta_kubernetes_endpoint_port_name]
                action: keep
                regex: metrics
          - job_name: cilium-operator
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_io_cilium_app, __meta_kubernetes_service_label_name]
                action: keep
                regex: kube-system;operator;cilium-operator
              - source_labels: [__meta_kubernetes_service_port_name]
                action: keep
                regex: metrics
          - job_name: hubble-relay
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_k8s_app]
                action: keep
                regex: kube-system;hubble-relay
              - source_labels: [__meta_kubernetes_service_port_name]
                action: keep
                regex: metrics
          - job_name: kyverno-admission-controller
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_app_kubernetes_io_component, __meta_kubernetes_service_label_app_kubernetes_io_instance]
                action: keep
                regex: policies;admission-controller;kyverno
              - source_labels: [__meta_kubernetes_service_port_name]
                action: keep
                regex: metrics-port
          - job_name: kyverno-background-controller
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_app_kubernetes_io_component, __meta_kubernetes_service_label_app_kubernetes_io_instance]
                action: keep
                regex: policies;background-controller;kyverno
              - source_labels: [__meta_kubernetes_service_port_name]
                action: keep
                regex: metrics-port
          - job_name: kyverno-cleanup-controller
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_app_kubernetes_io_component, __meta_kubernetes_service_label_app_kubernetes_io_instance]
                action: keep
                regex: policies;cleanup-controller;kyverno
              - source_labels: [__meta_kubernetes_service_port_name]
                action: keep
                regex: metrics-port
          - job_name: kyverno-reports-controller
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_app_kubernetes_io_component, __meta_kubernetes_service_label_app_kubernetes_io_instance]
                action: keep
                regex: policies;reports-controller;kyverno
              - source_labels: [__meta_kubernetes_service_port_name]
                action: keep
                regex: metrics-port
          - job_name: tetragon
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_app_kubernetes_io_instance, __meta_kubernetes_service_label_app_kubernetes_io_name]
                action: keep
                regex: security;tetragon;tetragon
              - source_labels: [__meta_kubernetes_service_port_name]
                action: keep
                regex: metrics
          - job_name: tetragon-operator
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_app_kubernetes_io_instance, __meta_kubernetes_service_label_app_kubernetes_io_name]
                action: keep
                regex: security;tetragon;tetragon-operator
              - source_labels: [__meta_kubernetes_service_port_name]
                action: keep
                regex: metrics
          - job_name: trivy-operator
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_app_kubernetes_io_instance, __meta_kubernetes_service_label_app_kubernetes_io_name]
                action: keep
                regex: security;trivy-operator;trivy-operator
              - source_labels: [__meta_kubernetes_service_port_name]
                action: keep
                regex: metrics
          - job_name: velero
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_app_kubernetes_io_instance, __meta_kubernetes_service_label_app_kubernetes_io_name]
                action: keep
                regex: backups;velero;velero
              - source_labels: [__meta_kubernetes_service_port_name]
                action: keep
                regex: http-monitoring
          - job_name: valkey-operator
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_app_kubernetes_io_instance, __meta_kubernetes_service_label_app_kubernetes_io_name]
                action: keep
                regex: datastores;valkey-operator;valkey-operator
              - source_labels: [__meta_kubernetes_service_port_name]
                action: keep
                regex: http
          - job_name: openobserve
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: service
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_app_kubernetes_io_instance]
                action: keep
                regex: observability;openobserve
              - source_labels: [__meta_kubernetes_service_port_name]
                action: keep
                regex: http
          - job_name: openobserve-collector
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: endpoints
            relabel_configs:
              - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_label_app_kubernetes_io_instance]
                action: keep
                regex: observability;openobserve-collector
              - source_labels: [__meta_kubernetes_endpoint_port_name]
                action: keep
                regex: monitoring
          - job_name: flux-controllers
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names: [flux-system]
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                action: keep
                regex: (source-controller|helm-controller|kustomize-controller|notification-controller)
              - source_labels: [__meta_kubernetes_pod_container_port_name]
                action: keep
                regex: http-prom
  service:
    pipelines:
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/openobserve]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/openobserve]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/openobserve]
