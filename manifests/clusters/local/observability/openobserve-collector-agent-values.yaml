fullnameOverride: openobserve-collector-agent

mode: daemonset

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: 0.158.0

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  hostMetrics:
    enabled: true
  kubeletMetrics:
    enabled: true
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: false
  clusterMetrics:
    enabled: true

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [nodes/stats, nodes/proxy, nodes/metrics]
      verbs: [get, list, watch]

podSecurityContext:
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsUser: 0
  runAsNonRoot: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    # DAC_READ_SEARCH for the 0700 root-owned apiserver audit dir (cmdshift/platform#208) —
    # root with dropped-ALL cannot bypass DAC
    add:
      - DAC_READ_SEARCH

tolerations:
  - operator: Exists

# kube-apiserver audit logs (cmdshift/platform#90/#208) — written on ctrl only;
# ro mount, reads ride DAC_READ_SEARCH
extraVolumes:
  - name: audit-logs
    hostPath:
      path: /var/log/audit
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: audit-logs
    mountPath: /var/log/audit
    readOnly: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

extraEnvs:
  - name: O2_AUTH_BASIC
    valueFrom:
      secretKeyRef:
        name: openobserve-credentials
        key: O2_AUTH_BASIC

ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888

rewriteDeprecatedComponentNames: false

config:
  processors:
    transform/parse_json:
      error_mode: ignore
      log_statements:
        - context: log
          statements:
            - merge_maps(attributes, ParseJSON(body), "upsert") where IsString(body) and IsMatch(body, "^\\s*\\{")
  exporters:
    debug: null
    otlphttp/openobserve_logs:
      endpoint: http://openobserve.observability.svc:5080/api/default/
      headers:
        Authorization: ${env:O2_AUTH_BASIC}
        stream-name: k8s_logs
    otlphttp/openobserve_audit:
      endpoint: http://openobserve.observability.svc:5080/api/default/
      headers:
        Authorization: ${env:O2_AUTH_BASIC}
        stream-name: k8s_audit
    otlphttp/openobserve:
      endpoint: http://openobserve.observability.svc:5080/api/default/
      headers:
        Authorization: ${env:O2_AUTH_BASIC}
  receivers:
    jaeger: null
    zipkin: null
    otlp: null
    prometheus: null
    filelog/audit:
      # apiserver audit events (cmdshift/platform#208) — JSON lines; rotate
      # chain only on ctrl, idle elsewhere. start_at end: forward-only, no
      # history backfill (O2 retention is 10d). Redaction happens HERE on the
      # body — O2 stores/queries the raw body string, so attribute-level
      # deletion would still ship secret values (live-verified)
      include:
        - /var/log/audit/kube/*.log
      start_at: end
      include_file_path: true
      operators:
        # body → map so the payload keys below are removable; drop (not send)
        # on parse failure — a malformed line shipped raw would carry secret values
        - type: json_parser
          parse_to: body
          on_error: drop
        # on_error send: a remove of an ABSENT field must not error the batch —
        # entries that carry the key are still redacted, the rest pass through.
        # the != nil presence guards keep absent-field removes from even
        # attempting (each would otherwise log an error per entry)
        - type: remove
          field: body.requestObject
          on_error: send
          if: 'body.objectRef != nil and body.objectRef.resource == "secrets" and body.requestObject != nil'
        - type: remove
          field: body.responseObject
          on_error: send
          if: 'body.objectRef != nil and body.objectRef.resource == "secrets" and body.responseObject != nil'
        - type: remove
          field: body.object
          on_error: send
          if: 'body.objectRef != nil and body.objectRef.resource == "secrets" and body.object != nil'
        - type: add
          field: attributes["job"]
          value: audit
    hostmetrics:
      collection_interval: 60s
      scrapers:
        cpu:
          metrics:
            system.cpu.utilization:
              enabled: true
        memory:
          metrics:
            system.memory.utilization:
              enabled: true
    kubeletstats:
      collection_interval: 60s
      extra_metadata_labels:
        - container.id
        - k8s.volume.type
      metric_groups:
        - node
        - pod
        - container
        - volume
      metrics:
        k8s.pod.cpu_limit_utilization:
          enabled: true
        k8s.pod.cpu_request_utilization:
          enabled: true
        k8s.pod.memory_limit_utilization:
          enabled: true
        k8s.pod.memory_request_utilization:
          enabled: true
    k8s_cluster:
      node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
  service:
    pipelines:
      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, transform/parse_json, batch]
        exporters: [otlphttp/openobserve_logs]
      logs/audit:
        receivers: [filelog/audit]
        # no transform: O2 flattens the map body into body_* columns itself —
        # a transform-side attribute merge only double-stores every field
        processors: [memory_limiter, batch]
        exporters: [otlphttp/openobserve_audit]
      metrics:
        receivers: [hostmetrics, kubeletstats]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/openobserve]
      traces: null
