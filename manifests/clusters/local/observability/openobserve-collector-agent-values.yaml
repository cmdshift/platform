fullnameOverride: openobserve-collector-agent

mode: daemonset

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: 0.158.0

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  hostMetrics:
    enabled: true
  kubeletMetrics:
    enabled: true
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: false
  clusterMetrics:
    enabled: true

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [nodes/stats, nodes/proxy, nodes/metrics]
      verbs: [get, list, watch]

podSecurityContext:
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsUser: 0
  runAsNonRoot: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

tolerations:
  - operator: Exists

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

extraEnvs:
  - name: O2_AUTH_BASIC
    valueFrom:
      secretKeyRef:
        name: openobserve-credentials
        key: O2_AUTH_BASIC

ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888

rewriteDeprecatedComponentNames: false

config:
  processors:
    transform/parse_json:
      error_mode: ignore
      log_statements:
        - context: log
          statements:
            - merge_maps(attributes, ParseJSON(body), "upsert") where IsString(body) and IsMatch(body, "^\\s*\\{")
  exporters:
    debug: null
    otlphttp/openobserve_logs:
      endpoint: http://openobserve.observability.svc:5080/api/default/
      headers:
        Authorization: ${env:O2_AUTH_BASIC}
        stream-name: k8s_logs
    otlphttp/openobserve:
      endpoint: http://openobserve.observability.svc:5080/api/default/
      headers:
        Authorization: ${env:O2_AUTH_BASIC}
  receivers:
    jaeger: null
    zipkin: null
    otlp: null
    prometheus: null
    hostmetrics:
      collection_interval: 60s
      scrapers:
        cpu:
          metrics:
            system.cpu.utilization:
              enabled: true
        memory:
          metrics:
            system.memory.utilization:
              enabled: true
    kubeletstats:
      collection_interval: 60s
      extra_metadata_labels:
        - container.id
        - k8s.volume.type
      metric_groups:
        - node
        - pod
        - container
        - volume
      metrics:
        k8s.pod.cpu_limit_utilization:
          enabled: true
        k8s.pod.cpu_request_utilization:
          enabled: true
        k8s.pod.memory_limit_utilization:
          enabled: true
        k8s.pod.memory_request_utilization:
          enabled: true
  service:
    pipelines:
      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, transform/parse_json, batch]
        exporters: [otlphttp/openobserve_logs]
      metrics:
        receivers: [hostmetrics, kubeletstats]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/openobserve]
      traces: null
