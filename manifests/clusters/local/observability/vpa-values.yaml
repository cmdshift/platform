recommender:
  enabled: true
  extraArgs:
    v: "4"
    pod-recommendation-min-cpu-millicores: "2"
    pod-recommendation-min-memory-mb: "10"
  resources:
    requests:
      cpu: 10m
      memory: 48Mi # 12h max 37Mi — old 128Mi was 3.4x the observed peak
    limits:
      cpu: 200m # 16% of CFS periods throttled at 200m — bursty recommend loops, keep headroom
      memory: 72Mi
updater:
  enabled: false
admissionController:
  enabled: false
