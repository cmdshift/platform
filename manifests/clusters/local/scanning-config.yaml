apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: scanning-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: scanning
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/bases/scanning-config
  # ClusterComplianceReports are trivy-operator CRDs — this group depends on
  # scanning (the operator installs the CRDs via its helm chart)
  prune: true
  timeout: 2m
