apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: scanning-config
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: scanning
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/clusters/local/scanning-config
  prune: true
  timeout: 2m
