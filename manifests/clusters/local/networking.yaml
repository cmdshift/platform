apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: networking
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: crds
    - name: certificates
    # cilium ztunnel mode mounts cilium-ztunnel-secrets non-optionally — the
    # CA Certificate (certificates-config) must be issued first or the agent
    # pods fail with FailedMount (cmdshift/platform#87)
    - name: certificates-config
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/bases/networking
  prune: true
  wait: true
  timeout: 10m
