apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: networking
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: crds
    - name: certificates
    - name: certificates-config
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/bases/networking
  prune: true
  wait: true
  timeout: 10m
