apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 5s
  dependsOn:
    - name: sources
  sourceRef:
    kind: Bucket
    name: main
  path: ./manifests/clusters/local/crds
  prune: false
  wait: true
  timeout: 2m
