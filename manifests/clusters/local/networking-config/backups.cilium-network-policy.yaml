apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backups
  namespace: backups
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
    # S3 (RustFS via haproxy)
    - toFQDNs:
        - matchName: s3.cloud.test
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Node agent reads PVCs on the node (hostPath)
    - toEntities:
        - host
    # talos-backup pulls the etcd snapshot from the ctrl nodes' Talos apid
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
