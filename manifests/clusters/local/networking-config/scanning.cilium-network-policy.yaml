apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: scanning
  namespace: scanning
spec:
  endpointSelector: {}
  egress:
    # trivy-operator manages CRDs/leases
    - toEntities:
        - kube-apiserver
    # trivy: all image/DB pulls go through the angos caching registry (plain HTTP :80,
    # manifests/README.md) — scan-job image refs via the chart's registry.mirror
    # rewrite, DB via dbRegistry. world:443 stays as fallback for upstreams outside the map
    - toFQDNs:
        - matchName: registry.cloud.test
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  # no ingress section: egress-only default-deny; metrics ports stay scrapeable
