# strict parser: unknown keys panic at boot — verify every field against the rauthy reference config before adding one
[server]
scheme = 'http'
pub_url = 'auth.cloud.test'
proxy_mode = true
trusted_proxies = ['${trusted_proxies}']
http_workers = 1

[encryption]
keys = ['${encryption_key_id}/${encryption_key}']
key_active = '${encryption_key_id}'

[cluster]
node_id = 1
nodes = ["1 localhost:8100 localhost:8200"]
secret_raft = '${cluster_secret_raft}'
secret_api = '${cluster_secret_api}'
log_sync = 'immediate'

[database]
hiqlite = true

[bootstrap]
admin_email = 'admin@localhost'
password_plain = '${bootstrap_admin_password}'

[webauthn]
rp_id = 'auth.cloud.test'
rp_origin = 'https://auth.cloud.test:443'
rp_name = 'platform'

[logging]
level = 'info'
