global
  maxconn 60000
  log stdout format raw daemon info

defaults main
  mode http
  log global
  timeout connect 5s
  timeout client 10s
  timeout server 10s

frontend web
  bind *:80
  default_backend web

backend web
  option tcp-check
%{~for server in servers}
  server ${server.name} ${server.ipv4}:30080 check
%{~endfor}

frontend web_tls
  # tcp passthrough — the Gateway terminates TLS; defaults' mode http would
  # parse the ClientHello as HTTP and mangle the handshake
  mode tcp
  bind *:443
  default_backend web_tls

backend web_tls
  mode tcp
  option tcp-check
  # defaults' 10s client/server timeout would cut idle TLS connections
  timeout server 10m
%{~for server in servers}
  server ${server.name} ${server.ipv4}:30443 check
%{~endfor}
