global
  maxconn 60000
  log stdout format raw daemon info
  stats socket /tmp/haproxy-admin.sock mode 660 level admin

defaults
  log global
  timeout connect 5s
  timeout client  30s
  timeout server  30s
  timeout tunnel  1h

listen stats
  mode http
  bind *:8404
  stats enable
  stats uri /stats

frontend k8s_frontend
  mode tcp
  bind *:6443
  option tcplog
  use_backend k8s_backend

backend k8s_backend
  balance leastconn
  option tcp-check
  %{~for node in ctrl}
  server ${node.name} ${node.ipv4}:6443 check inter 1s fall 3 rise 2
  %{~endfor}

frontend apid_frontend
  mode tcp
  bind *:50000
  option tcplog
  use_backend apid_backend

backend apid_backend
  balance leastconn
  option tcp-check
  %{~for node in ctrl}
  server ${node.name} ${node.ipv4}:50000 check inter 1s fall 3 rise 2
  %{~endfor}

frontend web_frontend
  mode tcp
  bind *:80
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.proto_http }

  acl is_browser req.hdr(user-agent) -m sub Mozilla/5.0
  acl is_local   req.hdr(host),field(1,:) -i ${local_hostname}
  acl is_local   req.hdr(host),field(1,:) -m end .${local_hostname}
  acl is_cloud   req.hdr(host),field(1,:) -i ${cloud_hostname}
  acl is_cloud   req.hdr(host),field(1,:) -m end .${cloud_hostname}

  use_backend cloud_redirect_https if is_browser is_cloud
  use_backend local_backend        if is_local
  use_backend cloud_backend        if is_cloud

  default_backend http_reject_backend

  option tcplog
  log-format "%tr %ci:%cp %ST Host=%[capture.req.hdr(0)]"
  capture request header Host len 128

frontend web_tls_frontend
  mode tcp
  bind *:443
  tcp-request inspect-delay 5s
  tcp-request content reject unless { req.ssl_hello_type 1 }
  tcp-request content reject unless { req.ssl_sni -m found }

  tcp-request content set-var(txn.sni) req.ssl_sni

  acl is_local req.ssl_sni -i ${local_hostname}
  acl is_local req.ssl_sni -m end .${local_hostname}
  acl is_cloud req.ssl_sni -i ${cloud_hostname}
  acl is_cloud req.ssl_sni -m end .${cloud_hostname}

  tcp-request content reject unless is_local or is_cloud

  use_backend local_tls_backend    if is_local
  use_backend cloud_tls_terminator if is_cloud

  option tcplog
  log-format "%tr %ci:%cp %ST SNI=%[var(txn.sni)]"

frontend cloud_smtp_frontend
  mode tcp
  bind ${internal_ip}:25
  default_backend cloud_smtp_backend

backend cloud_redirect_https
  mode http
  http-request redirect code 301 location https://%[hdr(host)]%[path]

backend local_backend
  mode tcp
  option tcp-check
%{~for server in work}
  server ${server.name} ${server.ipv4}:30080 check
%{~endfor}

backend local_tls_backend
  mode tcp
  option tcp-check
%{~for server in work}
  server ${server.name} ${server.ipv4}:30443 check
%{~endfor}

backend cloud_tls_terminator
  mode tcp
  server cloud_tls_loopback 127.0.0.1:8443 check check-ssl check-send-proxy verify none send-proxy-v2

frontend cloud_tls_loopback
  mode http
  bind 127.0.0.1:8443 ssl crt /usr/local/etc/haproxy/cloud.pem alpn h2,http/1.1 accept-proxy
  http-request set-var(txn.hostname) hdr(host),lower
  use_backend cloud_backend

backend cloud_backend
  mode http
  http-request set-var(txn.host) hdr(host),lower,regsub(:[0-9]*$,'')
  http-request deny deny_status 403 if !{ var(txn.host),map(/usr/local/etc/haproxy/hosts.map) -m found }
  http-request set-dst var(txn.host),map(/usr/local/etc/haproxy/hosts.map)
  http-request set-dst-port var(txn.host),map(/usr/local/etc/haproxy/ports.map)
  server clear 0.0.0.0:0

backend http_reject_backend
  mode http
  http-request return status 403 content-type text/plain string "Forbidden"

backend cloud_smtp_backend
  mode tcp
%{ for server in smtp ~}
  server ${server.name} ${server.private_ip}:1025 check
%{ endfor ~}
