[server]
bind_address = "0.0.0.0"

[ui]
enabled = true

[blob_store.fs]
root_dir = "/data"

[global.access_policy]
default = "allow"

[global.scan]
url = "${scan.url}"
token = "${scan.token}"

%{ for path, registry in registries ~}
[repository."${path}"]
namespace = "${registry.name}"

[[repository."${path}".upstream]]
url = "${registry.remote}"

[repository."${path}".scan]
default = "skip"
rules = ["image.scanned_at < now() - days(7)"]
%{ endfor ~}

[auth.identity.platform]
username = "${registry_username}"
password = "${registry_password}"

[repository."platform"]

[repository."platform".scan]
default = "skip"
rules = ["image.scanned_at < now() - days(7)"]
