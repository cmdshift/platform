cluster:
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
  controlPlane:
    endpoint: ${public_endpoint}
  apiServer:
    certSANs:
      - ${cmd_hostname}
      - ${cmd_private_ip}
    extraArgs:
      oidc-issuer-url: https://auth.cloud.test/auth/v1/
      oidc-client-id: kubernetes
      oidc-username-claim: preferred_username
      oidc-groups-claim: groups
      oidc-ca-file: /var/etc/oidc/ca.crt
      max-requests-inflight: "100"
      max-mutating-requests-inflight: "50"
    extraVolumes:
      - hostPath: /var/etc/oidc
        mountPath: /var/etc/oidc
        readonly: true
    auditPolicy:
${indent(6, audit_policy)}
  network:
    cni:
      name: none
  proxy:
    disabled: true
  etcd:
    advertisedSubnets:
      - ${ctrl_cidr}
    extraArgs:
      heartbeat-interval: "500"
      election-timeout: "5000"
