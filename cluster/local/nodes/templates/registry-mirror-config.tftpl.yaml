# Wildcard mirror: every registry routes to the caching proxy with the
# original /v2/ path preserved (no overridePath) — containerd appends the
# upstream host as the ?ns= parameter, which angos resolves to the claiming
# repository. New upstream registries only need a registry_map entry
# (terraform apply recreates the proxy); the node config never changes.
---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: "*"
endpoints:
  - url: "http://${registry_hostname}"
skipFallback: true
