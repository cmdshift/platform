machine:
  nodeLabels:
    k8s-role/ctrl: ""
  # platform root CA for the kube-apiserver's OIDC client (--oidc-ca-file,
  # cmdshift/platform#131): the auth companion's chain is leaf+intermediate under
  # this root. Ctrl-patch list only — workers never validate auth.cloud.test.
  files:
    - content: |-
        ${indent(8, platform_root_ca)}
      permissions: 644
      path: /var/etc/oidc/ca.crt
      op: create
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:reader
        - os:etcd:backup
      # kubelet verifies image pulls through the Talos API on ctrl — namespaces hosting
      # workloads that must schedule there have to be listed or pulls fail (cmdshift/platform#90);
      # backups needs the talos-backup ServiceAccount secret consumption too
      allowedKubernetesNamespaces:
        - kube-system
        - logging
        - backups
