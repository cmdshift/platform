machine:
  nodeLabels:
    k8s-role/ctrl: ""
  files:
    - content: |-
        ${indent(8, platform_root_ca)}
      permissions: 644
      path: /var/etc/oidc/ca.crt
      op: create
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:reader
        - os:etcd:backup
      allowedKubernetesNamespaces:
        - kube-system
        - logging
        - backups
