machine:
  features:
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
  certSANs:
    - ${cmd_hostname}
    - ${cmd_private_ip}
  kubelet:
    extraArgs:
      rotate-server-certificates: "true"
    extraMounts:
      - destination: /var/mnt/local-path-provisioner
        type: bind
        source: /var/mnt/local-path-provisioner
        options:
          - bind
          - rshared
          - rw
    nodeIP:
      validSubnets:
        - ${ctrl_cidr}
        - ${work_cidr}
  network:
    nameservers:
      - ${dns_private_ip}
  time:
    servers:
      - time.cloudflare.com
      - ntp1.net.berkeley.edu
      - pool.ntp.org
