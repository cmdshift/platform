global
  maxconn 60000
  log stdout format raw daemon info

defaults main
  mode tcp
  log global
  timeout connect 5s
  timeout client 10s
  timeout server 10s

frontend k8s
  bind *:6443
  use_backend k8s

backend k8s
  balance leastconn
  option tcp-check
%{~for node in nodes}
  server ${node.name} ${node.ipv4}:6443 check
%{~endfor}

frontend apid
  bind *:50000
  use_backend apid

backend apid
  balance leastconn
  option tcp-check
%{~for node in nodes}
  server ${node.name} ${node.ipv4}:50000 check
%{~endfor}
