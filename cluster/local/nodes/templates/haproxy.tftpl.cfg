global
  maxconn 60000
  log stdout format raw daemon info
  stats socket /tmp/haproxy-admin.sock mode 660 level admin

defaults main
  mode tcp
  log global
  timeout connect 5s
  timeout client 30m
  timeout server 30m
  retries 3

listen stats
  mode http
  bind *:8404
  stats enable
  stats uri /stats

frontend k8s
  bind *:6443
  option tcplog
  acl not_all_servers_up nbsrv(apid) lt ${node_count}
  tcp-request connection reject if not_all_servers_up
  use_backend k8s

backend k8s
  balance leastconn
  option tcp-check
  %{~for node in nodes}
  server ${node.name} ${node.ipv4}:6443 check inter 1s fall 3 rise 2
  %{~endfor}

frontend apid
  option tcplog
  bind *:50000
  use_backend apid

backend apid
  balance leastconn
  option tcp-check
  %{~for node in nodes}
  server ${node.name} ${node.ipv4}:50000 check inter 1s fall 3 rise 2
  %{~endfor}
