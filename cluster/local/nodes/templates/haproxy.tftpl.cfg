global
  maxconn 60000
  log stdout format raw daemon info

defaults main
  mode tcp
  log global
  timeout connect 5s
  timeout client 10s
  timeout server 10s
  retries 3

frontend k8s
  bind *:6443
  acl not_all_servers_up nbsrv(apid) lt ${node_count}
  tcp-request connection reject if not_all_servers_up
  use_backend k8s

backend k8s
  balance leastconn
  option tcp-check
  %{~for node in nodes}
  server ${node.name} ${node.ipv4}:6443 check inter 5s fall 10 rise 3
  %{~endfor}

frontend apid
  acl not_all_servers_up nbsrv(apid) lt ${node_count}
  tcp-request connection reject if not_all_servers_up
  bind *:50000
  use_backend apid

backend apid
  balance leastconn
  option tcp-check
  %{~for node in nodes}
  server ${node.name} ${node.ipv4}:50000 check inter 5s fall 10 rise 3
  %{~endfor}
