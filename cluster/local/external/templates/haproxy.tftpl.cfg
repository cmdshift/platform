global
  maxconn 60000
  log stdout format raw daemon info

defaults main
  mode http
  log global
  timeout connect 5s
  timeout client 630s
  timeout server 630s

frontend cloud
  option httplog
  bind *:80
  # UA-gated redirect (cmdshift/platform#130): browsers carry Mozilla/5.0,
  # cluster consumers (S3 clients, containerd, ESO, rc) don't — humans get
  # https, machine traffic stays on :80.
  http-request redirect scheme https if { req.hdr(user-agent) -m sub Mozilla/5.0 }
  capture request header Host len 128
  capture request header User-Agent len 128
  http-request set-var(txn.hostname) hdr(host),lower
  log-format "%tr %ci:%cp %ST \"%[capture.req.method]\" \"%[capture.req.uri]\" Host=%[capture.req.hdr(0)]"
  use_backend cloud

# TLS terminates here (cmdshift/platform#130); backends stay plain HTTP —
# the Host-header routing in the shared backend is scheme-independent.
# Cluster consumers (flux bucket, ESO store, velero BSL, registry mirror)
# deliberately remain on :80 (cmdshift/platform#131 migrates them).
frontend cloud-tls
  option httplog
  bind *:443 ssl crt /usr/local/etc/haproxy/cloud.test.pem alpn h2,http/1.1
  capture request header Host len 128
  capture request header User-Agent len 128
  http-request set-var(txn.hostname) hdr(host),lower
  log-format "%tr %ci:%cp %ST \"%[capture.req.method]\" \"%[capture.req.uri]\" Host=%[capture.req.hdr(0)]"
  use_backend cloud

backend cloud
  # an unmatched Host must 403, not loop: set-dst no-ops when the map misses,
  # leaving dst = haproxy itself (the talos-backup virtual-host PUT recursion —
  # self-flooded 25k conns, OOM 137)
  http-request set-var(txn.host) hdr(host),lower,regsub(:[0-9]*$,'') # strip port (external-secrets webhook provider)
  http-request deny deny_status 403 if !{ var(txn.host),map(/usr/local/etc/haproxy/hosts.map) -m found }
  http-request set-dst var(txn.host),map(/usr/local/etc/haproxy/hosts.map)
  http-request set-dst-port var(txn.host),map(/usr/local/etc/haproxy/ports.map)
  server clear 0.0.0.0:0

frontend cloud-smtp
  mode tcp
  bind *:25
  tcp-request inspect-delay 5s
  tcp-request content accept
  default_backend smtp

backend smtp
  mode tcp
%{ for server in smtp ~}
  server ${server.name} ${server.private_ip}:1025 check
%{ endfor ~}
